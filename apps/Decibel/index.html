<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decibel</title>
<meta name="description" content="Decibel: sonometru (ponderări A/C/Z, Fast/Slow, LAeq, Lmax, L10/L50/L90, SEL, doză de zgomot), analizor de spectru 1/3 și 1/1 de octavă, calibrare și audiogramă orientativă. Rulează local, nu trimite nimic.">
<meta name="application-version" content="1.0.0">
<meta name="last-updated" content="2026-10-14">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-CtiwkMXTR70oip65A2PjTvRyvOE3o2tOZZuPftq0Sfc='; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; worker-src blob:; manifest-src 'none'">
<style>
:root{
  color-scheme:light dark;
  --bg:#f6f6f3;--surface:#ffffff;--surface2:#eeede8;--ink:#1d1f23;--ink2:#4a505b;--line:#c9c7be;
  --accent:#2b5fb3;--accent-ink:#ffffff;--accent-soft:#e1eaf8;--focus:#1a56c4;
  --danger:#b42318;--danger-bg:#fdecea;--ok:#16643a;--warn:#7a4b00;--warn-bg:#fdf0d5;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111317;--surface:#1a1d23;--surface2:#232731;--ink:#e9eaee;--ink2:#a9aeb9;--line:#3a3f4c;
    --accent:#8db4ff;--accent-ink:#0b1220;--accent-soft:#1e2a45;--focus:#8db4ff;
    --danger:#ff9087;--danger-bg:#3b1f1d;--ok:#7ddba0;--warn:#f1c76a;--warn-bg:#352a10;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111317;--surface:#1a1d23;--surface2:#232731;--ink:#e9eaee;--ink2:#a9aeb9;--line:#3a3f4c;
  --accent:#8db4ff;--accent-ink:#0b1220;--accent-soft:#1e2a45;--focus:#8db4ff;
  --danger:#ff9087;--danger-bg:#3b1f1d;--ok:#7ddba0;--warn:#f1c76a;--warn-bg:#352a10;
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:.5rem 1rem;z-index:100}
.skip:focus{left:0}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:1.1rem;margin-bottom:.5rem}
h3{font-size:1rem;margin:.9rem 0 .35rem}
p{margin:.4rem 0}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.top{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between;padding:.8rem 0 .4rem}
.top h1{font-size:1.5rem;letter-spacing:.01em}
.sub{margin:.1rem 0 0;color:var(--ink2);font-size:.9rem}
.tools{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:36px;padding:.35rem .8rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;text-align:center}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.big{min-height:52px;font-size:1.1rem;padding:.6rem 1.4rem}
select,input[type=text],input[type=number]{min-height:36px;padding:.3rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);max-width:100%}
input[type=range]{width:100%;min-height:28px;accent-color:var(--accent)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--accent);vertical-align:-3px}
label{display:inline-block}
.banner{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--warn-bg);color:var(--ink);padding:.5rem .8rem;border-radius:6px;font-size:.92rem;margin:.4rem 0}
.banner strong{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0}
.chip{display:inline-flex;gap:.4rem;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.15rem .7rem;font-size:.88rem}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.bad{border-color:var(--warn);color:var(--warn)}
.tabs{display:flex;gap:.25rem;overflow-x:auto;border-bottom:1px solid var(--line);margin:.6rem 0 .8rem;padding-bottom:0}
.tabs button{border:1px solid transparent;border-bottom:none;background:none;padding:.5rem .9rem;border-radius:6px 6px 0 0;cursor:pointer;white-space:nowrap;min-height:40px;color:var(--ink2)}
.tabs button[aria-selected=true]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600;position:relative;top:1px}
.panel{display:block}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem;min-width:0}
.card+.card{margin-top:12px}
.grid>.card+.card{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center;margin:.5rem 0}
.row>label{font-size:.92rem}
.note{color:var(--ink2);font-size:.9rem;overflow-wrap:anywhere}
.alert{border:1px solid var(--danger);background:var(--danger-bg);color:var(--ink);border-radius:6px;padding:.5rem .8rem;margin:.5rem 0}
.alert strong{color:var(--danger)}
.status{font-size:.9rem;margin:.4rem 0;overflow-wrap:anywhere}
.status ul{margin:.3rem 0 0;padding-left:1.2rem}
.ok{color:var(--ok)} .bad{color:var(--danger)} .warnc{color:var(--warn)}
fieldset{border:1px solid var(--line);border-radius:6px;padding:.4rem .7rem;margin:0;min-width:0}
legend{font-size:.85rem;color:var(--ink2);padding:0 .3rem}
fieldset label{margin-right:.8rem;white-space:nowrap;min-height:28px}
.readout{text-align:center}
.big{font-size:clamp(2.6rem,12vw,4.6rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big small{font-size:.35em;font-weight:500;color:var(--ink2);margin-left:.3em}
.lbl{color:var(--ink2);font-size:.9rem;margin-top:.2rem}
.meterbar{height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:5px;margin:.7rem 0 .3rem;overflow:hidden}
.meterbar span{display:block;height:100%;width:0;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:.6rem}
.stat{border:1px solid var(--line);border-radius:6px;padding:.4rem .6rem;background:var(--bg);min-width:0}
.stat .k{font-size:.78rem;color:var(--ink2);overflow-wrap:anywhere}
.stat .v{font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
canvas.cv{width:100%;display:block;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:.3rem .5rem;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--ink2);font-size:.82rem}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
caption{text-align:left;font-weight:600;padding:.2rem 0}
details{border:1px solid var(--line);border-radius:6px;padding:.4rem .7rem;margin:.6rem 0;background:var(--bg)}
summary{cursor:pointer;font-weight:600;min-height:28px}
ul.clean{margin:.3rem 0;padding-left:1.2rem}
ul.clean li{margin:.2rem 0;overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-size:.85em}
.evlist{list-style:none;margin:.3rem 0;padding:0;display:flex;flex-wrap:wrap;gap:.3rem}
.evlist li{border:1px solid var(--line);border-radius:99px;padding:.1rem .6rem;font-size:.85rem;background:var(--bg)}
progress{width:100%;height:12px;accent-color:var(--accent)}
.foot{margin:1.5rem 0 2rem;color:var(--ink2);font-size:.85rem;border-top:1px solid var(--line);padding-top:.7rem}
a{color:var(--accent)}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.85rem;color:var(--ink2);margin:.3rem 0}
.sw{display:inline-block;width:14px;height:3px;background:var(--accent);vertical-align:middle;margin-right:.3rem}
.hear{display:flex;gap:.8rem;flex-wrap:wrap;margin:.6rem 0}
.hear .btn{flex:1 1 160px}
#report{display:none}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:min(560px,calc(100vw - 24px));padding:1rem}
dialog::backdrop{background:rgba(0,0,0,.45)}
@media (max-width:480px){.top h1{font-size:1.3rem}.wrap{padding:0 12px}.card{padding:.7rem .75rem}nav.tabs button{padding:.5rem .6rem}}
@media print{
  html,body{background:#fff!important;color:#000!important}
  body>*:not(#report){display:none!important}
  #report{display:block!important;font-size:11pt}
  #report img{max-width:100%;height:auto;border:1px solid #999}
  #report table{font-size:9pt}
  #report th,#report td{border:1px solid #999;color:#000}
  #report h1{font-size:18pt}#report h2{font-size:13pt;margin-top:12pt}
  #report .warnp{border:2px solid #000;padding:6pt;margin:8pt 0}
}
</style>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip"></a>
<div class="wrap">
<header class="top">
  <div><h1>Decibel</h1><p class="sub" data-i18n="subtitle"></p></div>
  <div class="tools">
    <label for="lang" class="sr" data-i18n="language"></label>
    <select id="lang"><option value="ro">Română</option><option value="en">English</option><option value="fr">Français</option><option value="it">Italiano</option><option value="es">Español</option><option value="pt">Português</option><option value="hu">Magyar</option><option value="de">Deutsch</option></select>
    <button type="button" id="themeBtn" class="btn" data-i18n="theme"></button>
  </div>
</header>
<div class="banner" id="honest" role="note"><strong data-i18n="honest_h"></strong> <span data-i18n="honest_t"></span></div>
<div class="chips" id="chips"></div>
<div class="tabs" role="tablist" id="tabs" data-i18n-aria="tabs_label">
  <button type="button" role="tab" id="t-meas" aria-controls="p-meas" data-tab="meas" data-i18n="tab_meas"></button>
  <button type="button" role="tab" id="t-spec" aria-controls="p-spec" data-tab="spec" data-i18n="tab_spec"></button>
  <button type="button" role="tab" id="t-cal" aria-controls="p-cal" data-tab="cal" data-i18n="tab_cal"></button>
  <button type="button" role="tab" id="t-aud" aria-controls="p-aud" data-tab="aud" data-i18n="tab_aud"></button>
  <button type="button" role="tab" id="t-log" aria-controls="p-log" data-tab="log" data-i18n="tab_log"></button>
  <button type="button" role="tab" id="t-about" aria-controls="p-about" data-tab="about" data-i18n="tab_about"></button>
</div>
<main id="main" tabindex="-1">

<!-- ============ MĂSURARE ============ -->
<section id="p-meas" class="panel" role="tabpanel" aria-labelledby="t-meas" tabindex="-1">
 <div class="grid g2">
  <div class="card" id="srcCard">
    <h2 data-i18n="src_title"></h2>
    <p class="note" data-i18n="mic_expl"></p>
    <div class="row">
      <button type="button" id="btnMic" class="btn primary" data-i18n="btn_mic"></button>
      <button type="button" id="btnStop" class="btn" hidden data-i18n="btn_stop"></button>
      <button type="button" id="btnReset" class="btn" data-i18n="btn_reset"></button>
      <button type="button" id="btnMark" class="btn" disabled data-i18n="btn_mark"></button>
    </div>
    <div class="row">
      <button type="button" id="btnFile" class="btn" data-i18n="btn_file"></button>
      <button type="button" id="btnDemo" class="btn" data-i18n="btn_demo"></button>
      <input type="file" id="fileIn" accept=".wav,audio/*" hidden>
    </div>
    <div class="row"><label for="devSel" data-i18n="device"></label><select id="devSel" disabled><option>—</option></select></div>
    <div id="micStatus" class="status" role="status" aria-live="polite"></div>
    <div id="progWrap" hidden><label for="prog" class="note" data-i18n="processing"></label><progress id="prog" max="100" value="0"></progress></div>
  </div>
  <div class="card">
    <h2 data-i18n="set_title"></h2>
    <div class="row">
      <fieldset><legend data-i18n="weighting"></legend>
        <label><input type="radio" name="wt" value="0" checked> A</label><label><input type="radio" name="wt" value="1"> C</label><label><input type="radio" name="wt" value="2"> Z</label>
      </fieldset>
      <fieldset><legend data-i18n="timew"></legend>
        <label><input type="radio" name="tw" value="0" checked> <span data-i18n="fast"></span></label><label><input type="radio" name="tw" value="1"> <span data-i18n="slow"></span></label>
      </fieldset>
    </div>
    <div class="row"><label for="intSel" data-i18n="interval"></label>
      <select id="intSel"><option value="0" data-i18n="int_all"></option><option value="480">1 min</option><option value="2400">5 min</option><option value="7200">15 min</option></select></div>
    <div class="row"><label for="placeIn" data-i18n="place"></label><input type="text" id="placeIn" maxlength="120" autocomplete="off"></div>
    <div class="row"><label><input type="checkbox" id="autoSave" checked> <span data-i18n="autosave"></span></label></div>
    <div class="row"><button type="button" id="btnSaveNow" class="btn" disabled data-i18n="save_now"></button></div>
  </div>
 </div>

 <div class="card readout" style="margin-top:12px">
   <div class="big"><span id="bigVal">–</span><small id="bigUnit"></small></div>
   <div class="lbl" id="bigLbl" data-i18n="idle"></div>
   <div class="meterbar" aria-hidden="true"><span id="meterFill"></span></div>
   <div id="clipWarn" class="alert" role="alert" hidden></div>
   <div id="rangeWarn" class="note" role="status"></div>
   <p class="note" id="uncText"></p>
   <div class="sr" id="liveSum" role="status" aria-live="polite"></div>
 </div>

 <div class="card">
   <h2 data-i18n="stats_title"></h2>
   <div class="stats" id="stats">
     <div class="stat"><div class="k" id="k-leq"></div><div class="v" id="v-leq">–</div></div>
     <div class="stat"><div class="k" id="k-lmax"></div><div class="v" id="v-lmax">–</div></div>
     <div class="stat"><div class="k" id="k-lmin"></div><div class="v" id="v-lmin">–</div></div>
     <div class="stat"><div class="k" id="k-l10"></div><div class="v" id="v-l10">–</div></div>
     <div class="stat"><div class="k" id="k-l50"></div><div class="v" id="v-l50">–</div></div>
     <div class="stat"><div class="k" id="k-l90"></div><div class="v" id="v-l90">–</div></div>
     <div class="stat"><div class="k" id="k-sel"></div><div class="v" id="v-sel">–</div></div>
     <div class="stat"><div class="k" id="k-pk"></div><div class="v" id="v-pk">–</div></div>
     <div class="stat"><div class="k" data-i18n="duration"></div><div class="v" id="v-dur">0:00</div></div>
     <div class="stat"><div class="k" data-i18n="clip_count"></div><div class="v" id="v-clip">0</div></div>
   </div>
   <p class="note" data-i18n="stats_note"></p>
 </div>

 <div class="card">
   <h2 data-i18n="chart_title"></h2>
   <div class="row">
     <label for="viewSel" data-i18n="view"></label>
     <select id="viewSel"><option value="480" data-i18n="view_60"></option><option value="4800" data-i18n="view_10m"></option><option value="0" data-i18n="view_all"></option></select>
     <button type="button" id="btnLive" class="btn" data-i18n="cursor_live"></button>
   </div>
   <canvas id="chart" class="cv" height="240" role="img" data-i18n-aria="chart_alt"></canvas>
   <div class="legend"><span><span class="sw"></span><span data-i18n="lg_level"></span></span><span data-i18n="lg_leq"></span><span data-i18n="lg_events"></span></div>
   <label for="cursor" class="note" data-i18n="cursor"></label>
   <input type="range" id="cursor" min="0" max="1000" value="1000" aria-describedby="cursorOut">
   <p id="cursorOut" class="note" aria-live="polite"></p>
   <ul class="evlist" id="evList"></ul>
 </div>

 <div class="grid g2" style="margin-top:12px">
  <div class="card">
    <h2 data-i18n="hist_title"></h2>
    <canvas id="hist" class="cv" height="190" role="img" data-i18n-aria="hist_alt"></canvas>
  </div>
  <div class="card">
    <h2 data-i18n="dose_title"></h2>
    <div class="row"><label for="dosePre" data-i18n="dose_preset"></label>
      <select id="dosePre">
        <option value="niosh">NIOSH: 85 dB(A) / 8 h / 3 dB</option>
        <option value="eu80">UE 2003/10/CE: 80 dB(A) / 8 h / 3 dB</option>
        <option value="eu85">UE 2003/10/CE: 85 dB(A) / 8 h / 3 dB</option>
        <option value="eu87">UE 2003/10/CE: 87 dB(A) / 8 h / 3 dB</option>
        <option value="custom" data-i18n="custom"></option></select></div>
    <div class="row">
      <label for="doseLc" data-i18n="dose_lc"></label><input type="number" id="doseLc" step="0.5" min="40" max="130" value="85" style="width:5.5em">
      <label for="doseTc" data-i18n="dose_tc"></label><input type="number" id="doseTc" step="0.5" min="0.25" max="24" value="8" style="width:5em">
      <label for="doseQ" data-i18n="dose_q"></label><input type="number" id="doseQ" step="0.5" min="1" max="10" value="3" style="width:4.5em">
      <label for="doseThr" data-i18n="dose_thr"></label><input type="number" id="doseThr" step="1" min="0" max="120" value="0" style="width:5em">
    </div>
    <div class="stats">
      <div class="stat"><div class="k" data-i18n="dose_val"></div><div class="v" id="v-dose">–</div></div>
      <div class="stat"><div class="k" data-i18n="dose_ext"></div><div class="v" id="v-doseExt">–</div></div>
      <div class="stat"><div class="k" data-i18n="dose_allowed"></div><div class="v" id="v-doseAllowed">–</div></div>
      <div class="stat"><div class="k" data-i18n="dose_lex"></div><div class="v" id="v-doseLex">–</div></div>
    </div>
    <p class="note" data-i18n="dose_note"></p>
  </div>
 </div>
</section>

<!-- ============ SPECTRU ============ -->
<section id="p-spec" class="panel" role="tabpanel" aria-labelledby="t-spec" tabindex="-1" hidden>
 <div class="card">
  <h2 data-i18n="spec_title"></h2>
  <div class="row">
    <fieldset><legend data-i18n="spec_mode"></legend>
      <label><input type="radio" name="sm" value="third" checked> <span data-i18n="m_third"></span></label>
      <label><input type="radio" name="sm" value="oct"> <span data-i18n="m_oct"></span></label>
      <label><input type="radio" name="sm" value="fft"> <span data-i18n="m_fft"></span></label>
    </fieldset>
    <label for="spW" data-i18n="weighting"></label>
    <select id="spW"><option value="2">Z</option><option value="0">A</option><option value="1">C</option></select>
    <label for="spAvg" data-i18n="avg"></label>
    <select id="spAvg"><option value="inst" data-i18n="avg_inst"></option><option value="exp" data-i18n="avg_exp"></option><option value="hold" data-i18n="avg_hold"></option></select>
    <label for="spN" data-i18n="fft_size"></label>
    <select id="spN"><option value="4096">4096</option><option value="8192">8192</option><option value="16384" selected>16384</option><option value="32768">32768</option></select>
  </div>
  <div class="row">
    <label for="spX" data-i18n="xscale"></label>
    <select id="spX"><option value="log" data-i18n="x_log"></option><option value="lin" data-i18n="x_lin"></option></select>
    <label><input type="checkbox" id="spNR"> <span data-i18n="nr_show"></span></label>
    <button type="button" id="btnHoldReset" class="btn" data-i18n="hold_reset"></button>
  </div>
  <canvas id="specCv" class="cv" height="280" role="img" data-i18n-aria="spec_alt"></canvas>
  <div class="stats">
    <div class="stat"><div class="k" data-i18n="peak_f"></div><div class="v" id="v-pkf">–</div></div>
    <div class="stat"><div class="k" data-i18n="peak_l"></div><div class="v" id="v-pkl">–</div></div>
    <div class="stat"><div class="k" data-i18n="sum_l"></div><div class="v" id="v-suml">–</div></div>
    <div class="stat"><div class="k" data-i18n="nr_rating"></div><div class="v" id="v-nr">–</div></div>
  </div>
  <p class="note" data-i18n="spec_note"></p>
 </div>
 <div class="card">
  <h2 data-i18n="sg_title"></h2>

const TICK = 0.125, NF = 8, HB0 = -150, HRES = 2, HBINS = 320;   // histogramă 0,5 dB, de la -150 la +10 dBFS

ab_title:'À propos de Decibel', ab_what:'Decibel mesure le niveau sonore avec le microphone de votre appareil (sonomètre avec pondérations A, C, Z et constantes de temps Fast/Slow), affiche le spectre en bandes de 1/3 et 1/1 d’octave et une FFT linéaire, calcule LAeq, Lmax/Lmin, L10/L50/L90, SEL et la dose de bruit, et comprend un test auditif indicatif. Tout s’exécute en local.',
ab_lim_h:'Ce qu’il ne fait PAS et ses limites', ab_l1:'Ce n’est pas un sonomètre certifié (CEI 61672) et il n’a aucune valeur métrologique ou légale. Il ne peut servir ni à la conformité, ni aux litiges, ni à l’évaluation des risques au travail.', ab_l2:'Les microphones de téléphone/portable ne sont pas étalonnés, avec réponse irrégulière et compression/CAG/limitation cachées ; le navigateur peut refuser de désactiver les traitements (l’application avertit).', ab_l3:'La plage utile typique est ~40–90 dB(A) ; la saturation apparaît au-delà de ~90–100 dB, et sous ~35 dB le bruit propre domine.', ab_l4:'Sans étalonnage, les valeurs sont en dBFS. Avec étalonnage, l’incertitude reste de l’ordre de ±3…±10 dB (indicative, non mesurée).', ab_l5:'La pondération A/C est réalisée par des filtres IIR (transformation bilinéaire) vérifiés par rapport au tableau CEI ; au-dessus de ~8 kHz la transformation introduit des écarts inhérents. La classe 2 n’est revendiquée que pour la vérification du filtre, pas pour l’instrument entier.', ab_l6:'L’audiogramme n’est pas un test médical et ne donne aucune interprétation clinique ; les dB HL n’apparaissent que si vous étalonnez votre casque avec un sonomètre, et restent alors approximatifs.',

ab_keys_h:'Clavier', ab_keys:'Tab/Maj+Tab pour naviguer ; flèches gauche/droite sur les onglets ; M = marquer un événement (onglet Mesure) ; Espace = « J’entends » dans le test auditif ; le curseur du graphique se déplace avec les flèches.', ab_std_h:'Normes et sources', ab_std:'Pondérations A/C : CEI 61672-1 (pôles analogiques 20,6 / 107,7 / 737,9 / 12 194 Hz). Bandes d’octave/tiers d’octave : CEI 61260-1 (base 10). Courbes NR : ISO R 1996 (1971). Dose : recommandations NIOSH, directive 2003/10/CE (à titre informatif). Zéro audiométrique : ISO 389-1 (valeurs de référence indicatives).',

}
