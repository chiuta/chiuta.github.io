  /** Chei cunoscute: fff.<slug>.*, cheile deja indexate în acest browser, cele declarate (fff-info storageKeys/bundleKeys, bundle.allow);

  function unknownKeys(keys) {
    var decl = declaredKeys(), idx = Object.create(null);

      if (k.indexOf(pfx) === 0 || idx[k] === 1) return false;
      if (F.store.appPrefix && k.indexOf(F.store.appPrefix) === 0) return false;   // modulul „store”: <slug>.*

        if (d.charAt(d.length - 1) === '*') return k.indexOf(d.slice(0, -1)) === 0;

    allow: function (list) { [].concat(list || []).forEach(function (x) { if (typeof x === 'string' && x) allowed.push(x); }); },
    build: function () { return plain(false); },

    redact: function (fn) { if (typeof fn === 'function') redactors.push(fn); },
    confirm: confirmDlg,

              {label: T('sens_plain'), value: 'plain'},
              {label: T('sens_enc'), value: 'enc', primary: true}

    inspect: function (file, opt) {

          '\n\n' + T('import_keys', {list: keyList(keys)}) +
          (unknown.length ? '\n\n' + T('import_unknown', {n: unknown.length, list: keyList(unknown)}) : '');

          .then(function (ok) {

            try {

    wipe: function (opt) {
      opt = opt || {};
      var keys = F.store.indexKeys();
      if (!keys.length) return Promise.resolve({keys: 0, cancelled: false});

        if (!ok) return {keys: 0, cancelled: true};

        try { F.store.raw.remove(F.store.indexKey); } catch (e) { /* ignorat */ }

        F.bus.emit('bundle:wiped', {keys: keys.length});
        if (opt.reload === true) setTimeout(function () { location.reload(); }, opt.delay == null ? 900 : opt.delay);
        return {keys: keys.length, cancelled: false};
      });
    }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:6px;z-index:10}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.top{background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
h1{margin:0;font-size:1.6rem;letter-spacing:.2px;color:var(--accent)}
.tag{margin:2px 0 0;color:var(--muted);max-width:60ch}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl label{color:var(--muted);font-size:.9rem}
select,.btn{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer}
select{padding-right:8px}
.btn:hover,select:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.sm{padding:4px 10px;min-height:32px;font-size:.9rem}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.55;cursor:not-allowed}
main{padding-top:16px;padding-bottom:24px}
.honest{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:16px}
.honest h2{margin:0 0 4px;font-size:1rem;color:var(--warn)}
.honest p{margin:0}
.grid{display:grid;grid-template-columns:minmax(300px,440px) minmax(0,1fr);gap:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0 0 10px;font-size:1.1rem}
#drop{border:2px dashed var(--line);border-radius:10px;padding:18px 12px;text-align:center;transition:border-color .15s,background .15s}
#drop.over{border-color:var(--accent);background:var(--accent-soft)}
#drop p{margin:6px 0;color:var(--muted);font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:600;padding:0;margin-bottom:6px}
.opt{display:block;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-right:8px;accent-color:var(--accent);width:18px;height:18px;vertical-align:middle}
.opt small{display:block;color:var(--muted);margin-left:30px}
details{margin-top:8px}
summary{cursor:pointer;font-weight:600;padding:4px 0}
.chk{display:block;padding:4px 0}
.chk input{margin-right:8px;accent-color:var(--accent);width:18px;height:18px;vertical-align:middle}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.empty{color:var(--muted)}
ul.files{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.file{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.file-head{display:flex;flex-direction:column;min-width:0}
.fname{font-weight:600;overflow-wrap:anywhere}
.fmeta{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.file-state{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.8rem;border:1px solid var(--line);background:var(--bg)}
.pill.p-clean{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.pill.p-failed,.pill.p-error{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.pill.p-refused,.pill.p-unsupported{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.file-actions{display:flex;gap:6px;flex-wrap:wrap}
.file-err{margin-top:6px;color:var(--warn);font-size:.9rem;overflow-wrap:anywhere}
.dname{margin:0 0 4px;font-size:1.05rem;overflow-wrap:anywhere}
.dmeta{margin:2px 0 8px;color:var(--muted)}
.dmeta.small{font-size:.85rem}
.previews{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}
.previews figure{margin:0;max-width:100%}
.pimg{display:block;max-width:100%;max-height:220px;border:1px solid var(--line);border-radius:8px;background:repeating-conic-gradient(#8883 0 25%,transparent 0 50%) 0 0/16px 16px}
.pimg.thumb{max-height:120px}
figcaption{font-size:.8rem;color:var(--muted);margin-top:2px}
.box{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:10px 0}
.box h4{margin:0 0 4px;font-size:.95rem}
.box ul{margin:0;padding-left:20px}
.box.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.box.good{background:var(--ok-bg);border-color:var(--ok)}
.box.bad{background:var(--bad-bg);border-color:var(--bad)}
.checks{list-style:none!important;padding-left:0!important}
.checks li{padding:2px 0}
.checks .mark{display:inline-block;width:1.4em;font-weight:700}
.checks .ok .mark{color:var(--ok)}
.checks .bad .mark{color:var(--bad)}
.checks code{color:var(--muted);font-size:.85rem}
.alert{color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:8px 12px}
.scroll{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:10px;margin-top:8px}
table.meta{border-collapse:collapse;width:100%;font-size:.9rem}
table.meta th,table.meta td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.meta th{position:sticky;top:0;background:var(--panel);z-index:1;font-weight:600}
table.meta td.v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.82rem;overflow-wrap:anywhere;max-width:30ch}
table.meta td.k{overflow-wrap:anywhere}
tr.sens2{background:var(--warn-bg)}
.badge{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;font-size:.72rem;border:1px solid var(--line);white-space:nowrap}
.badge.s2{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.badge.s1{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.st{white-space:nowrap}
.st-removed,.st-will{color:var(--ok);font-weight:600}
.st-still{color:var(--bad);font-weight:700}
.st-stays,.st-kept,.st-rewritten{color:var(--muted)}
footer{border-top:1px solid var(--line);background:var(--panel);padding:14px 0 28px;color:var(--muted);font-size:.9rem}
footer p{margin:4px 0}
#inspectBanner{margin:0 0 12px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.pill.rk{margin-left:6px}
.pill.rk0{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.pill.rk1{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.pill.rk2{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.pill.rk3{background:var(--bad-bg);color:var(--bad);border-color:var(--bad);font-weight:600}
#sumCard{margin-bottom:16px}
.vd-ok{color:var(--ok);font-weight:600}.vd-over{color:var(--bad);font-weight:600}.vd-na{color:var(--muted)}
#sumTable td.f{overflow-wrap:anywhere}
@media (max-width:480px){.wrap{padding:0 16px}.card{padding:12px}h1{font-size:1.4rem}.btn{min-height:44px}.btn.sm{min-height:40px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
@media print{.top .ctl,#drop,#polCard,.toolbar,.file-actions,footer details,.skip{display:none!important}body{background:#fff;color:#000}.card,.box{box-shadow:none;border-color:#999}.scroll{max-height:none;overflow:visible}.grid{display:block}}


input[type=checkbox],input[type=radio]{min-width:24px;min-height:24px}

  honest_body: ['Nu anonimizează conținutul: fețele, zgomotul de senzor, filigranele, numele din text și identificatorii din pixeli rămân. Imaginile pot conține identificatori chiar în pixeli.', 'It does not anonymise the content: faces, sensor noise, watermarks, names in the text and identifiers inside the pixels remain. Images can carry identifiers in the pixels themselves.', 'Il n’anonymise pas le contenu : visages, bruit du capteur, filigranes, noms dans le texte et identifiants dans les pixels subsistent. Les images peuvent contenir des identifiants dans les pixels eux-mêmes.', 'Non anonimizza il contenuto: volti, rumore del sensore, filigrane, nomi nel testo e identificatori nei pixel restano. Le immagini possono contenere identificatori nei pixel stessi.', 'No anonimiza el contenido: rostros, ruido del sensor, marcas de agua, nombres en el texto e identificadores en los píxeles permanecen. Las imágenes pueden llevar identificadores en los propios píxeles.', 'Não anonimiza o conteúdo: rostos, ruído do sensor, marcas de água, nomes no texto e identificadores nos píxeis permanecem. As imagens podem conter identificadores nos próprios píxeis.', 'Nem teszi anonimmá a tartalmat: az arcok, a szenzorzaj, a vízjelek, a szövegben szereplő nevek és a pixelekben lévő azonosítók megmaradnak. A képek a pixelekben is hordozhatnak azonosítókat.', 'Der Inhalt wird nicht anonymisiert: Gesichter, Sensorrauschen, Wasserzeichen, Namen im Text und Kennungen in den Pixeln bleiben erhalten. Bilder können Kennungen in den Pixeln selbst tragen.'],

  prof_pub: ['Publicare', 'Publication', 'Publication', 'Pubblicazione', 'Publicación', 'Publicação', 'Közzététel', 'Veröffentlichung'],
  prof_pub_d: ['Imaginea se vede la fel (orientare, culoare), dar pleacă locul, autorul, seria aparatului, titlurile și descrierile. Tolerat după curățare: cel mult risc scăzut.', 'The image looks the same (orientation, colour), but location, author, device serial, titles and descriptions go. Tolerated after cleaning: at most low risk.', 'L’image s’affiche pareil (orientation, couleur), mais le lieu, l’auteur, le numéro de série, les titres et les descriptions partent. Toléré après nettoyage : risque faible au plus.', 'L’immagine appare uguale (orientamento, colore), ma spariscono luogo, autore, numero di serie, titoli e descrizioni. Tollerato dopo la pulizia: al massimo rischio basso.', 'La imagen se ve igual (orientación, color), pero se van el lugar, el autor, el número de serie, los títulos y las descripciones. Tolerado tras limpiar: como máximo riesgo bajo.', 'A imagem fica igual (orientação, cor), mas saem o local, o autor, o número de série, os títulos e as descrições. Tolerado após a limpeza: no máximo risco baixo.', 'A kép ugyanúgy néz ki (tájolás, szín), de a helyadat, a szerző, a gépsorozatszám, a címek és a leírások eltűnnek. Tisztítás után megengedett: legfeljebb alacsony kockázat.', 'Das Bild sieht gleich aus (Ausrichtung, Farbe), aber Ort, Autor, Gerätenummer, Titel und Beschreibungen verschwinden. Nach der Bereinigung toleriert: höchstens niedriges Risiko.'],
  prof_jour: ['Jurnalism (protecția sursei)', 'Journalism (source protection)', 'Journalisme (protection des sources)', 'Giornalismo (protezione della fonte)', 'Periodismo (protección de la fuente)', 'Jornalismo (proteção da fonte)', 'Újságírás (forrásvédelem)', 'Journalismus (Quellenschutz)'],
  prof_jour_d: ['Cel mai strict: rămâne doar orientarea; pleacă și profilul de culoare, densitatea, orele și titlurile. Tolerat după curățare: niciun risc.', 'Strictest: only the orientation stays; colour profile, density, times and titles go too. Tolerated after cleaning: no risk.', 'Le plus strict : seule l’orientation reste ; le profil colorimétrique, la densité, les heures et les titres partent aussi. Toléré après nettoyage : aucun risque.', 'Il più severo: resta solo l’orientamento; spariscono anche profilo colore, densità, orari e titoli. Tollerato dopo la pulizia: nessun rischio.', 'El más estricto: solo queda la orientación; también se van el perfil de color, la densidad, las horas y los títulos. Tolerado tras limpiar: ningún riesgo.', 'O mais rigoroso: só fica a orientação; saem também o perfil de cor, a densidade, as horas e os títulos. Tolerado após a limpeza: nenhum risco.', 'A legszigorúbb: csak a tájolás marad; a színprofil, a sűrűség, az időpontok és a címek is eltűnnek. Tisztítás után megengedett: semmi kockázat.', 'Am strengsten: nur die Ausrichtung bleibt; auch Farbprofil, Dichte, Zeiten und Titel verschwinden. Nach der Bereinigung toleriert: kein Risiko.'],
  prof_off: ['Dosar oficial', 'Official file', 'Dossier officiel', 'Fascicolo ufficiale', 'Expediente oficial', 'Processo oficial', 'Hivatalos dosszié', 'Offizielle Akte'],
  prof_off_d: ['Conținutul documentului, titlul, orientarea, culoarea și orele din video rămân; pleacă locul, autorul, seria, istoricul ascuns și miniaturile. Tolerat după curățare: cel mult risc mediu.', 'The document content, title, orientation, colour and video times stay; location, author, serial, hidden history and thumbnails go. Tolerated after cleaning: at most medium risk.', 'Le contenu du document, le titre, l’orientation, la couleur et les heures vidéo restent ; le lieu, l’auteur, le numéro de série, l’historique caché et les miniatures partent. Toléré après nettoyage : risque moyen au plus.', 'Contenuto del documento, titolo, orientamento, colore e orari video restano; spariscono luogo, autore, seriale, cronologia nascosta e miniature. Tollerato dopo la pulizia: al massimo rischio medio.', 'El contenido del documento, el título, la orientación, el color y las horas del vídeo se quedan; se van el lugar, el autor, el número de serie, el historial oculto y las miniaturas. Tolerado tras limpiar: como máximo riesgo medio.', 'O conteúdo do documento, o título, a orientação, a cor e as horas do vídeo ficam; saem o local, o autor, o número de série, o histórico oculto e as miniaturas. Tolerado após a limpeza: no máximo risco médio.', 'A dokumentum tartalma, címe, a tájolás, a szín és a videó időpontjai megmaradnak; a helyadat, a szerző, a sorozatszám, a rejtett előzmények és az indexképek eltűnnek. Tisztítás után megengedett: legfeljebb közepes kockázat.', 'Dokumentinhalt, Titel, Ausrichtung, Farbe und Videozeiten bleiben; Ort, Autor, Seriennummer, versteckter Verlauf und Vorschaubilder verschwinden. Nach der Bereinigung toleriert: höchstens mittleres Risiko.'],

  w_gps: ['Fișierul conține locația GPS {lat}, {lon}. Oricine primește fișierul poate vedea unde a fost făcut.', 'The file contains the GPS location {lat}, {lon}. Anyone who receives it can see where it was made.', 'Le fichier contient la position GPS {lat}, {lon}. Quiconque le reçoit peut voir où il a été pris.', 'Il file contiene la posizione GPS {lat}, {lon}. Chiunque lo riceva può vedere dove è stato creato.', 'El archivo contiene la ubicación GPS {lat}, {lon}. Quien lo reciba puede ver dónde se hizo.', 'O ficheiro contém a localização GPS {lat}, {lon}. Quem o receber pode ver onde foi feito.', 'A fájl GPS-helyzetet tartalmaz: {lat}, {lon}. Aki megkapja, látja, hol készült.', 'Die Datei enthält den GPS-Standort {lat}, {lon}. Jeder Empfänger sieht, wo sie entstand.'],
  w_orient: ['Eliminarea etichetei Orientation ({n}) schimbă cum se afișează imaginea (poate apărea rotită). Alege profilul care păstrează orientarea.', 'Removing the Orientation tag ({n}) changes how the image is displayed (it may appear rotated). Pick the profile that keeps orientation.', 'Supprimer la balise Orientation ({n}) change l’affichage de l’image (elle peut apparaître pivotée). Choisissez le profil qui garde l’orientation.', 'Rimuovere il tag Orientation ({n}) cambia la visualizzazione dell’immagine (può apparire ruotata). Scegli il profilo che mantiene l’orientamento.', 'Eliminar la etiqueta Orientation ({n}) cambia cómo se muestra la imagen (puede verse girada). Elige el perfil que conserva la orientación.', 'Remover a etiqueta Orientation ({n}) muda a forma como a imagem é mostrada (pode aparecer rodada). Escolha o perfil que mantém a orientação.', 'Az Orientation címke ({n}) eltávolítása megváltoztatja a kép megjelenését (elforgatva látszhat). Válaszd az orientációt megtartó profilt.', 'Das Entfernen des Orientation-Tags ({n}) ändert die Darstellung (das Bild kann gedreht erscheinen). Wähle das Profil, das die Ausrichtung behält.'],
  w_icc: ['Se elimină profilul de culoare „{d}”; culorile se pot afișa diferit.', 'The colour profile “{d}” is removed; colours may display differently.', 'Le profil colorimétrique « {d} » est supprimé ; les couleurs peuvent s’afficher différemment.', 'Il profilo colore «{d}» viene rimosso; i colori possono apparire diversi.', 'Se elimina el perfil de color «{d}»; los colores pueden verse distintos.', 'O perfil de cor «{d}» é removido; as cores podem aparecer diferentes.', 'A(z) „{d}” színprofil eltávolításra kerül; a színek másképp jelenhetnek meg.', 'Das Farbprofil „{d}“ wird entfernt; Farben können anders dargestellt werden.'],
  w_thumb: ['Miniatura încorporată poate arăta imaginea originală, necropată, chiar dacă imaginea principală a fost decupată.', 'The embedded thumbnail can show the original, uncropped image even if the main image was cropped.', 'La miniature intégrée peut montrer l’image originale non recadrée, même si l’image principale a été recadrée.', 'La miniatura incorporata può mostrare l’immagine originale non ritagliata, anche se quella principale è stata ritagliata.', 'La miniatura incrustada puede mostrar la imagen original sin recortar aunque la principal se haya recortado.', 'A miniatura incorporada pode mostrar a imagem original sem recorte, mesmo que a principal tenha sido recortada.', 'A beágyazott bélyegkép az eredeti, nem vágott képet mutathatja akkor is, ha a fő képet kivágták.', 'Die eingebettete Vorschau kann das ungeschnittene Original zeigen, auch wenn das Hauptbild zugeschnitten wurde.'],
  w_pixels: ['Metadatele nu sunt tot ce identifică: fețele, zgomotul de senzor, filigranele, textul din imagine și identificatorii din pixeli NU sunt atinși.', 'Metadata is not all that identifies: faces, sensor noise, watermarks, text in the image and identifiers in the pixels are NOT touched.', 'Les métadonnées ne sont pas tout ce qui identifie : visages, bruit du capteur, filigranes, texte dans l’image et identifiants dans les pixels ne sont PAS touchés.', 'I metadati non sono tutto ciò che identifica: volti, rumore del sensore, filigrane, testo nell’immagine e identificatori nei pixel NON vengono toccati.', 'Los metadatos no son lo único que identifica: rostros, ruido del sensor, marcas de agua, texto en la imagen e identificadores en los píxeles NO se tocan.', 'Os metadados não são tudo o que identifica: rostos, ruído do sensor, marcas de água, texto na imagem e identificadores nos píxeis NÃO são tocados.', 'Nem csak a metaadatok azonosítanak: az arcokat, a szenzorzajt, a vízjeleket, a képen lévő szöveget és a pixelekben rejlő azonosítókat NEM érinti.', 'Nicht nur Metadaten identifizieren: Gesichter, Sensorrauschen, Wasserzeichen, Text im Bild und Kennungen in den Pixeln werden NICHT angetastet.'],
  w_content: ['Conținutul documentului (text, imagini, nume în text, comentarii, urmărirea modificărilor) NU este anonimizat.', 'The document content (text, images, names in the text, comments, tracked changes) is NOT anonymised.', 'Le contenu du document (texte, images, noms dans le texte, commentaires, suivi des modifications) N’est PAS anonymisé.', 'Il contenuto del documento (testo, immagini, nomi nel testo, commenti, revisioni) NON è anonimizzato.', 'El contenido del documento (texto, imágenes, nombres en el texto, comentarios, control de cambios) NO se anonimiza.', 'O conteúdo do documento (texto, imagens, nomes no texto, comentários, controlo de alterações) NÃO é anonimizado.', 'A dokumentum tartalma (szöveg, képek, a szövegben szereplő nevek, megjegyzések, módosításkövetés) NEM lesz anonimizálva.', 'Der Dokumentinhalt (Text, Bilder, Namen im Text, Kommentare, Änderungsverfolgung) wird NICHT anonymisiert.'],
  w_pdf: ['PDF: identificatorul /ID, anotările (autorii comentariilor), /PieceInfo, fișierele atașate și textul NU sunt modificate. Conformitatea PDF/A se pierde. Curățarea se face pe loc (aceeași lungime).', 'PDF: the /ID, annotations (comment authors), /PieceInfo, attached files and the text are NOT modified. PDF/A conformance is lost. Cleaning is in place (same length).', 'PDF : l’/ID, les annotations (auteurs des commentaires), /PieceInfo, les fichiers joints et le texte ne sont PAS modifiés. La conformité PDF/A est perdue. Le nettoyage se fait sur place (même longueur).', 'PDF: /ID, annotazioni (autori dei commenti), /PieceInfo, allegati e testo NON vengono modificati. La conformità PDF/A si perde. La pulizia avviene sul posto (stessa lunghezza).', 'PDF: el /ID, las anotaciones (autores de comentarios), /PieceInfo, los adjuntos y el texto NO se modifican. Se pierde la conformidad PDF/A. La limpieza es in situ (misma longitud).', 'PDF: o /ID, as anotações (autores de comentários), /PieceInfo, os anexos e o texto NÃO são modificados. A conformidade PDF/A perde-se. A limpeza é feita no local (mesmo comprimento).', 'PDF: az /ID, a jegyzetek (megjegyzések szerzői), a /PieceInfo, a csatolt fájlok és a szöveg NEM módosul. A PDF/A-megfelelés elvész. A tisztítás helyben történik (azonos hossz).', 'PDF: /ID, Anmerkungen (Kommentarautoren), /PieceInfo, Anhänge und Text werden NICHT verändert. Die PDF/A-Konformität geht verloren. Die Bereinigung erfolgt an Ort und Stelle (gleiche Länge).'],
  w_mp4: ['MP4/MOV: fluxurile audio/video nu sunt atinse. Rămân numele handler-elor, numele codecului din descrierea eșantioanelor și eventualele mesaje încorporate în flux (ex. SEI). Piste de metadate temporale (GPS pe cadru) nu sunt eliminate.', 'MP4/MOV: the audio/video streams are untouched. Handler names, codec names in sample descriptions and any messages embedded in the stream (e.g. SEI) remain. Timed-metadata tracks (per-frame GPS) are not removed.', 'MP4/MOV : les flux audio/vidéo ne sont pas touchés. Les noms de handler, les noms de codec dans les descriptions d’échantillons et les messages intégrés au flux (p. ex. SEI) restent. Les pistes de métadonnées temporelles (GPS par image) ne sont pas supprimées.', 'MP4/MOV: i flussi audio/video non vengono toccati. Restano i nomi degli handler, i nomi dei codec nelle descrizioni dei campioni e gli eventuali messaggi incorporati nel flusso (es. SEI). Le tracce di metadati temporali (GPS per fotogramma) non vengono rimosse.', 'MP4/MOV: los flujos de audio/vídeo no se tocan. Permanecen los nombres de handler, los nombres de códec en las descripciones de muestras y cualquier mensaje incrustado en el flujo (p. ej. SEI). Las pistas de metadatos temporales (GPS por fotograma) no se eliminan.', 'MP4/MOV: os fluxos de áudio/vídeo não são tocados. Permanecem os nomes de handler, os nomes de codec nas descrições de amostras e eventuais mensagens incorporadas no fluxo (ex. SEI). As pistas de metadados temporais (GPS por fotograma) não são removidas.', 'MP4/MOV: a hang-/videófolyamok érintetlenek. Megmaradnak a handler-nevek, a kodeknevek a mintaleírásokban és a folyamba ágyazott üzenetek (pl. SEI). Az időalapú metaadat-sávok (képkockánkénti GPS) nem törlődnek.', 'MP4/MOV: Audio-/Videoströme bleiben unberührt. Handler-Namen, Codec-Namen in den Sample-Beschreibungen und im Strom eingebettete Meldungen (z. B. SEI) bleiben. Zeitgesteuerte Metadatenspuren (GPS pro Bild) werden nicht entfernt.'],
  w_audio: ['Audio: cadrele audio nu sunt atinse (fără re-codare). Șirul codificatorului din antetul Xing/LAME al unui MP3 poate rămâne.', 'Audio: the audio frames are untouched (no re-encoding). The encoder string in an MP3 Xing/LAME header may remain.', 'Audio : les trames audio ne sont pas touchées (sans ré-encodage). La chaîne de l’encodeur dans l’en-tête Xing/LAME d’un MP3 peut subsister.', 'Audio: i frame audio non vengono toccati (nessuna ricodifica). La stringa dell’encoder nell’intestazione Xing/LAME di un MP3 può restare.', 'Audio: las tramas de audio no se tocan (sin recodificar). La cadena del codificador en la cabecera Xing/LAME de un MP3 puede permanecer.', 'Áudio: as tramas de áudio não são tocadas (sem recodificar). A cadeia do codificador no cabeçalho Xing/LAME de um MP3 pode permanecer.', 'Hang: a hangkeretek érintetlenek (nincs újrakódolás). Az MP3 Xing/LAME fejlécében lévő kódolósztring megmaradhat.', 'Audio: die Audio-Frames bleiben unberührt (keine Neucodierung). Der Encoder-String im Xing/LAME-Header einer MP3 kann bleiben.'],
  w_office: ['Documentul Office/ODF: comentariile, modificările urmărite, numele din text și căile din registru (ex. absPath) sunt doar listate, nu modificate. Imaginile încorporate sunt curățate de metadate fără re-codare.', 'Office/ODF document: comments, tracked changes, names in the text and paths in the workbook (e.g. absPath) are only listed, not modified. Embedded images are stripped of metadata without re-encoding.', 'Document Office/ODF : commentaires, suivi des modifications, noms dans le texte et chemins du classeur (p. ex. absPath) sont seulement listés, non modifiés. Les images intégrées sont nettoyées sans ré-encodage.', 'Documento Office/ODF: commenti, revisioni, nomi nel testo e percorsi nella cartella di lavoro (es. absPath) sono solo elencati, non modificati. Le immagini incorporate vengono ripulite senza ricodifica.', 'Documento Office/ODF: los comentarios, el control de cambios, los nombres en el texto y las rutas del libro (p. ej. absPath) solo se listan, no se modifican. Las imágenes incrustadas se limpian sin recodificar.', 'Documento Office/ODF: comentários, controlo de alterações, nomes no texto e caminhos do livro (ex. absPath) só são listados, não modificados. As imagens incorporadas são limpas sem recodificar.', 'Office/ODF dokumentum: a megjegyzések, a módosításkövetés, a szövegben szereplő nevek és a munkafüzet útvonalai (pl. absPath) csak fel vannak sorolva, nem módosulnak. A beágyazott képek újrakódolás nélkül tisztulnak.', 'Office/ODF-Dokument: Kommentare, Änderungsverfolgung, Namen im Text und Pfade in der Arbeitsmappe (z. B. absPath) werden nur aufgelistet, nicht verändert. Eingebettete Bilder werden ohne Neucodierung bereinigt.'],
  w_embedded: ['SVG-ul conține imagini raster încorporate (data:); ele sunt curățate fără re-codare dacă politica o cere.', 'The SVG embeds raster images (data:); they are cleaned without re-encoding when the policy says so.', 'Le SVG intègre des images raster (data:) ; elles sont nettoyées sans ré-encodage si la politique le demande.', 'L’SVG incorpora immagini raster (data:); vengono ripulite senza ricodifica se la politica lo prevede.', 'El SVG incrusta imágenes ráster (data:); se limpian sin recodificar si la política lo indica.', 'O SVG incorpora imagens raster (data:); são limpas sem recodificar se a política o indicar.', 'Az SVG raszteres képeket ágyaz be (data:); a szabályzattól függően újrakódolás nélkül tisztulnak.', 'Das SVG bettet Rasterbilder ein (data:); sie werden je nach Richtlinie ohne Neucodierung bereinigt.'],

  privacy: ['Rulează local în browser; nu trimite nimic nicăieri (connect-src „none”). Fișierele nu sunt stocate; se păstrează doar setările (limbă, temă, politică).', 'Runs locally in the browser; sends nothing anywhere (connect-src “none”). Files are not stored; only settings (language, theme, policy) are kept.', 'Fonctionne en local dans le navigateur ; n’envoie rien nulle part (connect-src « none »). Les fichiers ne sont pas stockés ; seuls les réglages (langue, thème, politique) sont conservés.', 'Funziona in locale nel browser; non invia nulla da nessuna parte (connect-src «none»). I file non vengono memorizzati; si conservano solo le impostazioni (lingua, tema, politica).', 'Funciona en local en el navegador; no envía nada a ningún sitio (connect-src «none»). Los archivos no se almacenan; solo se guardan los ajustes (idioma, tema, política).', 'Funciona localmente no navegador; não envia nada para lado nenhum (connect-src «none»). Os ficheiros não são guardados; só se guardam as definições (idioma, tema, política).', 'Helyben fut a böngészőben; semmit sem küld sehová (connect-src „none”). A fájlokat nem tárolja; csak a beállítások (nyelv, téma, szabályzat) maradnak meg.', 'Läuft lokal im Browser; sendet nichts irgendwohin (connect-src „none“). Dateien werden nicht gespeichert; nur Einstellungen (Sprache, Thema, Richtlinie) bleiben erhalten.'],

    });
    $('#cleanAll').addEventListener('click', cleanAll);
    $('#clearBtn').addEventListener('click', () => { state.files = []; state.sel = null; renderAll(); });
    $('#zipBtn').addEventListener('click', async () => {
      const items = []; const names = new Set();
      for (const f of state.files) if (f.outBlob) { let n = cleanName(disp(f)), i = 2; while (names.has(n)) { n = cleanName(disp(f)).replace(/(\.[^.]*)?$/, ' (' + i++ + ')$1'); } names.add(n); items.push({ name: n, bytes: new Uint8Array(await f.outBlob.arrayBuffer()) }); }
      if (items.length) download('curatitor-curat.zip', new Blob([API.zipStore(items)], { type: 'application/zip' }));
    });
    $('#repJson').addEventListener('click', () => download('curatitor-raport.json', new Blob([JSON.stringify(reportData($('#repValues').checked), null, 2)], { type: 'application/json' })));
    $('#repHtml').addEventListener('click', () => download('curatitor-raport.html', new Blob([reportHtml($('#repValues').checked)], { type: 'text/html' })));
    $('#repCsv').addEventListener('click', () => download('curatitor-raport.csv', new Blob([reportCsv($('#repValues').checked)], { type: 'text/csv' })));
    // setări
    $('#setExport').addEventListener('click', exportSettings);
    $('#setImportBtn').addEventListener('click', () => $('#setImportInput').click());
    $('#setImportInput').addEventListener('change', (e) => { if (e.target.files[0]) importSettings(e.target.files[0]); e.target.value = ''; });
    $('#setWipe').addEventListener('click', wipeAll);
    $('#app-version').textContent = 'v ' + VERSION + ' · ' + UPDATED;
    setLang(detectLang(), false); syncPolicyUI(); $('#customOpts').open = state.profile === 'custom'; renderAll();
    window.__curatitor = { version: VERSION, state: () => state.files.map(f => ({ name: f.name, path: f.path, risk: (() => { const r = riskOf(f); return r ? { before: r.before.level, after: r.after ? r.after.level : null, verdict: r.verdict } : null; })(), thumbDiff: f.thumbDiff, state: f.state, where: f.where, fmt: f.fmt, err: f.err && (f.err.code || f.err.msg) })) };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
