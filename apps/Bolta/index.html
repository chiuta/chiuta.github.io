  /* ---------- confirmare (dialog propriu, nu window.confirm) ---------- */

      var no = doc.createElement('button'); no.type = 'button'; no.className = 'fff-btn'; no.textContent = opt.no || T('no');
      var yes = doc.createElement('button'); yes.type = 'button'; yes.className = 'fff-btn fff-primary' + (opt.danger ? ' fff-danger' : ''); yes.textContent = opt.yes || T('yes');

  function ask(msg, c, o) {

  /* ---------- construire ---------- */
  var redactors = [];

  function encrypt(obj, password) {

  function validatePlain(o, slug) {

  /* ---------- API ---------- */
  var bundle = F.bundle = {

    /** Înregistrează fn(cheie, valoare) -> valoare curățată (șir); se aplică doar exportului necriptat. */
    redact: function (fn) { if (typeof fn === 'function') redactors.push(fn); },
    confirm: confirmDlg,

    /** Descarcă un .fff.json. Cu {encrypt:true, password} produce varianta criptată. */
    export: function (opt) {

    import: function (file, opt) {

      return readText(file).then(function (t) {
        var o = parseEnvelope(t);
        if (o.app !== slug) throw BErr('app', {got: o.app, want: slug});
        if (o.format === 'fff-bundle-enc') {
          if (opt.password == null || opt.password === '') throw BErr('password_required', {file: fname});
          return decrypt(o, opt.password).then(function (p) {
            if (p.app !== o.app) throw BErr('format');

          });
        }

      }).then(function (o) {
        var keys = validatePlain(o, slug);
        return ask(T('confirm_import', {n: keys.length, app: slug, ver: o.version || '?', date: (o.exported || '').slice(0, 10) || '?'}), opt.confirm)
          .then(function (ok) {
            if (!ok) return {keys: 0, cancelled: true};
            var undo = {};
            try {
              keys.forEach(function (k) {
                if (!(k in undo)) undo[k] = F.store.raw.get(k);
                F.store.raw.set(k, o.data[k]);

              });
            } catch (e) {
              Object.keys(undo).forEach(function (k) { try { if (undo[k] == null) F.store.raw.remove(k); else F.store.raw.set(k, undo[k]); } catch (e2) { /* ignorat */ } });

          });
      });
    },

    /** Șterge DOAR cheile indexate ale aplicației (și cele fff.<slug>.*). */
    wipe: function (opt) {

      if (!keys.length) return Promise.resolve({keys: 0, cancelled: false});
      return ask(T('confirm_wipe', {n: keys.length}), opt.confirm, {danger: true, yes: T('wipe_yes')}).then(function (ok) {

      });
    }
  };
})();

<body>
<a class="skip" href="#main" data-i18n="skip"></a>
<header class="top">
 <h1>Bolta <small data-i18n="tag"></small></h1>
 <div class="spacer"></div>
 <div class="hdr-tools">
  <label class="inline"><span class="sr" data-i18n="language"></span><select id="langSel"></select></label>
  <label class="inline"><span class="sr" data-i18n="theme"></span><select id="themeSel"></select></label>
  <button class="btn small" id="helpBtn" type="button" data-i18n="help"></button>
 </div>
<nav class="tabs" role="tablist" id="tabs" data-i18n-aria="tabs.aria">
 <button role="tab" id="tabb-sky" aria-controls="tab-sky" aria-selected="true" data-tab="sky" data-i18n="tab.sky"></button>
 <button role="tab" id="tabb-events" aria-controls="tab-events" aria-selected="false" tabindex="-1" data-tab="events" data-i18n="tab.events"></button>
 <button role="tab" id="tabb-eclipse" aria-controls="tab-eclipse" aria-selected="false" tabindex="-1" data-tab="eclipse" data-i18n="tab.eclipse"></button>
 <button role="tab" id="tabb-words" aria-controls="tab-words" aria-selected="false" tabindex="-1" data-tab="words" data-i18n="tab.words"></button>
 <button role="tab" id="tabb-places" aria-controls="tab-places" aria-selected="false" tabindex="-1" data-tab="places" data-i18n="tab.places"></button>

<noscript><p>Bolta necesită JavaScript. / Bolta requires JavaScript.</p></noscript>

<!-- ===================== CERUL ===================== -->
<section class="tab" id="tab-sky" role="tabpanel" aria-labelledby="tabb-sky">
 <div class="skygrid">
  <div class="stage">
   <div class="canvaswrap" id="canvaswrap">
    <canvas id="sky" tabindex="0" role="application" data-i18n-aria="sky.aria"></canvas>
    <div class="hud tl" id="hudInfo" aria-hidden="true"></div>
    <div class="hud tr">
     <button class="btn small icon" id="zoomIn" type="button" data-i18n-aria="sky.zoomIn" data-i18n-title="sky.zoomIn">+</button>
     <button class="btn small icon" id="zoomOut" type="button" data-i18n-aria="sky.zoomOut" data-i18n-title="sky.zoomOut">−</button>
     <button class="btn small icon" id="resetView" type="button" data-i18n-aria="vw.reset" data-i18n-title="vw.reset">⌂</button>
    </div>
    <div class="hud bl" id="hudFov" aria-hidden="true"></div>
   </div>
   <div class="timebar" role="group" data-i18n-aria="tm.group">
    <label class="dtl"><span data-i18n="tm.datetime"></span> <span class="hint" id="tzName"></span>
     <input type="datetime-local" id="dtIn" step="1" min="1900-01-01T00:00:00" max="2100-12-31T23:59:59"></label>
    <div class="row">
     <button class="btn primary" id="btnNow" type="button" data-i18n="tm.now"></button>
     <button class="btn icon" id="btnBack" type="button" data-i18n-aria="tm.back" data-i18n-title="tm.back">◀</button>
     <label class="inline"><span class="sr" data-i18n="tm.step"></span><select id="stepSel"></select></label>
     <button class="btn icon" id="btnFwd" type="button" data-i18n-aria="tm.fwd" data-i18n-title="tm.fwd">▶</button>
     <button class="btn" id="btnPlay" type="button" aria-pressed="false" data-i18n="tm.play"></button>
     <label class="inline"><span data-i18n="tm.speed"></span><select id="speedSel"></select></label>
     <label class="inline"><input type="checkbox" id="revChk"><span data-i18n="tm.reverse"></span></label>
    </div>
    <div class="hint" id="timeHint" role="status"></div>
   </div>
   <p class="hint skipdesc"><a href="#tab-words" id="toWords" data-i18n="sky.toWords"></a></p>
  </div>
  <aside class="side" data-i18n-aria="side.aria">
   <details id="secLoc" open><summary data-i18n="loc.title"></summary>
    <div class="pad">
     <div class="placeNow" id="placeNow"></div>
     <label for="citySearch" data-i18n="loc.search"></label>
     <input id="citySearch" type="search" autocomplete="off" data-i18n-ph="loc.searchPh">
     <div class="hint" id="cityStatus" role="status"></div>
     <ul class="results" id="cityList"></ul>
     <h2 class="h3s" data-i18n="loc.coords"></h2>
     <div class="grid2">
      <label for="latIn"><span data-i18n="loc.lat"></span><input id="latIn" inputmode="decimal" autocomplete="off"></label>
      <label for="lonIn"><span data-i18n="loc.lon"></span><input id="lonIn" inputmode="decimal" autocomplete="off"></label>
      <label for="elevIn"><span data-i18n="loc.elev"></span><input id="elevIn" inputmode="decimal" autocomplete="off"></label>
      <label for="nameIn"><span data-i18n="loc.name"></span><input id="nameIn" maxlength="80" autocomplete="off"></label>
      <label for="tzIn" class="full"><span data-i18n="loc.tz"></span><input id="tzIn" list="tzList" autocomplete="off"></label>
     </div>
     <datalist id="tzList"></datalist>
     <div class="hint" data-i18n="loc.tzHint"></div>
     <div class="hint bad" id="coordErr" role="alert"></div>
     <div class="row">
      <button class="btn primary" id="applyCoords" type="button" data-i18n="loc.apply"></button>
      <button class="btn" id="savePlace" type="button" data-i18n="loc.save"></button>
     </div>
     <h2 class="h3s" data-i18n="loc.gpsTitle"></h2>
     <p class="hint" id="gpsNote" data-i18n="loc.gpsNote"></p>
     <button class="btn" id="gpsBtn" type="button" data-i18n="loc.gps"></button>
     <div class="hint" id="gpsStatus" role="status"></div>
    </div>
   </details>
   <details id="secView" open><summary data-i18n="vw.title"></summary>
    <div class="pad">
     <label for="projSel"><span data-i18n="vw.proj"></span><select id="projSel"><option value="stereo" data-i18n="vw.stereo"></option><option value="azeq" data-i18n="vw.azeq"></option></select></label>
     <div class="checks">
      <label class="inline"><input type="checkbox" id="oFull"><span data-i18n="vw.full"></span></label>
      <label class="inline"><input type="checkbox" id="oGround"><span data-i18n="vw.ground"></span></label>
      <label class="inline"><input type="checkbox" id="oCard"><span data-i18n="vw.cardinals"></span></label>
      <label class="inline"><input type="checkbox" id="oStars"><span data-i18n="vw.stars"></span></label>
      <label class="inline"><input type="checkbox" id="oStarNames"><span data-i18n="vw.starNames"></span></label>
      <label class="inline"><input type="checkbox" id="oConstLines"><span data-i18n="vw.constLines"></span></label>
      <label class="inline"><input type="checkbox" id="oConstNames"><span data-i18n="vw.constNames"></span></label>
      <label class="inline"><input type="checkbox" id="oMw"><span data-i18n="vw.mw"></span></label>
      <label class="inline"><input type="checkbox" id="oEcl"><span data-i18n="vw.ecl"></span></label>
      <label class="inline"><input type="checkbox" id="oEq"><span data-i18n="vw.eq"></span></label>
      <label class="inline"><input type="checkbox" id="oGridAA"><span data-i18n="vw.gridAA"></span></label>
      <label class="inline"><input type="checkbox" id="oGridEq"><span data-i18n="vw.gridEq"></span></label>
      <label class="inline"><input type="checkbox" id="oFar"><span data-i18n="vw.far"></span></label>
      <label class="inline"><input type="checkbox" id="oAtmo"><span data-i18n="vw.atmo"></span></label>
      <label class="inline"><input type="checkbox" id="oRefr"><span data-i18n="vw.refr"></span></label>
     </div>
     <label for="cnameSel"><span data-i18n="vw.cname"></span><select id="cnameSel"><option value="both" data-i18n="vw.cname.both"></option><option value="ro" data-i18n="vw.cname.ro"></option><option value="en" data-i18n="vw.cname.en"></option><option value="ui" data-i18n="vw.cname.ui"></option></select></label>
     <label for="magLim"><span><span data-i18n="vw.maglim"></span>: <b id="magLimV"></b></span><input type="range" id="magLim" min="2" max="5" step="0.1"></label>
     <p class="hint" data-i18n="vw.note"></p>
     <button class="btn small" id="resetView2" type="button" data-i18n="vw.reset"></button>
    </div>
   </details>
   <details id="secObj" open><summary data-i18n="ob.title"></summary>
    <div class="pad" id="objBox" aria-live="polite"></div>
   </details>
   <details id="secFind"><summary data-i18n="fd.title"></summary>
    <div class="pad">
     <label for="findIn" data-i18n="fd.label"></label>
     <input id="findIn" type="search" autocomplete="off" data-i18n-ph="fd.ph">
     <div class="hint" id="findStatus" role="status"></div>
     <ul class="results" id="findList"></ul>
    </div>
   </details>
   <details id="secExport"><summary data-i18n="ex.title"></summary>
    <div class="pad">
     <p class="hint" data-i18n="ex.note"></p>
     <div class="row">
      <button class="btn" id="exPrint" type="button" data-i18n="ex.print"></button>
      <button class="btn" id="exSvg" type="button" data-i18n="ex.svg"></button>
      <button class="btn" id="exPng" type="button" data-i18n="ex.png"></button>
      <button class="btn" id="exPngView" type="button" data-i18n="ex.pngView"></button>
     </div>
     <label class="inline"><input type="checkbox" id="exInvert" checked><span data-i18n="ex.invert"></span></label>
    </div>
   </details>
  </aside>
 </div>
</section>

<!-- ===================== EVENIMENTE ===================== -->
<section class="tab" id="tab-events" role="tabpanel" aria-labelledby="tabb-events" hidden>
 <div class="card">
  <h2 data-i18n="ev.title"></h2>
  <p data-i18n="ev.intro"></p>
  <form id="evForm" class="evform">
   <div class="grid2">
    <label for="evFrom"><span data-i18n="ev.from"></span><input type="date" id="evFrom" min="1900-01-01" max="2100-12-31"></label>
    <label for="evTo"><span data-i18n="ev.to"></span><input type="date" id="evTo" min="1900-01-01" max="2100-12-31"></label>
   </div>
   <div class="row presets"><span class="hint" data-i18n="ev.presets"></span>
    <button class="btn small" type="button" data-span="31" data-i18n="ev.p1m"></button>
    <button class="btn small" type="button" data-span="365" data-i18n="ev.p1y"></button>
    <button class="btn small" type="button" data-span="1826" data-i18n="ev.p5y"></button>
   </div>
   <fieldset><legend data-i18n="ev.cats"></legend>
    <div class="checks">
     <label class="inline"><input type="checkbox" id="evcPhase" checked><span data-i18n="ev.cat.phase"></span></label>
     <label class="inline"><input type="checkbox" id="evcMoonP" checked><span data-i18n="ev.cat.moonp"></span></label>
     <label class="inline"><input type="checkbox" id="evcPP" checked><span data-i18n="ev.cat.pp"></span></label>
     <label class="inline"><input type="checkbox" id="evcOpp" checked><span data-i18n="ev.cat.opp"></span></label>
     <label class="inline"><input type="checkbox" id="evcSeason" checked><span data-i18n="ev.cat.season"></span></label>
     <label class="inline"><input type="checkbox" id="evcEcl" checked><span data-i18n="ev.cat.ecl"></span></label>
    </div>
    <div class="grid2">
     <label for="evThrMP"><span data-i18n="ev.thrMP"></span><select id="evThrMP"><option value="2">2°</option><option value="3">3°</option><option value="5" selected>5°</option><option value="8">8°</option></select></label>
     <label for="evThrPP"><span data-i18n="ev.thrPP"></span><select id="evThrPP"><option value="1">1°</option><option value="2">2°</option><option value="3" selected>3°</option><option value="5">5°</option></select></label>
    </div>
   </fieldset>
   <div class="row"><button class="btn primary" id="evRun" type="button" data-i18n="ev.run"></button>
    <button class="btn" id="evIcs" type="button" disabled data-i18n="ev.ics"></button>
    <progress id="evProg" max="100" value="0" hidden></progress></div>
   <div class="hint bad" id="evErr" role="alert"></div>
   <div class="hint" id="evStatus" role="status"></div>
  </form>
  <p class="hint" data-i18n="ev.note"></p>
  <div class="tablewrap"><table class="data" id="evTable" hidden>
   <caption class="sr" data-i18n="ev.title"></caption>
   <thead><tr><th scope="col" data-i18n="ev.col.when"></th><th scope="col" data-i18n="ev.col.what"></th><th scope="col" data-i18n="ev.col.detail"></th><th scope="col" data-i18n="ev.col.act"></th></tr></thead>
   <tbody id="evBody"></tbody></table></div>
 </div>
</section>

<!-- ===================== ECLIPSA ===================== -->
<section class="tab" id="tab-eclipse" role="tabpanel" aria-labelledby="tabb-eclipse" hidden>
 <div class="card warn" role="note" aria-labelledby="ecWarnH">
  <h2 id="ecWarnH" data-i18n="ec.warn.title"></h2>
  <ul class="warnlist">
   <li data-i18n="ec.warn.1"></li><li data-i18n="ec.warn.2"></li><li data-i18n="ec.warn.3"></li><li data-i18n="ec.warn.4"></li><li data-i18n="ec.warn.5"></li>
  </ul>
 </div>
 <div class="card">
  <h2 data-i18n="ec.title"></h2>
  <p id="ecPlace"></p>
  <div class="countdown" id="ecCount" role="timer" aria-live="off"></div>
  <p class="hint" id="ecCountNote"></p>
  <div class="tablewrap"><table class="data" id="ecTable"><caption data-i18n="ec.local"></caption>
   <thead><tr><th scope="col" data-i18n="ec.col.contact"></th><th scope="col" data-i18n="ec.col.time"></th><th scope="col" data-i18n="ec.col.utc"></th><th scope="col" data-i18n="ec.col.alt"></th><th scope="col" data-i18n="ec.col.az"></th></tr></thead>
   <tbody id="ecBody"></tbody></table></div>
  <dl class="kv" id="ecKv"></dl>
  <div class="row"><button class="btn" id="ecGoSky" type="button" data-i18n="ec.goSky"></button></div>
 </div>
 <div class="card">
  <h2 data-i18n="ec.sim.title"></h2>
  <div class="simwrap"><canvas id="ecSim" width="480" height="480" role="img" data-i18n-aria="ec.sim.aria"></canvas>
   <div class="simctl">
    <label for="ecSlider"><span data-i18n="ec.sim.time"></span> <b id="ecSimTime"></b><input type="range" id="ecSlider" min="0" max="1000" value="500"></label>
    <div class="row"><button class="btn" id="ecPlay" type="button" data-i18n="ec.sim.play"></button><button class="btn" id="ecMaxBtn" type="button" data-i18n="ec.sim.max"></button></div>
    <div class="hint" id="ecSimInfo" role="status"></div>
    <p class="hint" data-i18n="ec.sim.note"></p>
   </div></div>
 </div>
 <div class="card">
  <h2 data-i18n="ec.map.title"></h2>
  <figure class="mapfig"><svg id="ecMap" viewBox="0 0 800 520" role="img" data-i18n-aria="ec.map.aria"></svg>
   <figcaption class="hint" data-i18n="ec.map.note"></figcaption></figure>
  <dl class="kv" id="ecGlobal"></dl>
 </div>
 <div class="card">
  <h2 data-i18n="ec.ro.title"></h2>
  <p class="hint" data-i18n="ec.ro.note"></p>
  <div class="tablewrap"><table class="data" id="ecRO"><caption class="sr" data-i18n="ec.ro.title"></caption>
   <thead><tr><th scope="col" data-i18n="ec.ro.city"></th><th scope="col">C1</th><th scope="col" data-i18n="ec.col.max"></th><th scope="col">C4</th><th scope="col" data-i18n="ec.obsc"></th><th scope="col" data-i18n="ec.mag"></th></tr></thead>
   <tbody id="ecROBody"></tbody></table></div>
  <p class="hint" id="ecErr"></p>
 </div>
</section>

<!-- ===================== DESCRIERE ===================== -->
<section class="tab" id="tab-words" role="tabpanel" aria-labelledby="tabb-words" hidden>
 <div class="card">
  <h2 data-i18n="wd.title"></h2>
  <p class="hint" data-i18n="wd.intro"></p>
  <div class="row"><label class="inline"><span data-i18n="wd.maglim"></span><select id="wdMag"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option></select></label>
   <label class="inline"><input type="checkbox" id="wdBelow"><span data-i18n="wd.below"></span></label>
   <button class="btn" id="wdRefresh" type="button" data-i18n="wd.refresh"></button></div>
  <div id="wdText" class="words" tabindex="-1" aria-live="polite"></div>
  <div class="tablewrap"><table class="data" id="wdTable"><caption data-i18n="wd.tableCap"></caption>
   <thead><tr><th scope="col" data-i18n="wd.col.obj"></th><th scope="col" data-i18n="wd.col.alt"></th><th scope="col" data-i18n="wd.col.az"></th><th scope="col" data-i18n="wd.col.dir"></th><th scope="col" data-i18n="wd.col.mag"></th><th scope="col" data-i18n="wd.col.act"></th></tr></thead>
   <tbody id="wdBody"></tbody></table></div>
 </div>
</section>

<!-- ===================== LOCURI ===================== -->
<section class="tab" id="tab-places" role="tabpanel" aria-labelledby="tabb-places" hidden>
 <div class="card">
  <h2 data-i18n="pl.title"></h2>
  <p class="hint" data-i18n="pl.intro"></p>
  <div class="tablewrap"><table class="data" id="plTable"><caption class="sr" data-i18n="pl.title"></caption>
   <thead><tr><th scope="col" data-i18n="loc.name"></th><th scope="col" data-i18n="pl.col.lat"></th><th scope="col" data-i18n="pl.col.lon"></th><th scope="col" data-i18n="pl.col.tz"></th><th scope="col" data-i18n="pl.col.act"></th></tr></thead>
   <tbody id="plBody"></tbody></table></div>
  <p class="hint" id="plEmpty" data-i18n="pl.empty"></p>
  <h3 data-i18n="pl.backup"></h3>
  <div class="row">
   <button class="btn" id="plExport" type="button" data-i18n="pl.export"></button>
   <label class="btn filebtn" for="plImport"><span data-i18n="pl.import"></span><input type="file" id="plImport" accept=".json,application/json"></label>
   <button class="btn danger" id="plClear" type="button" data-i18n="pl.clear"></button>
  </div>
  <div class="hint" id="plStatus" role="status"></div>
 </div>
</section>

<!-- ===================== DESPRE ===================== -->
<section class="tab" id="tab-about" role="tabpanel" aria-labelledby="tabb-about" hidden>
 <div class="card">
  <h2 data-i18n="ab.title"></h2>
  <p data-i18n="ab.what"></p>
  <h3 data-i18n="ab.limits.t"></h3>
  <ul><li data-i18n="ab.l1"></li><li data-i18n="ab.l2"></li><li data-i18n="ab.l3"></li><li data-i18n="ab.l4"></li><li data-i18n="ab.l5"></li><li data-i18n="ab.l6"></li><li data-i18n="ab.l7"></li></ul>
  <h3 data-i18n="ab.acc.t"></h3>
  <p data-i18n="ab.acc"></p>
  <h3 data-i18n="ab.priv.t"></h3>
  <p data-i18n="ab.priv"></p>
  <h3 data-i18n="ab.third.t"></h3>
  <p data-i18n="ab.third"></p>
  <h3 data-i18n="ab.tr.t"></h3>

o é adequada para navegação nem astrofotografia de precisão.","A Tejút nincs berajzolva. Nem alkalmas navigációra vagy precíziós csillagászati fényképezésre.","Die Milchstraße ist nicht gezeichnet. Nicht geeignet für Navigation oder Präzisions-Astrofotografie."],"ex.legend5":["Stele din Hipparcos (V ≤ 5,0); figuri de constelații convenționale; denumiri românești neoficiale.","Stars from Hipparcos (V ≤ 5.0); conventional constellation figures; unofficial Romanian names.","Étoiles de Hipparcos (V ≤ 5,0) ; figures de constellations conventionnelles ; noms roumains non officiels.","Stelle da Hipparcos (V ≤ 5,0); figure convenzionali delle costellazioni; nomi rumeni non ufficiali.","Estrellas de Hipparcos (V ≤ 5,0); figuras de constelaciones convencionales; nombres rumanos no oficiales.","Estrelas de Hipparcos (V ≤ 5,0); figuras de constelações convencionais; nomes romenos não oficiais.","Hipparcos-csillagok (V ≤ 5,0); hagyományos csillagképalakzatok; nem hivatalos román nevek.","Sterne aus Hipparcos (V ≤ 5,0); konventionelle Sternbildfiguren; inoffizielle rumänische Namen."],"ev.title":["Evenimente apropiate","Upcoming events","Événements à venir","Eventi imminenti","Próximos eventos","Próximos eventos","Közelgő események","Bevorstehende Ereignisse"],"ev.intro":["Alege un interval; Bolta calculează local fazele Lunii, conjuncțiile apropiate, opozițiile și elongațiile maxime, anotimpurile și eclipsele relevante. Momentele se afișează în fusul orar al locului ales.","Choose a range; Bolta computes locally the Moon phases, close conjunctions, oppositions and greatest elongations, seasons and relevant eclipses. Times are shown in the chosen place's time zone.","Choisissez un intervalle ; Bolta calcule localement les phases de la Lune, les conjonctions proches, les oppositions et élongations maximales, les saisons et les éclipses pertinentes. Les heures sont affichées dans le fuseau du lieu choisi.","Scegli un intervallo; Bolta calcola localmente le fasi lunari, le congiunzioni ravvicinate, le opposizioni e le massime elongazioni, le stagioni e le eclissi rilevanti. Gli orari sono mostrati nel fuso del luogo scelto.","Elige un intervalo; Bolta calcula localmente las fases de la Luna, las conjunciones cercanas, las oposiciones y máximas elongaciones, las estaciones y los eclipses relevantes. Las horas se muestran en la zona del lugar elegido.","Escolha um intervalo; a Bolta calcula localmente as fases da Lua, as conjunções próximas, as oposições e máximas elongações, as estações e os eclipses relevantes. As horas são mostradas no fuso do local escolhido.","Válassz időszakot; a Bolta helyben számítja a holdfázisokat, a közeli együttállásokat, az oppozíciókat és legnagyobb elongációkat, az évszakokat és a lényeges fogyatkozásokat. Az időpontok a választott hely időzónájában jelennek meg.","Wähle einen Zeitraum; Bolta berechnet lokal Mondphasen, enge Konjunktionen, Oppositionen und größte Elongationen, Jahreszeiten und relevante Finsternisse. Die Zeiten werden in der Zeitzone des gewählten Ortes angezeigt."],"ev.from":["De la","From","Du","Dal","Desde","De","Ettől","Von"],"ev.to":["Până la","To","Au","Al","Hasta","Até","Eddig","Bis"],"ev.presets":["Intervale rapide:","Quick ranges:","Intervalles rapides :","Intervalli rapidi:","Intervalos rápidos:","Intervalos rápidos:","Gyors időszakok:","Schnellauswahl:"],"ev.p1m":["1 lună","1 month","1 mois","1 mese","1 mes","1 mês","1 hónap","1 Monat"],"ev.p1y":["1 an","1 year","1 an","1 anno","1 año","1 ano","1 év","1 Jahr"],"ev.p5y":["5 ani","5 years","5 ans","5 anni","5 años","5 anos","5 év","5 Jahre"],"ev.cats":["Categorii","Categories","Catégories","Categorie","Categorías","Categorias","Kategóriák","Kategorien"],"ev.cat.phase":["Faze lunare","Moon phases","Phases de la Lune","Fasi lunari","Fases lunares","Fases da Lua","Holdfázisok","Mondphasen"],"ev.cat.moonp":["Conjuncții Lună–planetă","Moon–planet conjunctions","Conjonctions Lune–planète","Congiunzioni Luna–pianeta","Conjunciones Luna–planeta", ează…","Computing…","Calcul en cours…","Calcolo in corso…","Calculando…","A calcular…","Számítás folyamatban…","Berechnung läuft …"],"ev.done":["{n} evenimente în {s} s.","{n} events in {s} s.","{n} événements en {s} s.","{n} eventi in {s} s.","{n} eventos en {s} s.","{n} eventos em {s} s.","{n} esemény, {s} mp alatt.","{n} Ereignisse in {s} s."],"ev.trunc":["Lista a fost limitată la 3000 de evenimente; restrânge intervalul.","The list was capped at 3000 events; narrow the range.","La liste est limitée à 3000 événements ; réduisez l'intervalle.","L'elenco è limitato a 3000 eventi; restringi l'intervallo.","La lista se limitó a 3000 eventos; reduce el intervalo.","A lista foi limitada a 3000 eventos; reduza o intervalo.","A lista 3000 eseményre korlátozva; szűkítsd az időszakot.","Die Liste wurde auf 3000 Ereignisse begrenzt; verkleinere den Zeitraum."],"ev.note":["Conjuncțiile Lună–planetă sunt geocentrice (paralaxa Lunii poate muta apropierea cu până la ~1° pentru un observator). Momentul unei conjuncții = separația unghiulară minimă. Pentru eclipse, doar cea din 2 august 2027 este calculată în detaliu; celelalte sunt doar semnalate când Luna nouă/plină e aproape de nod (tipul și vizibilitatea nu sunt calculate).","Moon–planet conjunctions are geocentric (the Moon's parallax can shift the approach by up to ~1° for an observer). The moment of a conjunction = minimum angular separation. For eclipses only the one of 2 August 2027 is computed in detail; the others are merely flagged when a new/full Moon is near a node (type and visibility are not computed).","Les conjonctions Lune–planète sont géocentriques (la parallaxe de la Lune peut décaler le rapprochement jusqu'à ~1° pour un observateur). L'instant d'une conjonction = séparation angulaire minimale. Pour les éclipses, seule celle du 2 août 2027 est calculée en détail ; les autres sont seulement signalées quand une nouvelle/pleine Lune est proche d'un nœud (type et visibilité non calculés).","Le congiunzioni Luna–pianeta sono geocentriche (la parallasse della Luna può spostare l'avvicinamento fino a ~1° per un osservatore). L'istante di una congiunzione = separazione angolare minima. Per le eclissi solo quella del 2 agosto 2027 è calcolata nel dettaglio; le altre sono solo segnalate quando una Luna nuova/piena è vicina a un nodo (tipo e visibilità non calcolati).","Las conjunciones Luna–planeta son geocéntricas (la paralaje de la Luna puede desplazar el acercamiento hasta ~1° para un observador). El momento de una conjunción = separación angular mínima. De los eclipses solo se calcula en detalle el del 2 de agosto de 2027; los demás solo se señalan cuando una Luna nueva/llena está cerca de un nodo (tipo y visibilidad no calculados).","As conjunções Lua–planeta são geocêntricas (o paralaxe da Lua pode deslocar a aproximação até ~1° para um observador). O instante de uma conjunção = separação angular mínima. Dos eclipses só o de 2 de agosto de 2027 é calculado em detalhe; os outros apenas são assinalados quando uma Lua nova/cheia está perto de um nó (tipo e visibilidade não calculados).","A Hold–bolygó együttállások geocentrikusak (a Hold parallaxisa egy megfigyelő számára akár ~1°-kal eltolhatja a közelséget). Az együttállás pillanata = a legkisebb szögtávolság. A fogyatkozások közül csak a 2027. augusztus 2-it számítjuk részletesen; a többit csak jelezzük, ha az újhold/telihold csomópont közelében van (a típus és a láthatóság nincs számolva).","Die Konjunktionen Mond–Planet sind geozentrisch (die Parallaxe des Mondes kann die Annäherung für einen Beobachter um bis zu ~1° verschieben). Der Zeitpunkt einer Konjunktion = minimaler Winkelabstand. Von den Finsternissen wird nur die vom 2. August 2027 im Detail berechnet; die übrigen werden nur markiert, wenn Neu-/Vollmond nahe einem Knoten steht (Art und Sichtbarkeit nicht berechnet)."],"ev.col.when":["Moment (ora locului)","Moment (place's local time)","Moment (heure locale du lieu)","Momento (ora locale del luogo)","Momento (hora local del lugar)","Momento (hora local do local)","Időpont (a hely ideje)","Zeitpunkt (Ortszeit)"],"ev.col.what":["Eveniment","Event","Événement","Evento","Evento","Evento","Esemény","Ereignis"],"ev.col.detail":["Detalii","Details","Détails","Dettagli","Detalles","Detalhes","Részletek","Details"],"ev.col.act":["Acțiune","Action","Action","Azione","Acción","Ação","Művelet","Aktion"],"ev.jump":["Salt la moment","Jump to time","Aller à ce moment","Vai al momento","Ir al momento","Ir para o momento","Ugrás az időpontra","Zum Zeitpunkt springen"],"ev.jumpTo":["Salt la: {x}","Jump to: {x}","Aller à : {x}","Vai a: {x}","Ir a: {x}","Ir para: {x}","Ugrás ide: {x}","Springe zu: {x}"],"ev.jumped":["Moment setat: {x}","Time set: {x}","Moment réglé : {x}","Momento impostato: {x}","Momento fijado: {x}","Momento definido: {x}","Idő beállítva: {x}","Zeit gesetzt: {x}"],"ev.errDate":["Alege ambele date.","Choose both dates.","Choisissez les deux dates.","Scegli entrambe le date.","Elige ambas fechas.","Escolha ambas as datas.","Válassz mindkét dátumot.","Wähle beide Daten."],"ev.errOrder":["Data finală trebuie să fie după cea de început.","The end date must be after the start date.","La date de fin doit suivre la date de début.","La data finale deve essere successiva a quella iniziale.","La fecha final debe ser posterior a la inicial.","A data final deve ser posterior à inicial.","A záró dátumnak a kezdő után kell lennie.","Das Enddatum muss nach dem Startdatum liegen."],"ev.errRange":["Intervalul trebuie să fie între 1900 și 2100.","The range must lie between 1900 and 2100.","L'intervalle doit être entre 1900 et 2100.","L'intervallo deve essere tra il 1900 e il 2100.","El intervalo debe estar entre 1900 y 2100.","O intervalo deve estar entre 1900 e 2100.","Az időszaknak 1900 és 2100 között kell lennie.","Der Zeitraum muss zwischen 1900 und 2100 liegen."],"ev.errSpan":["Intervalul maxim este de 20 de ani.","The maximum range is 20 years.","L'intervalle maximal est de 20 ans.","L'i ciales.","Calculado localmente pela Bolta para {place}; valores indicativos, não oficiais.","A Bolta helyben számította a(z) {place} helyre; tájékoztató, nem hivatalos értékek.","Von Bolta lokal für {place} berechnet; Richtwerte, nicht offiziell."],"ec.warn.title":["Siguranță: nu privi Soarele fără protecție","Safety: never look at the Sun unprotected","Sécurité : ne regardez jamais le Soleil sans protection","Sicurezza: non guardare mai il Sole senza protezione","Seguridad: nunca mires al Sol sin protección","Segurança: nunca olhe para o Sol sem proteção","Biztonság: soha ne nézz védelem nélkül a Napba","Sicherheit: niemals ungeschützt in die Sonne blicken"],"ec.warn.1":["Nu privi Soarele fără filtre solare certificate ISO 12312-2 (ochelari de eclipsă) sau metode indirecte sigure; ochelarii de soare obișnuiți nu protejează.","Never look at the Sun without certified solar filters (ISO 12312-2 eclipse glasses) or safe indirect methods; ordinary sunglasses do not protect.","Ne regardez jamais le Soleil sans filtres solaires certifiés ISO 12312-2 (lunettes d'éclipse) ou méthodes indirectes sûres ; les lunettes de soleil ordinaires ne protègent pas.","Non guardare mai il Sole senza filtri solari certificati ISO 12312-2 (occhiali da eclissi) o metodi indiretti sicuri; i normali occhiali da sole non proteggono.","No mires nunca al Sol sin filtros solares certificados ISO 12312-2 (gafas de eclipse) o métodos indirectos seguros; las gafas de sol normales no protegen.","Nunca olhe para o Sol sem filtros solares certificados ISO 12312-2 (óculos de eclipse) ou métodos indiretos seguros; os óculos de sol normais não protegem.","Soha ne nézz a Napba ISO 12312-2 szerint tanúsított napszűrő (fogyatkozásnéző szemüveg) vagy biztonságos közvetett módszer nélkül; a hétköznapi napszemüveg nem véd.","Blicke niemals ohne zertifizierte Sonnenfilter (ISO 12312-2, Finsternisbrille) oder sichere indirekte Methoden in die Sonne; gewöhnliche Sonnenbrillen schützen nicht."],"ec.warn.2":["Nu îndrepta binoclul, telescopul sau aparatul foto spre Soare fără un filtru solar dedicat montat în fața obiectivului; filtrul nu se pune la ocular.","Do not point binoculars, a telescope or a camera at the Sun without a dedicated solar filter fitted in front of the lens; never at the eyepiece.","Ne pointez pas jumelles, télescope ou appareil photo vers le Soleil sans filtre solaire dédié placé devant l'objectif ; jamais à l'oculaire.","Non puntare binocoli, telescopi o fotocamere verso il Sole senza un filtro solare dedicato montato davanti all'obiettivo; mai all'oculare.","No apuntes prismáticos, telescopio ni cámara al Sol sin un filtro solar específico colocado delante del objetivo; nunca en el ocular.","Não aponte binóculos, telescópio ou câmara ao Sol sem um filtro solar dedicado colocado à frente da objetiva; nunca na ocular.","Ne irányíts távcsövet, teleszkópot vagy fényképezőgépet a Napra az objektív elé szerelt, kifejezetten napszűrő nélkül; soha ne a szemlencsére.","Richte Fernglas, Teleskop oder Kamera nicht ohne speziellen Sonnenfilter vor dem Objektiv auf die Sonne; niemals am Okular."],"ec.warn.3":["În România eclipsa este doar parțială: filtrul este necesar tot timpul, de la C1 la C4. Doar în banda totalității, în scurta fază de totalitate (între C2 și C3), discul Soarelui e complet acoperit.","In Romania the eclipse is only partial: a filter is required the whole time, from C1 to C4. Only inside the totality band, during the brief totality (between C2 and C3), is the Sun's disc fully covered.","En Roumanie l'éclipse n'est que partielle : un filtre est nécessaire tout le temps, de C1 à C4. Ce n'est que dans la bande de totalité, pendant la brève totalité (entre C2 et C3), que le disque du Soleil est entièrement couvert.","In Romania l'eclissi è solo parziale: il filtro serve per tutto il tempo, da C1 a C4. Solo nella fascia della totalità, durante la breve totalità (tra C2 e C3), il disco del Sole è completamente coperto.","En Rumanía el eclipse es solo parcial: se necesita filtro todo el tiempo, de C1 a C4. Solo dentro de la franja de totalidad, durante la breve totalidad (entre C2 y C3), el disco del Sol queda completamente cubierto.","Na Roménia o eclipse é apenas parcial: é necessário filtro o tempo todo, de C1 a C4. Só dentro da faixa de totalidade, durante a breve totalidade (entre C2 e C3), o disco do Sol fica totalmente coberto.","Romániában a fogyatkozás csak részleges: végig szűrő kell, C1-től C4-ig. Csak a teljesség sávjában, a rövid teljesség alatt (C2 és C3 között) fedi el teljesen a Nap korongját a Hold.","In Rumänien ist die Finsternis nur partiell: Ein Filter ist die ganze Zeit nötig, von C1 bis C4. Nur innerhalb der Totalitätszone ist die Sonnenscheibe während der kurzen Totalität (zwischen C2 und C3) vollständig bedeckt."],"ec.warn.4":["Valorile din această pagină sunt calculate de Bolta, nu sunt oficiale; nu te baza pe ele pentru a scoate filtrul. Urmează indicațiile organizatorilor și ale observatoarelor și consultă publicațiile oficiale.","The values on this page are computed by Bolta and are not official; do not rely on them to remove your filter. Follow the guidance of organisers and observatories and consult official publications.","Les valeurs de cette page sont calculées par Bolta et ne sont pas officielles ; ne vous y fiez pas pour retirer votre filtre. Suivez les indications des organisateurs et des observatoires et consultez les publications officielles.","I valori di questa pagina sono calcolati da Bolta e non sono ufficiali; non fidarti di essi per togliere il filtro. Segui le indicazioni degli organizzatori e degli osservatori e consulta le pubblicazioni ufficiali.","Los valores de esta página los calcula Bolta y no son oficiales; no confíes en ellos para quitar el filtro. Sigue las indicaciones de los organizadores y observatorios y consulta las publicaciones oficiales.","Os valores desta página são calculados pela Bolta e não são oficiais; não confie neles para retirar o filtro. Siga as indicações dos organizadores e dos observatórios e consulte as publicações oficiais.","Az oldal értékeit a Bolta számolja, nem hivatalosak; ne ezek alapján vedd le a szűrőt. Kövesd a szervezők és a csillagvizsgálók útmutatását, és nézd a hivatalos kiadványokat.","Die Werte auf dieser Seite werden von Bolta berechnet und sind nicht offiziell; verlasse dich nicht darauf, um den Filter abzunehmen. Folge den Hinweisen der Veranstalter und Sternwarten und konsultiere offizielle Veröffentlichungen."],"ec.warn.5":["Supraveghează copiii și nu te uita la Soare printr-un telefon sau o cameră fără filtru; leziunile retinei pot fi permanente și nu dor.","Supervise children and do not look at the Sun through a phone or camera without a filter; retinal damage can be permanent and painless.","Surveillez les enfants et ne regardez pas le Soleil à travers un téléphone ou une caméra sans filtre ; les lésions de la rétine peuvent être permanentes et indolores.","Sorveglia i bambini e non guardare il Sole attraverso un telefono o una fotocamera senza filtro; i danni alla retina possono essere permanenti e indolori.","Vigila a los niños y no mires al Sol a través de un teléfono o cámara sin filtro; el daño en la retina puede ser permanente e indoloro.","Vigie as crianças e não olhe para o Sol através de um telemóvel ou câmara sem filtro; os danos na retina podem ser permanentes e indolores.","Felügyeld a gyerekeket, és ne nézz a Napba telefonon vagy kamerán át szűrő nélkül; a retinakárosodás maradandó és fájdalommentes lehet.","Beaufsichtige Kinder und sieh nicht ohne Filter durch Handy oder Kamera in die Sonne; Netzhautschäden können dauerhaft und schmerzlos sein."],"ec.title":["Eclipsa totală de Soare din 2 august 2027","Total solar eclipse of 2 August 2027","Éclipse totale de Soleil du 2 août 2027","Eclissi totale di Sole del 2 agosto 2027","Eclipse total de Sol del 2 de agosto de 2027","Eclipse total do Sol de 2 de agosto de 2027","A 2027. augusztus 2-i teljes napfogyatkozás"," ny","Durchmesserverhältnis Mond/Sonne"],"ec.durPartial":["Durata fazei parțiale","Duration of the partial phase","Durée de la phase partielle","Durata della fase parziale","Duración de la fase parcial","Duração da fase parcial","A részleges fázis időtartama","Dauer der partiellen Phase"],"ec.band":["Banda totalității","Totality band","Bande de totalité","Fascia della totalità","Franja de totalidad","Faixa de totalidade","A teljesség sávja","Totalitätszone"],"ec.inBand":["în bandă ({x} km de marginea cea mai apropiată)","inside the band ({x} km from the nearest edge)","dans la bande ({x} km du bord le plus proche)","dentro la fascia ({x} km dal bordo più vicino)","dentro de la franja ({x} km del borde más cercano)","dentro da faixa ({x} km da margem mais próxima)","a sávon belül ({x} km-re a legközelebbi széltől)","innerhalb der Zone ({x} km vom nächsten Rand)"],"ec.outBand":["în afara benzii ({x} km de marginea cea mai apropiată)","outside the band ({x} km from the nearest edge)","hors de la bande ({x} km du bord le plus proche)","fuori dalla fascia ({x} km dal bordo più vicino)","fuera de la franja ({x} km del borde más cercano)","fora da faixa ({x} km da margem mais próxima)","a sávon kívül ({x} km-re a legközelebbi széltől)","außerhalb der Zone ({x} km vom nächsten Rand)"],"ec.err.t":["Marja de eroare","Error margin","Marge d'erreur","Margine di errore","Margen de error","Margem de erro","Hibahatár","Fehlergrenze"],"ec.err":["Contacte (C1–C4) și maxim: ≈ ±3 s față de calculul independent de referință; obscurare ≲ 0,05 puncte procentuale (max. 0,01 față de referință) plus incertitudinea ΔT (≈ ±1 s ⇒ ±0,01 p.p.). Sunt valori calculate, nu oficiale.","Contacts (C1–C4) and maximum: ≈ ±3 s against the independent reference computation; obscuration ≲ 0.05 percentage points (max. 0.01 against the reference) plus ΔT uncertainty (≈ ±1 s ⇒ ±0.01 pp). Computed, not official values.","Contacts (C1–C4) et maximum : ≈ ±3 s par rapport au calcul de référence indépendant ; obscuration ≲ 0,05 point de pourcentage (max. 0,01 par rapport à la référence) plus l'incertitude sur ΔT (≈ ±1 s ⇒ ±0,01 pt). Valeurs calculées, non officielles.","Contatti (C1–C4) e massimo: ≈ ±3 s rispetto al calcolo di riferimento indipendente; oscuramento ≲ 0,05 punti percentuali (max. 0,01 rispetto al riferimento) più l'incertezza su ΔT (≈ ±1 s ⇒ ±0,01 pp). Valori calcolati, non ufficiali.","Contactos (C1–C4) y máximo: ≈ ±3 s respecto al cálculo de referencia independiente; oscurecimiento ≲ 0,05 puntos porcentuales (máx. 0,01 respecto a la referencia) más la incertidumbre de ΔT (≈ ±1 s ⇒ ±0,01 pp). Valores calculados, no oficiales.","Contactos (C1–C4) e máximo: ≈ ±3 s face ao cálculo de referência independente; obscurecimento ≲ 0,05 pontos percentuais (máx. 0,01 face à referência) mais a incerteza de ΔT (≈ ±1 s ⇒ ±0,01 pp). Valores calculados, não oficiais.","Érintések (C1–C4) és maximum: ≈ ±3 mp a független referenciaszámításhoz képest; takarás ≲ 0,05 százalékpont (legfeljebb 0,01 a referenciához képest) plusz a ΔT bizonytalansága (≈ ±1 mp ⇒ ±0,01 szp). Számított, nem hivatalos értékek.","Kontakte (C1–C4) und Maximum: ≈ ±3 s gegenüber der unabhängigen Referenzrechnung; Bedeckung ≲ 0,05 Prozentpunkte (max. 0,01 gegenüber der Referenz) plus ΔT-Unsicherheit (≈ ±1 s ⇒ ±0,01 PP). Berechnete, keine offiziellen Werte."],"ec.belowHorizon":["* Soarele este sub orizont în acel moment.","* The Sun is below the horizon at that moment.","* Le Soleil est sous l'horizon à ce moment.","* Il Sole è sotto l'orizzonte in quel momento.","* El Sol está bajo el horizonte en ese momento.","* O Sol está abaixo do horizonte nesse momento.","* A Nap ekkor a horizont alatt van.","* Die Sonne steht zu diesem Zeitpunkt unter dem Horizont."],"ec.goSky":["Vezi cerul la maxim","See the sky at maximum","Voir le ciel au maximum","Vedi il cielo al massimo","Ver el cielo en el máximo","Ver o céu no máximo","Az égbolt a maximumkor","Himmel zum Maximum ansehen"],"ec.wentSky":["Cerul este setat la momentul maxim, centrat pe Soare.","The sky is set to the moment of maximum, centred on the Sun.","Le ciel est réglé sur le moment du maximum, centré sur le Soleil.","Il cielo è impostato sul momento del massimo, centrato sul Sole.","El cielo se ha fijado en el momento del máximo, centrado en el Sol.","O céu foi definido para o momento do máximo, centrado no Sol.","Az égbolt a maximum pillanatára állítva, a Napra középre igazítva.","Der Himmel ist auf den Zeitpunkt des Maximums gesetzt, auf die Sonne zentriert."],"ec.cd.fmt":["{d} zile {h}:{m}:{s}","{d} days {h}:{m}:{s}","{d} jours {h}:{m}:{s}","{d} giorni {h}:{m}:{s}","{d} días {h}:{m}:{s}","{d} dias {h}:{m}:{s}","{d} nap {h}:{m}:{s}","{d} Tage {h}:{m}:{s}"],"ec.cd.toC1":["până la începutul eclipsei parțiale (C1) la locul ales: {when}","until the start of the partial eclipse (C1) at the chosen place: {when}","jusqu'au début de l'éclipse partielle (C1) au lieu choisi : {when}","fino all'inizio dell'eclissi parziale (C1) nel luogo scelto: {when}","hasta el inicio del eclipse parcial (C1) en el lugar elegido: {when}","até ao início do eclipse parcial (C1) no local escolhido: {when}","a részleges fogyatkozás kezdetéig (C1) a választott helyen: {when}","bis zum Beginn der partiellen Finsternis (C1) am gewählten Ort: {when}"],"ec.cd.toGlobal":["până la maximul global al eclipsei (aici nu este vizibilă): {when}","until the global maximum of the eclipse (not visible here): {when}","jusqu'au maximum global de l'éclipse (non visible ici) : {when}","fino al massimo globale dell'eclissi (qui non visibile): {when}","hasta el máximo global del eclipse (aquí no es visible): {when}","até ao máximo global do eclipse (aqui não é visível): {when}","a fogyatkozás globális maximumáig (itt nem látható): {when}","bis zum globalen Maximum der Finsternis (hier nicht sichtbar): {when}"],"ec.cd.now":["Eclipsa este în curs.","The eclipse is in progress.","L'éclipse est en cours.","L'eclissi è in corso.","El eclipse está en curso.","O eclipse está ,"Au maximum","Al massimo","En el máximo","No máximo","A maximumnál","Zum Maximum"],"ec.sim.note":["Desen ilustrativ: orientare față de orizont (zenitul în sus), coroana este stilizată, luminozitatea cerului aproximativă; nu este o predicție a aspectului real.","Illustrative drawing: horizon-based orientation (zenith up), the corona is stylised, sky brightness approximate; not a prediction of the real appearance.","Dessin illustratif : orientation par rapport à l'horizon (zénith en haut), couronne stylisée, luminosité du ciel approximative ; ce n'est pas une prédiction de l'aspect réel.","Disegno illustrativo: orientamento rispetto all'orizzonte (zenit in alto), corona stilizzata, luminosità del cielo approssimata; non è una previsione dell'aspetto reale.","Dibujo ilustrativo: orientación respecto al horizonte (cenit arriba), corona estilizada, brillo del cielo aproximado; no es una predicción del aspecto real.","Desenho ilustrativo: orientação em relação ao horizonte (zénite em cima), coroa estilizada, brilho do céu aproximado; não é uma previsão do aspeto real.","Illusztratív rajz: a horizonthoz igazított tájolás (zenit felül), a korona stilizált, az ég fényessége közelítő; nem a valós megjelenés előrejelzése.","Illustrative Zeichnung: Ausrichtung am Horizont (Zenit oben), Korona stilisiert, Himmelshelligkeit genähert; keine Vorhersage des tatsächlichen Anblicks."],"ec.sim.below":["Soarele este sub orizont","The Sun is below the horizon","Le Soleil est sous l'horizon","Il Sole è sotto l'orizzonte","El Sol está bajo el horizonte","O Sol está abaixo do horizonte","A Nap a horizont alatt van","Die Sonne steht unter dem Horizont"],"ec.sim.before":["Înainte de eclipsă","Before the eclipse","Avant l'éclipse","Prima dell'eclissi","Antes del eclipse","Antes do eclipse","A fogyatkozás előtt","Vor der Finsternis"],"ec.sim.after":["După eclipsă","After the eclipse","Après l'éclipse","Dopo l'eclissi","Después del eclipse","Depois do eclipse","A fogyatkozás után","Nach der Finsternis"],"ec.sim.partial":["Fază parțială","Partial phase","Phase partielle","Fase parziale","Fase parcial","Fase parcial","Részleges fázis","Partielle Phase"],"ec.sim.total":["Totalitate","Totality","Totalité","Totalità","Totalidad","Totalidade","Teljesség","Totalität"],"ec.sim.sep":["separația centrelor {x}′","centre separation {x}′","séparation des centres {x}′","separazione dei centri {x}′","separación de centros {x}′","separação dos centros {x}′","a középpontok távolsága {x}′","Abstand der Mittelpunkte {x}′"],"ec.map.title":["Banda totalității (schemă)","Totality band (schematic)","Bande de totalité (schéma)","Fascia della totalità (schema)","Franja de totalidad (esquema)","Faixa de totalidade (esquema)","A teljesség sávja (vázlat)","Totalitätszone (Schema)"],"ec.map.aria":["Schemă a benzii totalității pe o grilă de coordonate, fără hartă de bază","Schematic of the totality band on a coordinate grid, without a base map","Schéma de la bande de totalité sur une grille de coordonnées, sans fond de carte","Schema della fascia della totalità su una griglia di coordinate, senza mappa di base","Esquema de la franja de totalidad sobre una cuadrícula de coordenadas, sin mapa base","Esquema da faixa de totalidade numa grelha de coordenadas, sem mapa de base","A teljesség sávjának vázlata koordinátarácson, alaptérkép nélkül","Schema der Totalitätszone auf einem Koordinatengitter, ohne Grundkarte"],"ec.map.note":["Schemă pe grilă de coordonate (fără hartă de bază): traseul GeoJSON calculat de Bolta. În afara benzii eclipsa este parțială, inclusiv în România. Limitele zonei parțiale nu sunt calculate.","Schematic on a coordinate grid (no base map): the GeoJSON track computed by Bolta. Outside the band the eclipse is partial, including in Romania. The limits of the partial zone are not computed.","Schéma sur grille de coordonnées (sans fond de carte) : le tracé GeoJSON calculé par Bolta. Hors de la bande l'éclipse est partielle, y compris en Roumanie. Les limites de la zone partielle ne sont pas calculées.","Schema su griglia di coordinate (senza mappa di base): il tracciato GeoJSON calcolato da Bolta. Fuori dalla fascia l'eclissi è parziale, inclusa la Romania. I limiti della zona parziale non sono calcolati.","Esquema sobre cuadrícula de coordenadas (sin mapa base): el trazado GeoJSON calculado por Bolta. Fuera de la franja el eclipse es parcial, incluida Rumanía. Los límites de la zona parcial no se calculan.","Esquema numa grelha de coordenadas (sem mapa de base): o traçado GeoJSON calculado pela Bolta. Fora da faixa o eclipse é parcial, incluindo na Roménia. Os limites da zona parcial não são calculados.","Vázlat koordinátarácson (alaptérkép nélkül): a Bolta által számított GeoJSON-nyomvonal. A sávon kívül a fogyatkozás részleges, Romániában is. A részleges zóna határai nincsenek kiszámolva.","Schema auf einem Koordinatengitter (ohne Grundkarte): die von Bolta berechnete GeoJSON-Spur. Außerhalb der Zone ist die Finsternis partiell, auch in Rumänien. Die Grenzen der partiellen Zone werden nicht berechnet."],"ec.map.max":["maxim","greatest eclipse","maximum","massimo","máximo","máximo","maximum","Maximum"],"ec.map.legend":["bandă = totalitate · linie punctată = linia centrală (ore UT)","band = totality · dashed line = central line (UT times)","bande = totalité · pointillés = ligne centrale (heures UT)","fascia = totalità · tratteggio = linea centrale (ore UT)","franja = totalidad · discontinua = línea central (horas UT)","faixa = totalidade · tracejado = linha central (horas UT)","sáv = teljesség · szaggatott = középvonal (UT idők)","Band = Totalität · gestrichelt = Mittellinie (UT-Zeiten)"],"ec.map.outside":["{p} este în afara cadrului hărții.","{p} is outside the map frame.","{p} est hors du cadre de la carte.","{p} è fuori dal riquadro della mappa.","{p} está fuera del marco del mapa.","{p} está fora do enquadramento do mapa.","{p} a térképkereten kívül van.","{p} liegt außerhalb des Kartenausschnitts."],"ec.g.max":["Maximul global","Global maximum","Maximum global","Massimo globale","Máximo global","Máximo global","Globális maximum","Globales Maximum"],"ec.g.pt":["Punctul maximului","Point of greatest eclipse","Point du maximum","Punto del massimo","Punto del máximo","Ponto do máximo","A maximum helye","Ort des Maximums"],"ec.g.width":["Lățimea benzii","Band width","Largeur de la bande","Larghezza della fascia","Anchura de la franja","Largura da faixa","A sáv szélessége","Breite der Zone"],"ec.g.cover":["Acoperire","Coverage","Couverture","Copertura","Cobertura","Cobertura","Lefedettség","Abdeckung"],"ec.g.coverTxt":["Banda totalității trece prin Gibraltar/Maroc, Tunisia, Libia, Egipt, Arabia Saudită, Yemen și Somalia; în afara ei eclipsa este parțială (inclusiv în România).","The totality band crosses Gibraltar/Morocco, Tunisia, Libya, Egypt, Saudi Arabia, Yemen and Somalia; outside it the eclipse is partial (including Romania).","La bande de totalité traverse Gibraltar/Maroc, la Tunisie, la Libye, l'Égypte, l'Arabie saoudite, le Yémen et la Somalie ; en dehors, l'éclipse est partielle (y compris en Roumanie).","La fascia della totalità attraversa Gibilterra/Marocco, Tunisia, Libia, Egitto, Arabia Saudita, Yemen e Somalia; fuori da essa l'eclissi è parziale (inclusa la Romania).","La franja de totalidad cruza Gibraltar/Marruecos, Túnez, Libia, Egipto, Arabia Saudí, Yemen y Somalia; fuera de ella el eclipse es parcial (incluida Rumanía).","A faixa de totalidade atravessa Gibraltar/Marrocos, Tunísia, Líbia, Egito, Arábia Saudita, Iémen e Somália; fora dela o eclipse é parcial (incluindo a Roménia).","A teljesség sávja Gibraltáron/Marokkón, Tunéziáen, Líbián, Egyiptomon, Szaúd-Arábián, Jemenen és Szomálián halad át; azon kívül a fogyatkozás részleges (Romániában is).","Die Totalitätszone verläuft über Gibraltar/Marokko, Tunesien, Libyen, Ägypten, Saudi-Arabien, Jemen und Somalia; außerhalb ist die Finsternis partiell (auch in Rumänien)."],"ec.ro.title":["România: obscurarea calculată pe oraș","Romania: computed obscuration by city","Roumanie : obscuration calculée par ville","Romania: oscuramento calcolato per città","Rumanía: oscurecimiento calculado por ciudad","Roménia: obscurecimento calculado por cidade","Románia: városonként számított takarás","Rumänien: berechnete Bedeckung je Stadt"],"ec.ro.note":["Ore locale (EEST, UTC+3). Eclipsa este parțială pe tot teritoriul; magnitudinea este fracția din diametrul Soarelui, obscurarea fracția din aria discului. Marja de eroare: vezi mai sus.","Local times (EEST, UTC+3). The eclipse is partial throughout Romania; magnitude is the fraction of the Sun's diameter, obscuration the fraction of the disc's area. Error margin: see above.","Heures locales (EEST, UTC+3). L'éclipse est partielle sur tout le territoire ; la magnitude est la fraction du diamètre du Soleil, l'obscuration la fraction de la surface du disque. Marge d'erreur : voir plus haut.","Orari locali (EEST, UTC+3). L'eclissi è parziale su tutto il territorio; la magnitudine è la frazione del diametro del Sole, l'oscuramento la frazione dell'area del disco. Margine di errore: vedi sopra.","Horas locales (EEST, UTC+3). El eclipse es parcial en todo el territorio; la magnitud es la fracción del diámetro del Sol, el oscurecimiento la fracción del área del disco. Margen de error: véase arriba.","Horas locais (EEST, UTC+3). O eclipse é parcial em todo o território; a magnitude é a fração do diâmetro do Sol, o obscurecimento a fração da área do disco. Margem de erro: ver acima.","Helyi idő (EEST, UTC+3). A fogyatkozás az egész országban részleges; a magnitúdó a Nap átmérőjének hányada, a takarás a korong területének hányada. Hibahatár: lásd fent.","Ortszeit (EEST, UTC+3). Die Finsternis ist im ganzen Land partiell; die Größe ist der Anteil am Sonnendurchmesser, die Bedeckung der Anteil an der Scheibenfläche. Fehlergrenze: siehe oben."],"ec.ro.city":["Oraș","City","Ville","Città","Ciudad","Cidade","Város","Stadt"],"ec.obsc":["Obscurare","Obscuration","Obscuration","Oscuramento","Oscurecimiento","Obscurecimento","Takarás","Bedeckung"],"ec.mag":["Magnitudine","Magnitude","Magnitude","Magnitudine","Magnitud","Magnitude","Magnitúdó","Größe"],"wd.title":["Cerul în cuvinte","The sky in words","Le ciel en mots","Il cielo a parole","El cielo con palabras","O céu por palavras","Az égbolt szavakkal","Der Himmel in Worten"],"wd.intro":["Descriere text a cerului pentru locul și momentul curente, cu obiectele vizibile ordonate după altitudine. Se actualizează la cerere și când schimbi locul sau momentul.","Text description of the sky for the current place and moment, with visible objects ordered by altitude. It updates on request and when you change the place or time.","Description textuelle du ciel pour le lieu et le moment actuels, avec les objets visibles classés par hauteur. Elle se met à jour sur demande et quand vous changez le lieu ou l'heure.","Descrizione testuale del cielo per il luogo e il momento attuali, con gli oggetti visibili ordinati per altezza. Si aggiorna su richiesta e quando cambi luogo od ora.","Descripción textual del cielo para el lugar y momento actuales, con los objetos visibles ordenados por altura. Se actualiza a petición y al cambiar el lugar o la hora.","Descrição textual do céu para o local e momento atuais, com os objetos visíveis ordenados por altura. Atualiza-se a pedido e ao mudar o local ou a hora.","Szöveges leírás az égboltról az aktuális helyre és időpontra, a látható objektumok magasság szerint rendezve. Kérésre, illetve hely- vagy időváltáskor frissül.","Textbeschreibung des Himmels für den aktuellen Ort und Zeitpunkt, sichtbare Objekte nach Höhe geordnet. Aktualisiert sich auf Wunsch und bei Änderung von Ort oder Zeit."],"wd.maglim":["Stele până la magnitudinea","Stars down to magnitude","Étoiles jusqu'à la magnitude","Stelle fino alla magnitudine","Estrellas hasta la magnitud","Estrelas até à magnitude","Csillagok fényességig","Sterne bis Helligkeit"],"wd.below":["arată și obiectele sub clairée, à {alt}° de hauteur, vers le {dir}.","La Luna: {ph}, {ill}% illuminata, a {alt}° di altezza, verso {dir}.","La Luna: {ph}, {ill} % iluminada, a {alt}° de altura, hacia el {dir}.","A Lua: {ph}, {ill}% iluminada, a {alt}° de altura, para {dir}.","A Hold: {ph}, {ill}% megvilágítva, {alt}° magasan, {dir} felé.","Der Mond: {ph}, {ill} % beleuchtet, {alt}° hoch, in Richtung {dir}."],"wd.moonDown":["Luna ({ph}, {ill}% iluminată) este sub orizont.","The Moon ({ph}, {ill}% illuminated) is below the horizon.","La Lune ({ph}, {ill} % éclairée) est sous l'horizon.","La Luna ({ph}, {ill}% illuminata) è sotto l'orizzonte.","La Luna ({ph}, {ill} % iluminada) está bajo el horizonte.","A Lua ({ph}, {ill}% iluminada) está abaixo do horizonte.","A Hold ({ph}, {ill}% megvilágítva) a horizont alatt van.","Der Mond ({ph}, {ill} % beleuchtet) steht unter dem Horizont."],"wd.planets":["Planete deasupra orizontului: {list}.","Planets above the horizon: {list}.","Planètes au-dessus de l'horizon : {list}.","Pianeti sopra l'orizzonte: {list}.","Planetas sobre el horizonte: {list}.","Planetas acima do horizonte: {list}.","Bolygók a horizont felett: {list}.","Planeten über dem Horizont: {list}."],"wd.noPlanets":["Nicio planetă (Mercur–Uranus) nu este deasupra orizontului.","No planet (Mercury–Uranus) is above the horizon.","Aucune planète (Mercure–Uranus) n'est au-dessus de l'horizon.","Nessun pianeta (Mercurio–Urano) è sopra l'orizzonte.","Ningún planeta (Mercurio–Urano) está sobre el horizonte.","Nenhum planeta (Mercúrio–Urano) está acima do horizonte.","Egyetlen bolygó (Merkúr–Uránusz) sincs a horizont felett.","Kein Planet (Merkur–Uranus) steht über dem Horizont."],"wd.dayNote":["Este zi: stelele și majoritatea planetelor nu se văd cu ochiul liber (Venus și Jupiter pot fi vizibile ziua doar dacă știi unde să le cauți).","It is daytime: stars and most planets cannot be seen with the naked eye (Venus and Jupiter can be visible by day only if you know where to look).","C'est le jour : les étoiles et la plupart des planètes ne sont pas visibles à l'œil nu (Vénus et Jupiter peuvent l'être de jour seulement si l'on sait où regarder).","È giorno: le stelle e la maggior parte dei pianeti non si vedono a occhio nudo (Venere e Giove possono essere visibili di giorno solo se si sa dove cercarli).","Es de día: las estrellas y la mayoría de los planetas no se ven a simple vista (Venus y Júpiter pueden verse de día solo si sabes dónde buscarlos).","É dia: as estrelas e a maioria dos planetas não se veem a olho nu (Vénus e Júpiter só podem ser vistos de dia se souber onde procurar).","Nappal van: a csillagok és a legtöbb bolygó szabad szemmel nem látható (a Vénusz és a Jupiter nappal csak akkor, ha tudod, hol keresd).","Es ist Tag: Sterne und die meisten Planeten sind mit bloßem Auge nicht zu sehen (Venus und Jupiter nur, wenn man weiß, wo man suchen muss)."],"wd.twiNote":["Este crepuscul: doar obiectele cele mai strălucitoare se văd încă.","It is twilight: only the brightest objects can be seen yet.","C'est le crépuscule : seuls les objets les plus brillants sont déjà visibles.","È crepuscolo: sono visibili solo gli oggetti più luminosi.","Es el crepúsculo: solo se ven aún los objetos más brillantes.","É crepúsculo: só os objetos mais brilhantes já se veem.","Szürkület van: egyelőre csak a legfényesebb objektumok látszanak.","Es ist Dämmerung: nur die hellsten Objekte sind schon zu sehen."],"wd.stars":["Stele vizibile acum deasupra orizontului ({n}); cele mai strălucitoare: {list}.","Stars above the horizon and visible now ({n}); the brightest: {list}.","Étoiles au-dessus de l'horizon et visibles maintenant ({n}) ; les plus brillantes : {list}.","Stelle sopra l'orizzonte e visibili ora ({n}); le più luminose: {list}.","Estrellas sobre el horizonte y visibles ahora ({n}); las más brillantes: {list}.","Estrelas acima do horizonte e visíveis agora ({n}); as mais brilhantes: {list}.","A horizont felett látható csillagok most ({n}); a legfényesebbek: {list}.","Jetzt über dem Horizont sichtbare Sterne ({n}); die hellsten: {list}."],"wd.noStars":["Nicio stea din lista aleasă nu este vizibilă acum (cer prea luminos sau sub orizont).","None of the chosen stars is visible now (sky too bright or below the horizon).","Aucune des étoiles choisies n'est visible maintenant (ciel trop lumineux ou sous l'horizon).","Nessuna delle stelle scelte è visibile ora (cielo troppo luminoso o sotto l'orizzonte).","Ninguna de las estrellas elegidas es visible ahora (cielo demasiado brillante o bajo el horizonte).","Nenhuma das estrelas escolhidas é visível agora (céu demasiado claro ou abaixo do horizonte).","A választott csillagok közül most egy sem látható (túl világos az ég, vagy a horizont alatt vannak).","Keiner der gewählten Sterne ist jetzt sichtbar (Himmel zu hell oder unter dem Horizont)."],"wd.show":["Arată în cer","Show in sky","Montrer dans le ciel","Mostra nel cielo","Mostrar en el cielo","Mostrar no céu","Mutasd az égen","Am Himmel zeigen"],"wd.showX":["Arată în cer: {x}","Show in the sky: {x}","Montrer dans le ciel : {x}","Mostra nel cielo: {x}","Mostrar en el cielo: {x}","Mostrar no céu: {x}","Mutasd az égen: {x}","Am Himmel zeigen: {x}"],"wd.more":["… și încă {n} obiecte (restrânge prin magnitudine).","… and {n} more objects (narrow by magnitude).","… et {n} objets de plus (restreindre par la magnitude).","… e altri {n} oggetti (restringi per magnitudine).","… y {n} objetos más (restringe por magnitud).","… e mais {n} objetos (restrinja por magnitude).","… és még {n} objektum (szűkíts a fényesség szerint).","… und {n} weitere Objekte (nach Helligkeit einschränken)."],"dir.N":["nord","north","nord","nord","norte","norte","észak","Norden"],"dir.NE":["nord-est","north-east","nord-est","nord-est","noreste","nordeste","északkelet","Nordosten"],"dir.E":["est","east","est","est","este","este","kelet","Osten"],"dir.SE":["sud-est","south-east","sud-est","sud-est","sureste","sudeste","délkelet","Südosten"],"dir.S":["sud","south","sud","su
