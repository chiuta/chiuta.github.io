enadas no válidas (1900–2100).","Parâmetro do link ignorado: data ou coordenadas inválidas (1900–2100).","A hivatkozás paramétere figyelmen kívül hagyva: érvénytelen dátum vagy koordináta (1900–2100).","Link-Parameter ignoriert: ungültiges Datum oder ungültige Koordinaten (1900–2100)."],"lnk.place":["Loc din link, doar pentru această sesiune: nu se salvează.","Place from the link, for this session only: not saved.","Lieu du lien, pour cette session seulement : non enregistré.","Luogo dal link, solo per questa sessione: non salvato.","Lugar del enlace, solo para esta sesión: no se guarda.","Local do link, só para esta sessão: não é guardado.","A hivatkozás helye csak erre a munkamenetre érvényes: nem kerül mentésre.","Ort aus dem Link, nur für diese Sitzung: wird nicht gespeichert."],"pl.full":["Limita de 300 de locuri a fost atinsă.","The limit of 300 places was reached.","La limite de 300 lieux est atteinte.","Il limite di 300 luoghi è stato raggiunto.","Se alcanzó el límite de 300 lugares.","O limite de 300 locais foi atingido.","Elérted a 300 helyes korlátot.","Das Limit von 300 Orten ist erreicht."],"pl.exported":["Exportat: {n} locuri.","Exported: {n} places.","Exporté : {n} lieux.","Esportati: {n} luoghi.","Exportados: {n} lugares.","Exportados: {n} locais.","Exportálva: {n} hely.","Exportiert: {n} Orte."],"pl.imported":["Importate: {n} locuri noi; omise: {s} (duplicate sau invalide).","Imported: {n} new places; skipped: {s} (duplicates or invalid).","Importés : {n} nouveaux lieux ; ignorés : {s} (doublons ou invalides).","Importati: {n} nuovi luoghi; saltati: {s} (duplicati o non validi).","Importados: {n} lugares nuevos; omitidos: {s} (duplicados o no válidos).","Importados: {n} locais novos; ignorados: {s} (duplicados ou inválidos).","Importálva: {n} új hely; kihagyva: {s} (duplikált vagy érvénytelen).","Importiert: {n} neue Orte; übersprungen: {s} (Duplikate oder ungültig)."],"pl.errJson":["Fișierul nu este JSON valid.","The file is not valid JSON.","Le fichier n'est pas un JSON valide.","Il file non è un JSON valido.","El archivo no es JSON válido.","O ficheiro não é JSON válido.","A fájl nem érvényes JSON.","Die Datei ist kein gültiges JSON."],"pl.errFormat":["Nu este un fișier „fff-bundle” (schema 1).","Not an “fff-bundle” file (schema 1).","Ce n'est pas un fichier « fff-bundle » (schéma 1).","Non è un file «fff-bundle» (schema 1).","No es un archivo «fff-bundle» (esquema 1).","Não é um ficheiro «fff-bundle» (esquema 1).","Nem „fff-bundle” fájl (1-es séma).","Keine „fff-bundle“-Datei (Schema 1)."],"pl.errApp":["Fișierul aparține altei aplicații ({x}).","The file belongs to another app ({x}).","Le fichier appartient à une autre application ({x}).","Il file appartiene a un'altra app ({x}).","El archivo pertenece a otra aplicación ({x}).","O ficheiro pertence a outra aplicação ({x}).","A fájl másik alkalmazáshoz tartozik ({x}).","Die Datei gehört zu einer anderen App ({x})."],"pl.errData":["Fișierul nu conține lista de locuri așteptată.","The file lacks the expected list of places.","Le fichier ne contient pas la liste de lieux attendue.","Il file non contiene l'elenco di luoghi atteso.","El archivo no contiene la lista de lugares esperada.","O ficheiro não contém a lista de locais esperada.","A fájl nem tartalmazza a várt helylistát.","Die Datei enthält nicht die erwartete Ortsliste."],"pl.errBig":["Fișierul este prea mare (max. 2 MB).","The file is too large (max. 2 MB).","Le fichier est trop grand (max. 2 Mo).","Il file è troppo grande (max. 2 MB).","El archivo es demasiado grande (máx. 2 MB).","O ficheiro é demasiado grande (máx. 2 MB).","A fájl túl nagy (legfeljebb 2 MB).","Die Datei ist zu groß (max. 2 MB)."],"ab.title":["Despre Bolta","About Bolta","À propos de Bolta","Informazioni su Bolta","Acerca de Bolta","Sobre a Bolta","A Boltáról","Über Bolta"],"ab.what":["Bolta este un planetariu care funcționează complet offline: calculează poziția Soarelui, a Lunii, a planetelor și a 1627 de stele pentru orice loc și orice moment între 1900 și 2100, apoi le desenează pe un cer proiectat. Nu trimite nimic pe rețea.","Bolta is a planetarium that works fully offline: it computes the position of the Sun, the Moon, the planets and 1627 stars for any place and any moment between 1900 and 2100, then draws them on a projected sky. Nothing is sent over the network.","Bolta est un planétarium entièrement hors ligne : il calcule la position du Soleil, de la Lune, des planètes et de 1627 étoiles pour n'importe quel lieu et moment entre 1900 et 2100, puis les dessine sur un ciel projeté. Rien n'est envoyé sur le réseau.","Bolta è un planetario che funziona completamente offline: calcola la posizione di Sole, Luna, pianeti e 1627 stelle per qualsiasi luogo e momento tra il 1900 e il 2100, poi li disegna su un cielo proiettato. Nulla viene inviato in rete.","Bolta es un planetario que funciona totalmente sin conexión: calcula la posición del Sol, la Luna, los planetas y 1627 estrellas para cualquier lugar y momento entre 1900 y 2100, y los dibuja en un cielo proyectado. No se envía nada por la red.","A Bolta um planetário totalmente offline: calcula a posição do Sol, da Lua, dos planetas e de 1627 estrelas para qualquer local e momento entre 1900 e 2100 e desenha-os num céu projetado. Nada é enviado pela rede.","A Bolta teljesen offline planetárium: bármely helyre és időpontra 1900 és 2100 között kiszámítja a Nap, a Hold, a bolygók és 1627 csillag helyzetét, majd kivetített égboltra rajzolja őket. Semmit sem küld a hálózatra.","Bolta ist ein vollständig offline arbeitendes Planetarium: Es berechnet die Position von Sonne, Mond, Planeten und 1627 Sternen für jeden Ort und Zeitpunkt zwischen 1900 und 2100 und zeichnet sie auf einen projizierten Himmel. Es wird nichts über das Netzwerk gesendet."],"ab.limits.t":["Limite asumate","Declared limits","Limites assumées","Limiti dichiarati","Límites declarados","Limites assumidos","Vállalt korlátok","Erklärte Grenzen"],"ab.l1":["Nu este un instrument de navigație și nu se folosește pentru astrofotografie de precizie.","It is not a navigation tool and must not be used for precision astrophotography.","Ce n'est pas un instrument de navigation ni d'astrophotographie de précision.","Non è uno strumento di navigazione né di astrofotografia di precisione.","No es una herramienta de navegación ni de astrofotografía de precisión.","Não é um instrumento de navegação nem de astrofotografia de precisão.","Nem navigációs eszköz, és nem használható precíziós asztrofotózásra.","Es ist kein Navigationsinstrument und nicht für Präzisions-Astrofotografie gedacht."],"ab.l2":["Precizia efemeridelor este cea din documentația bibliotecii (VSOP87D, ELP, nutație IAU 1980): ordinul secundelor de arc; momentele evenimentelor au erori de ordinul secundelor până la minute.","Ephemeris accuracy is that of the library documentation (VSOP87D, ELP, IAU 1980 nutation): arcseconds; event times are good to seconds or minutes.","La précision des éphémérides est celle de la documentation de la bibliothèque (VSOP87D, ELP, nutation IAU 1980) : secondes d'arc ; les instants des événements sont fiables à quelques secondes ou minutes près.","La precisione delle effemeridi è quella della documentazione della libreria (VSOP87D, ELP, nutazione IAU 1980): secondi d'arco; gli istanti degli eventi sono affidabili a secondi o minuti.","La precisión de las efemérides es la de la documentación de la biblioteca (VSOP87D, ELP, nutación IAU 1980): segundos de arco; los instantes de los eventos son fiables a segundos o minutos.","A precisão das efemérides é a da documentação da biblioteca (VSOP87D, ELP, nutação IAU 1980): segundos de arco; os instantes dos eventos são fiáveis a segundos ou minutos.","Az efemeris pontossága a függvénykönyvtár dokumentációjában megadott (VSOP87D, ELP, IAU 1980 nutáció): ívmásodpercek; az események időpontja másodperces–perces pontosságú.","Die Genauigkeit der Ephemeriden entspricht der Bibliotheksdokumentation (VSOP87D, ELP, IAU-1980-Nutation): Bogensekunden; Ereigniszeiten sind auf Sekunden bis Minuten genau."],"ab.l3":["Nu sunt afișate stele mai slabe de magnitudinea 5,0 și nu există obiecte NGC/Messier: catalogul are doar 1627 de stele.","No stars fainter than magnitude 5.0 are shown and there are no NGC/Messier objects: the catalogue has only 1627 stars.","Aucune étoile plus faible que la magnitude 5,0 n'est affichée et il n'y a pas d'objets NGC/Messier : le catalogue ne contient que 1627 étoiles.","Non sono mostrate stelle più deboli della magnitudine 5,0 e non ci sono oggetti NGC/Messier: il catalogo contiene solo 1627 stelle.","No se muestran estrellas más débiles que la magnitud 5,0 y no hay objetos NGC/Messier: el catálogo tiene solo 1627 estrellas.","Não se mostram estrelas mais fracas que a magnitude 5,0 nem objetos NGC/Messier: o catálogo tem apenas 1627 estrelas.","Az 5,0 magnitúdónál halványabb csillagokat nem jelenít meg, NGC/Messier objektumok nincsenek: a katalógus csak 1627 csillagot tartalmaz.","Sterne schwächer als 5,0 mag werden nicht gezeigt und es gibt keine NGC/Messier-Objekte: Der Katalog enthält nur 1627 Sterne."],"ab.l4":["Calea Lactee este stilizată (un model din matricea galactică, nu o fotografie) și servește doar la orientare.","The Milky Way is stylised (a model built from the galactic matrix, not a photograph) and serves only for orientation.","La Voie lactée est stylisée (un modèle issu de la matrice galactique, pas une photographie) et ne sert qu'à l'orientation.","La Via Lattea è stilizzata (un modello dalla matrice galattica, non una fotografia) e serve solo per l'orientamento.","La Vía Láctea es estilizada (un modelo a partir de la matriz galáctica, no una fotografía) y sirve solo de orientación.","A Via Láctea é estilizada (um modelo a partir da matriz galáctica, não uma fotografia) e serve apenas de orientação.","A Tejút stilizált (a galaktikus mátrixból készült modell, nem fénykép), csak tájékozódásra szolgál.","Die Milchstraße ist stilisiert (ein Modell aus der galaktischen Matrix, kein Foto) und dient nur der Orientierung."],"ab.l5":["Cerul colorat al amurgului, strălucirea și magnitudinea limită sunt aproximări vizuale, nu un model fotometric.","The twilight sky colour, glow and limiting magnitude are visual approximations, not a photometric model.","La couleur du ciel crépusculaire, la lueur et la magnitude limite sont des approximations visuelles, pas un modèle photométrique.","Il colore del cielo crepuscolare, il bagliore e la magnitudine limite sono approssimazioni visive, non un modello fotometrico.","El color del cielo crepuscular, el resplandor y la magnitud límite son aproximaciones visuales, no un modelo fotométrico.","A cor do céu crepuscular, o brilho e a magnitude limite são aproximações visuais, não um modelo fotométrico.","A szürkületi égszín, a derengés és a határmagnitúdó vizuális közelítés, nem fotometriai modell.","Die Dämmerungsfarbe, das Leuchten und die Grenzhelligkeit sind visuelle Näherungen, kein photometrisches Modell."],"ab.l6":["Orașele din listă au coordonate rotunjite (aprox. 0,01°); pentru precizie introdu coordonatele tale. Fusul orar vine din Intl, deci din baza de date a browserului.","City coordinates are rounded (about 0.01°); enter your own for precision. The time zone comes from Intl, i.e. from the browser's database.","Les coordonnées des villes sont arrondies (env. 0,01°) ; saisissez les vôtres pour plus de précision. Le fuseau vient d'Intl, donc de la base du navigateur.","Le coordinate delle città sono arrotondate (circa 0,01°); inserisci le tue per maggiore precisione. Il fuso orario viene da Intl, cioè dal database del browser.","Las coordenadas de las ciudades están redondeadas (aprox. 0,01°); introduce las tuyas para más precisión. La zona horaria viene de Intl, es decir, de la base del navegador.","As coordenadas das cidades estão arredondadas (cerca de 0,01°); introduza as suas para maior precisão. O fuso horário vem do Intl, ou seja, da base do navegador.","A városok koordinátái kerekítettek (kb. 0,01°); a pontossághoz add meg a sajátodat. Az időzóna az Intl-ből, azaz a böngésző adatbázisából jön.","Städtekoordinaten sind gerundet (ca. 0,01°); für Genauigkeit eigene Koordinaten eingeben. Die Zeitzone stammt aus Intl, also aus der Datenbank des Browsers."],"ab.l7":["Datele eclipsei din 2 august 2027 sunt calculate local, nu sunt oficiale; pentru planificare folosește surse oficiale. Eclipsa nu se privește fără filtre certificate ISO 12312-2.","The 2 August 2027 eclipse data are computed locally, not official; use official sources for planning. Never look at an eclipse without ISO 12312-2 certified filters.","Les données de l'éclipse du 2 août 2027 sont calculées localement, non officielles ; utilisez des sources officielles pour planifier. Ne regardez jamais une éclipse sans filtres certifiés ISO 12312-2.","I dati dell'eclissi del 2 agosto 2027 sono calcolati localmente, non ufficiali; per pianificare usa fonti ufficiali. Non guardare mai un'eclissi senza filtri certificati ISO 12312-2.","Los datos del eclipse del 2 de agosto de 2027 se calculan localmente, no son oficiales; usa fuentes oficiales para planificar. Nunca mires un eclipse sin filtros certificados ISO 12312-2.","Os dados do eclipse de 2 de agosto de 2027 são calculados localmente, não são oficiais; use fontes oficiais para planear. Nunca olhe para um eclipse sem filtros certificados ISO 12312-2.","A 2027. augusztus 2-i fogyatkozás adatai helyben számítottak, nem hivatalosak; tervezéshez hivatalos forrást használj. Fogyatkozást soha ne nézz ISO 12312-2 tanúsítványú szűrő nélkül.","Die Daten der Finsternis vom 2. August 2027 sind lokal berechnet, nicht offiziell; zur Planung offizielle Quellen nutzen. Eine Finsternis nie ohne ISO-12312-2-zertifizierte Filter beobachten."],"ab.acc.t":["Accesibilitate","Accessibility","Accessibilité","Accessibilità","Accesibilidad","Acessibilidade","Hozzáférhetőség","Barrierefreiheit"],"ab.acc":["Fila „Cerul în cuvinte” descrie cerul în text, cu obiectele ordonate după altitudine. Cerul poate fi controlat de la tastatură (săgeți, +/−, 0–8, F, G, C, Enter, Esc). Modul roșu protejează vederea de noapte, iar animațiile respectă preferința „reduce mișcarea”.","The “Sky in words” tab describes the sky in text, with objects sorted by altitude. The sky can be controlled from the keyboard (arrows, +/−, 0–8, F, G, C, Enter, Esc). Red mode protects night vision, and animations respect the “reduce motion” preference.","L'onglet « Le ciel en mots » décrit le ciel en texte, objets triés par hauteur. Le ciel se commande au clavier (flèches, +/−, 0–8, F, G, C, Entrée, Échap). Le mode rouge protège la vision nocturne et les animations respectent la préférence « réduire les animations ».","La scheda «Il cielo a parole» descrive il cielo in testo, con gli oggetti ordinati per altezza. Il cielo si controlla da tastiera (frecce, +/−, 0–8, F, G, C, Invio, Esc). La modalità rossa protegge la visione notturna e le animazioni rispettano la preferenza «riduci movimento».","La pestaña «El cielo en palabras» describe el cielo en texto, con objetos ordenados por altura. El cielo se controla con el teclado (flechas, +/−, 0–8, F, G, C, Intro, Esc). El modo rojo protege la visión nocturna y las animaciones respetan la preferencia «reducir movimiento».","O separador «O céu em palavras» descreve o céu em texto, com objetos ordenados por altura. O céu controla-se pelo teclado (setas, +/−, 0–8, F, G, C, Enter, Esc). O modo vermelho protege a visão noturna e as animações respeitam a preferência «reduzir movimento».","Az „Az égbolt szavakban” fül szöveggel írja le az eget, az objektumok magasság szerint rendezve. Az ég billentyűzettel vezérelhető (nyilak, +/−, 0–8, F, G, C, Enter, Esc). A vörös mód védi az éjszakai látást, az animációk pedig tiszteletben tartják a „mozgás csökkentése” beállítást.","Der Reiter „Himmel in Worten“ beschreibt den Himmel als Text, Objekte nach Höhe sortiert. Der Himmel ist per Tastatur steuerbar (Pfeile, +/−, 0–8, F, G, C, Eingabe, Esc). Der Rotmodus schont das Nachtsehen, Animationen beachten die Einstellung „Bewegung reduzieren“."],"ab.priv.t":["Confidențialitate","Privacy","Confidentialité","Privacy","Privacidad","Privacidade","Adatvédelem","Datenschutz"],"ab.priv":["Totul rămâne în browser. Locul, setările și locurile salvate se păstrează local (localStorage). Poziția GPS este cerută doar când apeși butonul dedicat, este folosită o singură dată și nu este trimisă nicăieri.","Everything stays in the browser. Place, settings and saved places are kept locally (localStorage). The GPS position is requested only when you press the dedicated button, used once and never sent anywhere.","Tout reste dans le navigateur. Le lieu, les réglages et les lieux enregistrés sont conservés localement (localStorage). La position GPS n'est demandée que sur appui du bouton dédié, utilisée une fois et jamais envoyée.","Tutto resta nel browser. Luogo, impostazioni e luoghi salvati sono conservati localmente (localStorage). La posizione GPS è richiesta solo premendo il pulsante dedicato, usata una volta e mai inviata.","Todo queda en el navegador. El lugar, los ajustes y los lugares guardados se conservan localmente (localStorage). La posición GPS solo se pide al pulsar el botón dedicado, se usa una vez y no se envía a ninguna parte.","Tudo fica no navegador. O local, as definições e os locais guardados mantêm-se localmente (localStorage). A posição GPS só é pedida ao premir o botão dedicado, é usada uma vez e nunca é enviada.","Minden a böngészőben marad. A hely, a beállítások és a mentett helyek helyben tárolódnak (localStorage). A GPS-pozíciót csak a külön gomb megnyomására kéri, egyszer használja, és sehová nem küldi.","Alles bleibt im Browser. Ort, Einstellungen und gespeicherte Orte werden lokal gespeichert (localStorage). Die GPS-Position wird nur beim Druck auf die dafür vorgesehene Schaltfläche abgefragt, einmal verwendet und nirgends gesendet."],"ab.third.t":["Componente terțe","Third-party components","Composants tiers","Componenti di terze parti","Componentes de terceros","Componentes de terceiros","Harmadik féltől származó elemek","Komponenten Dritter"],"ab.third":["Efemeridele provin din modulele ephem.js și ephem-stars.js (VSOP87D, ELP/MPP02, nutație IAU 1980; formule Meeus). Catalogul de stele derivă din Hipparcos (ESA, domeniu public) prin d3-celestial (BSD-3-Clause) și hipparcos-catalog (MIT); biblioteca astronomia (MIT) a servit la formule. Licențe complete: README.","Ephemerides come from the ephem.js and ephem-stars.js modules (VSOP87D, ELP/MPP02, IAU 1980 nutation; Meeus formulae). The star catalogue derives from Hipparcos (ESA, public domain) via d3-celestial (BSD-3-Clause) and hipparcos-catalog (MIT); the astronomia library (MIT) supplied formulae. Full licences: README.","Les éphémérides proviennent des modules ephem.js et ephem-stars.js (VSOP87D, ELP/MPP02, nutation IAU 1980 ; formules de Meeus). Le catalogue d'étoiles dérive de Hipparcos (ESA, domaine public) via d3-celestial (BSD-3-Clause) et hipparcos-catalog (MIT) ; la bibliothèque astronomia (MIT) a fourni des formules. Licences complètes : README.","Le effemeridi provengono dai moduli ephem.js ed ephem-stars.js (VSOP87D, ELP/MPP02, nutazione IAU 1980; formule di Meeus). Il catalogo stellare deriva da Hipparcos (ESA, pubblico dominio) tramite d3-celestial (BSD-3-Clause) e hipparcos-catalog (MIT); la libreria astronomia (MIT) ha fornito formule. Licenze complete: README.","Las efemérides provienen de los módulos ephem.js y ephem-stars.js (VSOP87D, ELP/MPP02, nutación IAU 1980; fórmulas de Meeus). El catálogo de estrellas deriva de Hipparcos (ESA, dominio público) a través de d3-celestial (BSD-3-Clause) y hipparcos-catalog (MIT); la biblioteca astronomia (MIT) aportó fórmulas. Licencias completas: README.","As efemérides vêm dos módulos ephem.js e ephem-stars.js (VSOP87D, ELP/MPP02, nutação IAU 1980; fórmulas de Meeus). O catálogo de estrelas deriva do Hipparcos (ESA, domínio público) via d3-celestial (BSD-3-Clause) e hipparcos-catalog (MIT); a biblioteca astronomia (MIT) forneceu fórmulas. Licenças completas: README.","Az efemeridák az ephem.js és ephem-stars.js modulokból származnak (VSOP87D, ELP/MPP02, IAU 1980 nutáció; Meeus-képletek). A csillagkatalógus a Hipparcosból (ESA, közkincs) ered a d3-celestial (BSD-3-Clause) és a hipparcos-catalog (MIT) révén; az astronomia könyvtár (MIT) képleteket adott. Teljes licencek: README.","Die Ephemeriden stammen aus den Modulen ephem.js und ephem-stars.js (VSOP87D, ELP/MPP02, IAU-1980-Nutation; Meeus-Formeln). Der Sternkatalog stammt von Hipparcos (ESA, gemeinfrei) über d3-celestial (BSD-3-Clause) und hipparcos-catalog (MIT); die Bibliothek astronomia (MIT) lieferte Formeln. Volle Lizenzen: README."],"ab.tr.t":["Traduceri","Translations","Traductions","Traduzioni","Traducciones","Traduções","Fordítások","Übersetzungen"],"ab.tr":["Interfața este disponibilă în 8 limbi (română, engleză, franceză, italiană, spaniolă, portugheză, maghiară, germană). Numele constelațiilor sunt date în română și engleză; numele stelelor și al obiectelor rămân în forma tradițională.","The interface is available in 8 languages (Romanian, English, French, Italian, Spanish, Portuguese, Hungarian, German). Constellation names are given in Romanian and English; star and object names keep their traditional form.","L'interface est disponible en 8 langues (roumain, anglais, français, italien, espagnol, portugais, hongrois, allemand). Les noms de constellations sont donnés en roumain et en anglais ; les noms d'étoiles et d'objets gardent leur forme traditionnelle.","L'interfaccia è disponibile in 8 lingue (rumeno, inglese, francese, italiano, spagnolo, portoghese, ungherese, tedesco). I nomi delle costellazioni sono in rumeno e inglese; i nomi di stelle e oggetti mantengono la forma tradizionale.","La interfaz está disponible en 8 idiomas (rumano, inglés, francés, italiano, español, portugués, húngaro, alemán). Los nombres de las constelaciones se dan en rumano e inglés; los de estrellas y objetos conservan su forma tradicional.","A interface está disponível em 8 idiomas (romeno, inglês, francês, italiano, espanhol, português, húngaro, alemão). Os nomes das constelações são dados em romeno e inglês; os de estrelas e objetos mantêm a forma tradicional.","A felület 8 nyelven érhető el (román, angol, francia, olasz, spanyol, portugál, magyar, német). A csillagképek nevei románul és angolul szerepelnek; a csillagok és objektumok neve a hagyományos alakban marad.","Die Oberfläche gibt es in 8 Sprachen (Rumänisch, Englisch, Französisch, Italienisch, Spanisch, Portugiesisch, Ungarisch, Deutsch). Sternbildnamen werden auf Rumänisch und Englisch angegeben; Stern- und Objektnamen behalten ihre traditionelle Form."],"ab.keys.t":["Comenzi de la tastatură","Keyboard controls","Commandes au clavier","Comandi da tastiera","Controles de teclado","Comandos de teclado","Billentyűparancsok","Tastatursteuerung"],"hp.k1":["Săgețile mută privirea (în modul „tot cerul”: stânga/dreapta rotesc, sus/jos măresc sau micșorează).","Arrow keys move the view (in “whole sky” mode: left/right rotate, up/down zoom).","Les flèches déplacent la vue (en mode « tout le ciel » : gauche/droite tournent, haut/bas zooment).","Le frecce spostano la vista (in modalità «tutto il cielo»: sinistra/destra ruotano, su/giù zoom).","Las flechas mueven la vista (en modo «todo el cielo»: izquierda/derecha giran, arriba/abajo hacen zoom).","As setas movem a vista (no modo «todo o céu»: esquerda/direita rodam, cima/baixo fazem zoom).","A nyilak mozgatják a nézetet („teljes ég” módban: balra/jobbra forgat, fel/le nagyít vagy kicsinyít).","Pfeiltasten bewegen die Ansicht (im Modus „ganzer Himmel“: links/rechts drehen, oben/unten zoomen)."],"hp.k2":["+ și − măresc / micșorează; Home readuce vederea.","+ and − zoom in / out; Home resets the view.","+ et − zooment ; Origine réinitialise la vue.","+ e − ingrandiscono / riducono; Home ripristina la vista.","+ y − acercan / alejan; Inicio restablece la vista.","+ e − aumentam / reduzem; Home repõe a vista.","A + és − nagyít / kicsinyít; a Home visszaállítja a nézetet.","+ und − zoomen; Pos1 setzt die Ansicht zurück."],"hp.k3":["Spațiu pornește sau oprește animația; N = acum; virgulă și punct = pas înapoi / înainte.","Space starts or stops the animation; N = now; comma and period = step back / forward.","Espace lance ou arrête l'animation ; N = maintenant ; virgule et point = pas arrière / avant.","Spazio avvia o ferma l'animazione; N = adesso; virgola e punto = passo indietro / avanti.","Espacio inicia o detiene la animación; N = ahora; coma y punto = paso atrás / adelante.","Espaço inicia ou pára a animação; N = agora; vírgula e ponto = passo atrás / à frente.","A szóköz indítja vagy megállítja az animációt; N = most; vessző és pont = lépés vissza / előre.","Leertaste startet oder stoppt die Animation; N = jetzt; Komma und Punkt = Schritt zurück / vor."],"hp.k4":["F = tot cerul, G = grila alt-az, C = liniile constelațiilor.","F = whole sky, G = alt-az grid, C = constellation lines.","F = tout le ciel, G = grille alt-az, C = lignes des constellations.","F = tutto il cielo, G = griglia alt-az, C = linee delle costellazioni.","F = todo el cielo, G = rejilla alt-az, C = líneas de constelaciones.","F = todo o céu, G = grelha alt-az, C = linhas das constelações.","F = teljes ég, G = magassági-azimutális rács, C = csillagképvonalak.","F = ganzer Himmel, G = Höhen-Azimut-Gitter, C = Sternbildlinien."],"hp.k5":["Cifrele 0–8 aleg Soarele (0), Luna (1) și planetele (2–8, de la Mercur la Neptun).","Digits 0–8 select the Sun (0), the Moon (1) and the planets (2–8, Mercury to Neptune).","Les chiffres 0–8 sélectionnent le Soleil (0), la Lune (1) et les planètes (2–8, de Mercure à Neptune).","Le cifre 0–8 selezionano il Sole (0), la Luna (1) e i pianeti (2–8, da Mercurio a Nettuno).","Los dígitos 0–8 seleccionan el Sol (0), la Luna (1) y los planetas (2–8, de Mercurio a Neptuno).","Os dígitos 0–8 selecionam o Sol (0), a Lua (1) e os planetas (2–8, de Mercúrio a Neptuno).","A 0–8 számjegyek a Napot (0), a Holdat (1) és a bolygókat (2–8, Merkúrtól Neptunuszig) választják ki.","Die Ziffern 0–8 wählen Sonne (0), Mond (1) und Planeten (2–8, Merkur bis Neptun)."],"hp.k6":["Enter centrează obiectul ales; Esc anulează selecția.","Enter centres the selected object; Esc clears the selection.","Entrée centre l'objet choisi ; Échap annule la sélection.","Invio centra l'oggetto scelto; Esc annulla la selezione.","Intro centra el objeto elegido; Esc anula la selección.","Enter centra o objeto escolhido; Esc anula a seleção.","Az Enter középre helyezi a kiválasztott objektumot; az Esc törli a kijelölést.","Eingabe zentriert das gewählte Objekt; Esc hebt die Auswahl auf."],"hp.k7":["Tab și Shift+Tab trec între comenzi; săgețile schimbă filele când o filă are focusul.","Tab and Shift+Tab move between controls; arrow keys switch tabs when a tab has focus.","Tab et Maj+Tab passent d'une commande à l'autre ; les flèches changent d'onglet quand un onglet a le focus.","Tab e Maiusc+Tab passano da un controllo all'altro; le frecce cambiano scheda quando una scheda ha il focus.","Tab y Mayús+Tab pasan entre controles; las flechas cambian de pestaña cuando una pestaña tiene el foco.","Tab e Shift+Tab alternam entre controlos; as setas mudam de separador quando um separador tem o foco.","A Tab és a Shift+Tab vezérlők között lép; a nyilak fület váltanak, ha egy fülön van a fókusz.","Tab und Umschalt+Tab wechseln zwischen Bedienelementen; Pfeiltasten wechseln den Reiter, wenn ein Reiter den Fokus hat."],"ephem.body.sun":["Soare","Sun","Soleil","Sole","Sol","Sol","Nap","Sonne"],"ephem.body.moon":["Luna","Moon","Lune","Luna","Luna","Lua","Hold","Mond"],"ephem.body.mercury":["Mercur","Mercury","Mercure","Mercurio","Mercurio","Mercúrio","Merkúr","Merkur"],"ephem.body.venus":["Venus","Venus","Vénus","Venere","Venus","Vénus","Vénusz","Venus"],"ephem.body.mars": (function(){

/* galactic: matrice ecuatorial J2000 → galactic (polul galactic nord: RA 192,85948°, Dec 27,12825°; l(NCP)=122,93192°) */
const GAL=(function(){
  const a=192.85948*D2R,d=27.12825*D2R, th=122.93192*D2R;
  const ng=[Math.cos(d)*Math.cos(a),Math.cos(d)*Math.sin(a),Math.sin(d)];
  const ncp=[0,0,1];
  // x_gal (l=0,b=0) rotit față de direcția către NCP cu θ=l_NCP
  const dotn=ncp[2]; let p=[ncp[0]-dotn*ng[0],ncp[1]-dotn*ng[1],ncp[2]-dotn*ng[2]]; const pn=Math.hypot(p[0],p[1],p[2]); p=p.map(v=>v/pn); // componenta NCP ⟂ ng, direcția l=l_NCP
  const q=[ng[1]*p[2]-ng[2]*p[1],ng[2]*p[0]-ng[0]*p[2],ng[0]*p[1]-ng[1]*p[0]]; // ng × p
  // p = cos(l_NCP)·x + sin(l_NCP)·y  ;  q = ng × p = -sin(l)·x + cos(l)·y  (în planul galactic, y = ng × x)
  const c=Math.cos(th), s=Math.sin(th);
  const x=[c*p[0]-s*q[0],c*p[1]-s*q[1],c*p[2]-s*q[2]];
  const y=[ng[1]*x[2]-ng[2]*x[1],ng[2]*x[0]-ng[0]*x[2],ng[0]*x[1]-ng[1]*x[0]];
  return [x,y,ng];
})();

const SKYK=[[20,[58,120,205],[150,190,235],0],[6,[64,118,196],[170,200,230],.1],[0,[40,80,150],[236,176,120],.55],[-3,[28,52,104],[200,120,96],.5],[-6,[16,30,66],[110,80,100],.35],[-9,[9,18,42],[52,48,76],.18],[-12,[5,10,26],[22,28,50],.08],[-18,[1,3,10],[7,10,22],0]];
function skyColors(h){
  const K_=SKYK; if(h>=K_[0][0]) return {z:K_[0][1],h:K_[0][2],g:K_[0][3]}; if(h<=K_[K_.length-1][0]) { const k=K_[K_.length-1]; return {z:k[1],h:k[2],g:k[3]}; }
  for(let i=0;i<K_.length-1;i++){ const a=K_[i],b=K_[i+1]; if(h<=a[0]&&h>=b[0]){ const f=(a[0]-h)/(a[0]-b[0]); const mx=(p,q)=>[p[0]+(q[0]-p[0])*f,p[1]+(q[1]-p[1])*f,p[2]+(q[2]-p[2])*f]; return {z:mx(a[1],b[1]),h:mx(a[2],b[2]),g:a[3]+(b[3]-a[3])*f}; } }

const off=document.createElement('canvas'); let offCtx=off.getContext('2d'); let offImg=null;
let bgCell=6;
function drawBackground(){
  const o=S.opts, red=isRed();
  if(!o.atmo&&!o.mw){ ctx.fillStyle=red?'#050000':'#000'; ctx.fillRect(0,0,W,H); return; }
  const cell=bgCell, w=Math.ceil(W/cell), h=Math.ceil(H/cell);
  if(off.width!==w||off.height!==h){ off.width=w; off.height=h; offImg=offCtx.createImageData(w,h); }
  const d=offImg.data, sc=o.atmo?skyColors(FR.sunAlt):{z:[0,0,0],h:[0,0,0],g:0};
  const sv=FR.sunVec, night=o.atmo?clamp((-FR.sunAlt-8)/10,0,1):1, A=FR.A, G=GAL, doMw=o.mw&&night>0;
  const glowAmp=o.atmo?sc.g:0;
  for(let j=0;j<h;j++){
    for(let i=0;i<w;i++){
      const v=unproject((i+0.5)*cell,(j+0.5)*cell); const idx=(j*w+i)*4;
      if(!v){ d[idx]=d[idx+1]=d[idx+2]=0; d[idx+3]=255; continue; }
      const e=v[0],n=v[1],u=v[2];
      const af=clamp(u,0,1); const f=1-Math.pow(af,0.6);   // 0 la zenit, 1 la orizont
      let r=sc.z[0]+(sc.h[0]-sc.z[0])*f, g=sc.z[1]+(sc.h[1]-sc.z[1])*f, b=sc.z[2]+(sc.h[2]-sc.z[2])*f;
      if(glowAmp>0.001){ const c=e*sv[0]+n*sv[1]+u*sv[2]; const gl=Math.exp(-(1-c)*7)*glowAmp*(0.35+0.65*f); r+=255*0.95*gl; g+=150*gl; b+=80*gl; }
      if(doMw){
        // vector ecuatorial al datei (≈ J2000 pentru bandă stilizată) = Aᵀ·ENU
        const x=A[0]*e+A[3]*n+A[6]*u, y=A[1]*e+A[4]*n+A[7]*u, z=A[2]*e+A[5]*n+A[8]*u;
        const gx=G[0][0]*x+G[0][1]*y+G[0][2]*z, gy=G[1][0]*x+G[1][1]*y+G[1][2]*z, gz=G[2][0]*x+G[2][1]*y+G[2][2]*z;
        const bl=Math.asin(clamp(gz,-1,1))*R2D, l=mod(Math.atan2(gy,gx)*R2D,360);
        const dl0=wrap180(l), dl1=wrap180(l-80), dl2=wrap180(l-285);
        const amp=0.28+0.62*Math.exp(-dl0*dl0/(2*55*55))+0.22*Math.exp(-dl1*dl1/(2*25*25))+0.2*Math.exp(-dl2*dl2/(2*30*30));
        const sg=5+3*Math.exp(-dl0*dl0/(2*40*40));
        const mw=amp*Math.exp(-bl*bl/(2*sg*sg))*0.36*night*(u>-0.05?1:0.6);
        const wm=1-0.5*Math.exp(-dl0*dl0/(2*40*40));
        r+=215*mw; g+=215*mw*(0.93+0.07*wm); b+=225*mw*wm;
      }
      if(red){ const L=Math.min(255,lum(r,g,b)*1.1); r=L;g=0;b=0; }
      d[idx]=r>255?255:r; d[idx+1]=g>255?255:g; d[idx+2]=b>255?255:b; d[idx+3]=255;
    }
  }
  offCtx.putImageData(offImg,0,0);

}

function strokeSphere(pointFn,n,close){

}

function drawGround(){

function searchObjects(q){
  const n=plain(q).trim(); if(!n) return []; const out=[];
  const add=(sc,ref,label,sub)=>out.push({sc,ref,label,sub});
  BODIES.forEach(k=>{ const names=[bodyName(k),E.label?E.label('body',k):'',k, t('ephem.body.'+k)].map(plain); const nm=names.find(x=>x&&x.includes(n)); if(nm) add(names.includes(n)?0:(names.some(x=>x.startsWith(n))?1:2),{t:'body',id:k},bodyName(k),t(k==='sun'?'kind.sun':k==='moon'?'kind.moon':'kind.planet')); });
  ST.list.forEach(s=>{ if(!s.en&&!s.ro&&!s.desig) return; const hs=[s.en,s.ro,s.desig,'hip'+s.hip,'hip '+s.hip].map(plain); const m=hs.find(x=>x&&x.includes(n)); if(m) add(hs.includes(n)?0:(hs.some(x=>x&&x.startsWith(n))?1:3),{t:'star',i:s.i},starName(s),(s.desig||'')+' · '+(s.mag<0?'−':'+')+nf(Math.abs(s.mag),1)+' mag'); });
  CONS.forEach(cn=>{ const c=cn.c; const hs=[c.ro,c.en,c.la,c.id].map(plain); const m=hs.find(x=>x&&x.includes(n)); if(m) add(hs.includes(n)?0:(hs.some(x=>x.startsWith(n))?1:2),{t:'cons',id:cn.id},consName(c,'both'),t('kind.constellation')); });
  out.sort((a,b)=>a.sc-b.sc||a.label.localeCompare(b.label,lang)); return out.slice(0,16);
}

/* ---- interacțiune: pointer, tastatură ---- */
const ptrs=new Map(); let drag=null, pinch=null;
canvas.addEventListener('pointerdown',e=>{
  canvas.focus({preventScroll:true}); try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  const r=canvas.getBoundingClientRect(); ptrs.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});
  if(ptrs.size===1){ const p=ptrs.get(e.pointerId); drag={x0:p.x,y0:p.y,lx:p.x,ly:p.y,moved:false,t0:performance.now()}; }
  else if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d0:Math.hypot(a.x-b.x,a.y-b.y),f0:S.opts.full?V.fullFov:V.fov}; drag=null; }
});
canvas.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return; const r=canvas.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top; ptrs.set(e.pointerId,{x,y});
  if(pinch&&ptrs.size>=2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(pinch.d0>5){ const f=clamp(pinch.f0*pinch.d0/Math.max(d,5),S.opts.full?40:3,S.opts.full?200:160); if(S.opts.full) V.fullFov=f; else V.fov=f; requestRender(); } return; }
  if(drag){
    const dx=x-drag.lx, dy=y-drag.ly; if(!drag.moved&&Math.hypot(x-drag.x0,y-drag.y0)>4) drag.moved=true;
    if(drag.moved){
      anim=null;
      if(S.opts.full){ const cx=P.cx,cy=P.cy; const a1=Math.atan2(drag.ly-cy,drag.lx-cx), a2=Math.atan2(y-cy,x-cx); V.A=mod(V.A+wrap180((a2-a1)*R2D),360); }
      else { const sc=P.scale; V.A=mod(V.A-dx/sc*R2D/Math.max(Math.cos(V.a*D2R),0.25),360); V.a=clamp(V.a+dy/sc*R2D,-30,90); }
      S.follow=false; requestRender();
    }
    drag.lx=x; drag.ly=y;
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
  if(drag&&!drag.moved&&e.type==='pointerup'){ const r=canvas.getBoundingClientRect(); const pk=pickAt(e.clientX-r.left,e.clientY-r.top); if(pk) selectObj(pk,false); else if(S.sel&&!pinch) selectObj(null); }
  if(ptrs.size<2) pinch=null; if(ptrs.size===0){ drag=null; saveSettings(); }
}
canvas.addEventListener('pointerup',endPtr); canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{ e.preventDefault(); zoomBy(Math.exp(clamp(e.deltaY,-300,300)*0.0012)); },{passive:false});
canvas.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return; const k=e.key; let used=true;
  const stepA=Math.max(2,(S.opts.full?V.fullFov/16:V.fov/10));
  if(k==='ArrowLeft'){ if(S.opts.full) V.A=mod(V.A-stepA,360); else V.A=mod(V.A-stepA/Math.max(Math.cos(V.a*D2R),0.3),360); S.follow=false; }
  else if(k==='ArrowRight'){ if(S.opts.full) V.A=mod(V.A+stepA,360); else V.A=mod(V.A+stepA/Math.max(Math.cos(V.a*D2R),0.3),360); S.follow=false; }
  else if(k==='ArrowUp'){ if(S.opts.full) zoomBy(1/1.15); else V.a=clamp(V.a+stepA,-30,90); S.follow=false; }
  else if(k==='ArrowDown'){ if(S.opts.full) zoomBy(1.15); else V.a=clamp(V.a-stepA,-30,90); S.follow=false; }
  else if(k==='+'||k==='='){ zoomBy(1/1.25); }
  else if(k==='-'||k==='_'){ zoomBy(1.25); }
  else if(k==='Home'){ resetView(); }
  else if(k===' '){ togglePlay(); }
  else if(k==='n'||k==='N'){ S.live=true; setTime(now(),true); }
  else if(k===','||k==='<'){ stepTime(-1); }
  else if(k==='.'||k==='>'){ stepTime(1); }
  else if(k==='f'||k==='F'){ setOpt('full',!S.opts.full); }
  else if(k==='g'||k==='G'){ setOpt('gridAA',!S.opts.gridAA); }
  else if(k==='c'||k==='C'){ setOpt('constLines',!S.opts.constLines); }
  else if(k==='Escape'){ selectObj(null); }
  else if(k==='Enter'){ if(S.sel) centerOnSel(true); }
  else if(KEY_OBJ[k]){ selectObj({t:'body',id:KEY_OBJ[k]},true); }
  else used=false;
  if(used){ e.preventDefault(); saveSettings(); requestRender(); }
});

/* ===== Bolta — evenimente apropiate (calcul + listă + .ics) ===== */
const EV_PLANETS=['mercury','venus','mars','jupiter','saturn','uranus','neptune'];
const evYield=()=>new Promise(r=>setTimeout(r,0));
function vecRaDec(raDeg,decDeg){ return eqVec(raDeg,decDeg); }
function angSep(a,b){ const c=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; if(c>0.9999){ const dx=a[0]-b[0],dy=a[1]-b[1],dz=a[2]-b[2]; return 2*Math.asin(Math.min(1,Math.hypot(dx,dy,dz)/2))*R2D; } return Math.acos(clamp(c,-1,1))*R2D; }
function moonVec(jd){ const m=E.moon(jd); return vecRaDec(m.ra,m.dec); }
function planetVec(k,jd){ const p=E.planet(k,jd); return vecRaDec(p.ra,p.dec); }
function minimize(f,a,b,iters){ // căutare ternară pe [a,b] pentru minimul unei funcții unimodale
  for(let i=0;i<(iters||36);i++){ const m1=a+(b-a)/3,m2=b-(b-a)/3; if(f(m1)<f(m2)) b=m2; else a=m1; } return (a+b)/2;
}
function bisectRoot(f,a,b,tol){ let fa=f(a); for(let i=0;i<60&&(b-a)>tol;i++){ const m=(a+b)/2,fm=f(m); if((fm>0)===(fa>0)){ a=m; fa=fm; } else b=m; } return (a+b)/2; }
function cubicVec(p0,p1,p2,p3,u){ // Catmull-Rom pe vectori
  const o=[0,0,0]; for(let i=0;i<3;i++){ const a=-0.5*p0[i]+1.5*p1[i]-1.5*p2[i]+0.5*p3[i], b=p0[i]-2.5*p1[i]+2*p2[i]-0.5*p3[i], c=-0.5*p0[i]+0.5*p2[i], d=p1[i]; o[i]=((a*u+b)*u+c)*u+d; }
  const n=Math.hypot(o[0],o[1],o[2]); return [o[0]/n,o[1]/n,o[2]/n];
}
function eclipseCandidate(kind,jd){ const m=E.moon(jd); return Math.abs(m.lat); }
const ECL_BETA_LIMIT=1.58;   // |β| (°) la lună nouă/plină sub care e posibilă o eclipsă (aproximație; tipul nu e calculat)

async function scanEvents(jd0,jd1,cfg,progress){
  const out=[]; const days=Math.ceil(jd1-jd0); let step=0; const total=1+(cfg.moonp?3:0)+(cfg.pp?1:0)+(cfg.opp?1:0)+(cfg.season?1:0);
  const adv=async(label)=>{ step++; if(progress) progress(Math.min(99,Math.round(step/total*100)),label); await evYield(); };
  // faze + eclipse posibile
  if(cfg.phase||cfg.ecl){
    const ph=E.moonPhases(jd0,jd1);
    ph.forEach(p=>{
      if(cfg.phase) out.push({jd:p.jd,cat:'phase',key:'phase',kind:p.kind});
      if((p.kind==='new'||p.kind==='full')&&cfg.ecl){ const b=eclipseCandidate(p.kind,p.jd); if(b<ECL_BETA_LIMIT) out.push({jd:p.jd,cat:'ecl',key:p.kind==='new'?'eclSolarCand':'eclLunarCand',beta:E.moon(p.jd).lat}); }
    });
  }
  if(cfg.ecl){ const g=E.eclipse.greatest(); if(g.jd>=jd0-1&&g.jd<=jd1+1) { for(let i=out.length-1;i>=0;i--) if(out[i].key==='eclSolarCand'&&Math.abs(out[i].jd-g.jd)<1.5) out.splice(i,1); out.push({jd:g.jd,cat:'ecl',key:'ecl2027',own:true}); } }
  await adv();
  // anotimpuri
  if(cfg.season){
    const y0=E.calendarFromJd(jd0).y-1, y1=E.calendarFromJd(jd1).y+1;
    for(let y=y0;y<=y1;y++){ for(let q=0;q<4;q++){ const mo=[3,6,9,12][q], dd=[20,21,22,21][q]; const g=E.jdFromCalendar(y,mo,dd,12); const f=jd=>wrap180(E.sun(jd).lon-90*q); const jd=bisectRoot(f,g-3,g+3,1/86400); if(jd>=jd0&&jd<=jd1) out.push({jd,cat:'season',key:'season',q}); } }
    await adv();
  }
  // Lună–planetă
  if(cfg.moonp){
    const thr=cfg.thrMP, N=Math.ceil((jd1-jd0)*6)+4, dt=1/6, t0=jd0-dt;
    const mv=[]; for(let i=0;i<N;i++){ mv.push(moonVec(t0+i*dt)); if(i%400===399) await evYield(); }
    await adv();
    // planete: zilnic
    const nd=Math.ceil(jd1-jd0)+4, pv={}; EV_PLANETS.forEach(k=>{ pv[k]=[]; for(let i=0;i<nd;i++) pv[k].push(planetVec(k,Math.floor(jd0)-1+i)); });
    const pAt=(k,jd)=>{ const x=jd-(Math.floor(jd0)-1), i=Math.floor(x), u=x-i; const a=pv[k]; const i0=clamp(i-1,0,nd-1),i1=clamp(i,0,nd-1),i2=clamp(i+1,0,nd-1),i3=clamp(i+2,0,nd-1); return cubicVec(a[i0],a[i1],a[i2],a[i3],u); };
    await adv();
    for(const k of EV_PLANETS){
      const s=new Float64Array(N); for(let i=0;i<N;i++) s[i]=angSep(mv[i],pAt(k,t0+i*dt));
      for(let i=1;i<N-1;i++){
        if(s[i]<=s[i-1]&&s[i]<s[i+1]&&s[i]<thr+2.6){
          const a=t0+(i-1)*dt, b=t0+(i+1)*dt; const f=jd=>angSep(moonVec(jd),planetVec(k,jd)); const tm=minimize(f,a,b,34); const sep=f(tm);
          if(sep<=thr&&tm>=jd0&&tm<=jd1){ const m=E.moon(tm), p=E.planet(k,tm); out.push({jd:tm,cat:'moonp',key:'moonp',p:k,sep,north:m.dec>p.dec,pelong:p.elong,pmag:p.mag,pEast:p.elongSigned>=0}); }
        }
      }
    }
    await adv();
  }
  // planetă–planetă
  if(cfg.pp){
    const thr=cfg.thrPP, nd=Math.ceil(jd1-jd0)+4, base=Math.floor(jd0)-1, pv={};
    EV_PLANETS.forEach(k=>{ pv[k]=[]; for(let i=0;i<nd;i++) pv[k].push(planetVec(k,base+i)); });
    for(let a=0;a<EV_PLANETS.length;a++) for(let b=a+1;b<EV_PLANETS.length;b++){
      const ka=EV_PLANETS[a],kb=EV_PLANETS[b]; const s=new Float64Array(nd); for(let i=0;i<nd;i++) s[i]=angSep(pv[ka][i],pv[kb][i]);
      for(let i=1;i<nd-1;i++){
        if(s[i]<=s[i-1]&&s[i]<s[i+1]&&s[i]<thr+3){
          const f=jd=>angSep(planetVec(ka,jd),planetVec(kb,jd)); const tm=minimize(f,base+i-1,base+i+1,32); const sep=f(tm);
          if(sep<=thr&&tm>=jd0&&tm<=jd1){ const pa=E.planet(ka,tm),pb=E.planet(kb,tm); out.push({jd:tm,cat:'pp',key:'pp',a:ka,b:kb,sep,ea:pa.elong,eb:pb.elong}); }
        }
      }
    }
    await adv();
  }
  // opoziții, conjuncții cu Soarele, elongații maxime
  if(cfg.opp){
    const base=Math.floor(jd0)-1, nd=Math.ceil(jd1-jd0)+3;
    const lam=(k,jd)=>E.planet(k,jd).lon, ls=jd=>E.sun(jd).lon;
    for(const k of EV_PLANETS){
      if(k==='mercury'||k==='venus'){
        const g=jd=>wrap180(lam(k,jd)-ls(jd));
        let prev=g(base);
        for(let i=1;i<nd;i++){ const cur=g(base+i); if(((prev>0)!==(cur>0))&&Math.abs(prev)<40&&Math.abs(cur)<40){ const tm=bisectRoot(g,base+i-1,base+i,1/86400); if(tm>=jd0&&tm<=jd1){ const sup=E.planet(k,tm).dist>E.sun(tm).dist; out.push({jd:tm,cat:'opp',key:sup?'supConj':'infConj',p:k}); } } prev=cur; }
        const el=jd=>E.planet(k,jd).elong; let e0=el(base),e1=el(base+1);
        for(let i=1;i<nd-1;i++){ const e2=el(base+i+1); if(e1>e0&&e1>=e2&&e1>10){ const tm=minimize(jd=>-el(jd),base+i-1,base+i+1,30); if(tm>=jd0&&tm<=jd1){ const p=E.planet(k,tm); out.push({jd:tm,cat:'opp',key:'elong',p:k,val:p.elong,east:p.elongSigned>=0}); } } e0=e1; e1=e2; }
      } else {

/* ---- .ics (RFC 5545) ---- */
function icsEscape(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(line){

  out.push(cur); return out.join('\r\n');
}
function icsStamp(ms){ const d=new Date(Math.round(ms/1000)*1000); return d.getUTCFullYear()+pad2(d.getUTCMonth()+1)+pad2(d.getUTCDate())+'T'+pad2(d.getUTCHours())+pad2(d.getUTCMinutes())+pad2(d.getUTCSeconds())+'Z'; }
function buildIcs(events,stampMs){

  const stamp=icsStamp(stampMs==null?now():stampMs); const seen=new Map();
  events.forEach(ev=>{
    const ms=msOfJd(ev.jd), st=icsStamp(ms); const base=ev.key+'-'+(ev.p||ev.a||ev.kind||ev.q||'')+'-'+(ev.b||''); const n=(seen.get(st+base)||0)+1; seen.set(st+base,n);
    const uid='bolta-'+st+'-'+base.replace(/[^A-Za-z0-9-]/g,'')+'-'+n+'@bolta.invalid';
    const desc=evDetail(ev)+'\n'+t('ics.note',{place:S.place.name});
    L.push('BEGIN:VEVENT','UID:'+uid,'DTSTAMP:'+stamp,'DTSTART:'+st,'DTEND:'+icsStamp(ms+30*60000),'SUMMARY:'+icsEscape(evTitle(ev)),'DESCRIPTION:'+icsEscape(desc),'CATEGORIES:'+icsEscape(t('ev.cat.'+({phase:'phase',moonp:'moonp',pp:'pp',opp:'opp',season:'season',ecl:'ecl'}[ev.cat]))),'TRANSP:TRANSPARENT','END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n')+'\r\n';

/* ---- simulare: discurile Lună–Soare în timp ---- */
function circleOverlapFrac(d,rs,rm){   // fracția din aria Soarelui acoperită de Lună
  if(d>=rs+rm) return 0; if(d<=Math.abs(rm-rs)) return rm>=rs?1:(rm*rm)/(rs*rs);
  const a=rs*rs*Math.acos((d*d+rs*rs-rm*rm)/(2*d*rs)), b=rm*rm*Math.acos((d*d+rm*rm-rs*rs)/(2*d*rm)), c=0.5*Math.sqrt((-d+rs+rm)*(d+rs-rm)*(d-rs+rm)*(d+rs+rm));
  return (a+b-c)/(Math.PI*rs*rs);
}
function simGeometry(jd){
  const p=S.place, so=E.observe('sun',jd,p.lat,p.lon,p.elev||0,{}), mo=E.observe('moon',jd,p.lat,p.lon,p.elev||0,{});
  const g=so.geocentric, mg=mo.geocentric, altM=mo.altGeom*D2R;
  const rs=Math.asin(696000/g.distKm)*R2D;
  const dTopo=Math.sqrt(mg.distKm*mg.distKm+6371*6371-2*mg.distKm*6371*Math.sin(altM));
  const rm=Math.asin(0.2725076*6378.137/dTopo)*R2D;
  const dalt=mo.altGeom-so.altGeom, daz=wrap180(mo.az-so.az)*Math.cos((mo.altGeom+so.altGeom)/2*D2R);
  const sep=Math.hypot(dalt,daz); return {rs,rm,dx:daz,dy:dalt,sep,obsc:circleOverlapFrac(sep,rs,rm),sunAlt:so.altGeom,az:so.az};

  savePlaces();
  if(d.settings&&typeof d.settings==='object'){ const s=d.settings; if(s.opts&&typeof s.opts==='object'){ for(const k in DEF_OPTS){ if(k in s.opts&&typeof s.opts[k]===typeof DEF_OPTS[k]) S.opts[k]=s.opts[k]; } S.opts.maglim=clamp(+S.opts.maglim||5,2,5); if(!['stereo','azeq'].includes(S.opts.proj)) S.opts.proj='stereo'; if(!['ro','en','both','ui'].includes(S.opts.cname)) S.opts.cname='both'; } if(s.place&&validPlace(s.place)) applyPlace(s.place); saveSettings(); syncOptsUI(); requestRender(); }

    list.push({ref:{t:'body',id:k},name:bodyName(k),alt:b.alt,az:b.az,mag:b.mag,kind:k}); });
  for(let i=0;i<NS;i++){ if(SMAG[i]>maxMag) continue; const a=altAzFromEnu(FR.SE[i],FR.SN[i],FR.SU[i]); const s=ST.list[i]; list.push({ref:{t:'star',i},name:s.en||s.ro?starName(s):(s.desig||('HIP '+s.hip)),alt:a.alt,az:a.az,mag:s.mag,kind:'star',desig:s.desig}); }

  parts_.push(sunAlt>0?t('wd.sunUp',{alt:nf(sun.alt,0),dir:dirName(sun.az)}):t('wd.sunDown',{alt:nf(Math.abs(sunAlt),0),cls:t('wd.cls.'+cls)}));

  parts_.push(mo.alt>0?t('wd.moonUp',{ph:t('ephem.phase.'+mp.name),ill:nf(mp.illum*100,0),alt:nf(mo.alt,0),dir:dirName(mo.az)}):t('wd.moonDown',{ph:t('ephem.phase.'+mp.name),ill:nf(mp.illum*100,0)}));
  const pl=PLANETS.filter(k=>k!=='neptune'&&FR.bodies[k]&&FR.bodies[k].alt>0).map(k=>({k,b:FR.bodies[k]}));
  if(pl.length){ pl.sort((a,b)=>b.b.alt-a.b.alt); parts_.push(t('wd.planets',{list:pl.map(x=>bodyName(x.k)+' ('+nf(x.b.alt,0)+'°, '+dirName(x.b.az)+', '+(x.b.mag<0?'−':'+')+nf(Math.abs(x.b.mag),1)+')').join('; ')})); } else parts_.push(t('wd.noPlanets'));

  if(stars.length){ stars.sort((a,b)=>a.mag-b.mag); parts_.push(t('wd.stars',{n:stars.length,list:stars.slice(0,10).map(s=>s.name+' ('+nf(s.alt,0)+'°, '+dirName(s.az)+')').join('; ')})); }

  list.slice(0,cap).forEach(o=>{ const tr=document.createElement('tr'); const th=document.createElement('th'); th.scope='row'; th.textContent=o.name+(o.desig&&o.desig!==o.name?' ('+o.desig+')':''); tr.appendChild(th);
    [nf(o.alt,1)+'°',nf(o.az,0)+'°',dirName(o.az),(o.mag<0?'−':'+')+nf(Math.abs(o.mag),1)].forEach(v=>{ const td=document.createElement('td'); td.textContent=v; tr.appendChild(td); });
    const td=document.createElement('td'); const b=document.createElement('button'); b.type='button'; b.className='btn small'; b.textContent=t('wd.show'); b.setAttribute('aria-label',t('wd.showX',{x:o.name})); b.addEventListener('click',()=>{ selectObj(o.ref,false); $('tabb-sky').click(); centerOnSel(true); $('sky').focus({preventScroll:true}); }); td.appendChild(b); tr.appendChild(td); tb.appendChild(tr); });
  if(list.length>cap){ const tr=document.createElement('tr'); const td=document.createElement('td'); td.colSpan=6; td.className='hint'; td.textContent=t('wd.more',{n:list.length-cap}); tr.appendChild(td); tb.appendChild(tr); }
}

/* ===== Bolta — inițializare și legături ===== */
function setLang(l,persist){
  lang=LANGS.includes(l)?l:'ro'; if(persist!==false) lsSet(K.lang,lang);
  dfCache.clear(); applyI18n(); try{ fromBackLabel(); }catch(e){} buildThemeSel(); buildTimeSelects(); $('langSel').value=lang;
  $('btnPlay').textContent=t(S.playing?'tm.pause':'tm.play'); $('ecPlay').textContent=t(EC.simPlaying?'ec.sim.pause':'ec.sim.play');
  updateTimeUI(true); $('placeNow').textContent=S.place.name+' · '+fmtCoord(S.place.lat,true)+' '+fmtCoord(S.place.lon,false);
  renderObjPanel(); renderFind(); renderCityResults(); renderPlaces(); if(!$('tab-words').hidden) renderWords(); renderEvents(); ecRefresh(true); requestRender();
}
/* Reciprocitate (from=): buton „← înapoi” către aplicația-sursă; doar surse cunoscute, altfel ignorat. Limba curentă a Boltei (8 limbi). */
function fromBack(f){
  const SRC={terra:['TerRa','https://chiuta.github.io/TerRa/'],orarium:['ORARIUM','https://chiuta.github.io/orarium/'],vatra:['VATRA','https://chiuta.github.io/VATRA/'],fieldobserver:['Field Observer','https://chiuta.github.io/FieldObserver/'],'nota-zero':['Nota Zero','https://chiuta.github.io/Nota-Zero/']};
  if(!f||!Object.prototype.hasOwnProperty.call(SRC,f)||document.getElementById('fff-back')) return;
  const a=document.createElement('a');
  a.id='fff-back'; a.href=SRC[f][1]; a.dataset.n=SRC[f][0]; a.rel='noopener';
  a.style.cssText='position:fixed;left:10px;bottom:10px;z-index:50;padding:6px 12px;border-radius:999px;background:rgba(20,22,30,.88);color:#fff;font:600 12px/1.3 system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.35)';
  document.body.appendChild(a); fromBackLabel();
}
function fromBackLabel(){   // și la schimbarea limbii (setLang)
  const a=document.getElementById('fff-back'); if(!a) return;
  const W={ro:'← înapoi la',en:'← back to',fr:'← retour à',it:'← torna a',es:'← volver a',pt:'← voltar a',hu:'← vissza:',de:'← zurück zu'};
  a.textContent=(W[lang]||W.ro)+' '+a.dataset.n;
}
function init(){
  loadSettings();
  const sl=lsGet(K.lang); lang=LANGS.includes(sl)?sl:'ro';
  const th=lsGet(K.theme); S.theme=['auto','light','dark','red'].includes(th)?th:'auto';
  const lsel=$('langSel'); LANGS.forEach(l=>{ const o=document.createElement('option'); o.value=l; o.textContent=LANG_NAMES[l]; lsel.appendChild(o); }); lsel.value=lang;
  try{ const zones=Intl.supportedValuesOf?Intl.supportedValuesOf('timeZone'):[]; const dl=$('tzList'); zones.concat(['UTC']).forEach(z=>{ const o=document.createElement('option'); o.value=z; dl.appendChild(o); }); }catch(e){}
  buildThemeSel(); buildTimeSelects(); applyI18n(); applyTheme(S.theme);
  $('app-version').textContent='v '+VERSION+' · '+UPDATED;
  if(window.innerWidth<800){ ['secLoc','secView'].forEach(id=>$(id).open=false); }
  syncOptsUI(); applyPlace(S.place); renderObjPanel(); renderPlaces();
  S.ms=now(); S.live=true; updateTimeUI(true);
  /* Link TerRa/ORARIUM/Nota Zero: #sky&t=<ISO UTC>&ll=lat,lon — parametri greșiți sau în afara 1900–2100 sunt ignorați */
  const hp=(location.hash||'').slice(1).split('&'), h=hp[0].includes('=')?'':hp[0], hq=new URLSearchParams((h?hp.slice(1):hp).join('&'));
  try{
    let bad=false, placed=false;
    if(hq.has('ll')){
      const ll=(hq.get('ll')||'').match(/^(-?\d{1,2}(?:\.\d+)?),(-?\d{1,3}(?:\.\d+)?)$/);
      if(ll&&Math.abs(+ll[1])<=90&&Math.abs(+ll[2])<=180){ applyPlace({name:'Link '+(+ll[1]).toFixed(2)+', '+(+ll[2]).toFixed(2),lat:+ll[1],lon:+ll[2],elev:0,tz:deviceTz()},null,true); placed=true; }
      else bad=true;
    }
    if(hq.has('t')){
      const tt=hq.get('t')||'', m=/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)(?::(\d\d))?(?:\.\d+)?Z$/.exec(tt);
      const ms=m?Date.parse(tt):NaN;
      /* dată calendaristică reală: 2026-02-31 și T24:00 se resping (Date.parse le-ar rula înainte) */
      if(m&&isFinite(ms)&&+m[4]<24&&+m[5]<60&&(m[6]==null||+m[6]<60)&&new Date(ms).toISOString().slice(0,10)===tt.slice(0,10)&&ms>=MS_MIN&&ms<=MS_MAX) setTime(ms,false);
      else bad=true;
    }
    if(bad) toast(t('lnk.bad')); else if(placed) toast(t('lnk.place'));
  }catch(e){}
  try{ fromBack(hq.get('from')); }catch(e){}
  showTab(TABS.includes(h)?h:'sky');
  startLive(); startEcTimer(); requestRender();

  /* limbă, temă, ajutor */
  lsel.addEventListener('change',()=>setLang(lsel.value,true));
  $('themeSel').addEventListener('change',()=>{ S.theme=$('themeSel').value; lsSet(K.theme,S.theme); applyTheme(S.theme); drawEcSim(); drawEcMap(); });
  if(window.matchMedia) matchMedia('(prefers-color-scheme: light)').addEventListener&&matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{ if(S.theme==='auto') applyTheme('auto'); });
  $('helpBtn').addEventListener('click',()=>{ $('helpDlg').showModal(); $('helpClose').focus(); }); $('helpClose').addEventListener('click',()=>$('helpDlg').close());
  /* file */
  TABS.forEach(id=>$('tabb-'+id).addEventListener('click',()=>showTab(id,false)));
  $('tabs').addEventListener('keydown',e=>{ const i=TABS.findIndex(x=>$('tabb-'+x)===document.activeElement); if(i<0) return; let n=-1; if(e.key==='ArrowRight') n=(i+1)%TABS.length; else if(e.key==='ArrowLeft') n=(i+TABS.length-1)%TABS.length; else if(e.key==='Home') n=0; else if(e.key==='End') n=TABS.length-1; if(n>=0){ e.preventDefault(); showTab(TABS[n],true); } });
  $('toWords').addEventListener('click',e=>{ e.preventDefault(); showTab('words',true); });
  /* cer: butoane */
  $('zoomIn').addEventListener('click',()=>zoomBy(1/1.3)); $('zoomOut').addEventListener('click',()=>zoomBy(1.3)); $('resetView').addEventListener('click',resetView); $('resetView2').addEventListener('click',resetView);
  /* timp */
  $('btnNow').addEventListener('click',()=>{ setTime(now(),true); });
  $('btnBack').addEventListener('click',()=>stepTime(-1)); $('btnFwd').addEventListener('click',()=>stepTime(1));
  $('stepSel').addEventListener('change',()=>{ S.stepSec=+$('stepSel').value; });
  $('speedSel').addEventListener('change',()=>{ S.speed=+$('speedSel').value; });
  $('revChk').addEventListener('change',()=>{ S.reverse=$('revChk').checked; });
  $('btnPlay').addEventListener('click',()=>togglePlay());
  $('dtIn').addEventListener('change',()=>{ const ms=parseInputValue($('dtIn').value,S.place.tz); if(ms==null||isNaN(ms)){ updateTimeUI(true); return; } setTime(ms,false); });
  /* loc */
  $('citySearch').addEventListener('input',renderCityResults);
  $('citySearch').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const b=$('cityList').querySelector('button'); if(b) b.click(); } });
  $('applyCoords').addEventListener('click',applyCoordsFromForm);
  ['latIn','lonIn','elevIn','nameIn','tzIn'].forEach(id=>$(id).addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); applyCoordsFromForm(); } }));
  $('gpsBtn').addEventListener('click',useGps); $('savePlace').addEventListener('click',savePlaceNow);
  /* opțiuni */
  for(const id in OPT_MAP){ $(id).addEventListener('change',()=>setOpt(OPT_MAP[id],$(id).checked)); }
  $('projSel').addEventListener('change',()=>setOpt('proj',$('projSel').value));
  $('cnameSel').addEventListener('change',()=>setOpt('cname',$('cnameSel').value));
  $('magLim').addEventListener('input',()=>{ S.opts.maglim=+$('magLim').value; $('magLimV').textContent=nf(S.opts.maglim,1); saveSettings(); requestRender(); });
  /* căutare */
  $('findIn').addEventListener('input',renderFind);
  $('findIn').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const b=$('findList').querySelector('button'); if(b) b.click(); } });
  /* export */
  $('exPrint').addEventListener('click',doPrint);
  $('exSvg').addEventListener('click',()=>{ download(exportName('svg'),buildChartSvg($('exInvert').checked),'image/svg+xml'); });
  $('exPng').addEventListener('click',async()=>{ try{ const b=await svgToPngBlob(buildChartSvg($('exInvert').checked),2); download(exportName('png'),b,'image/png'); }catch(e){ toast(t('ex.pngFail')); } });
  $('exPngView').addEventListener('click',()=>{ render(); canvas.toBlob(b=>{ if(b) download(exportName('png').replace('bolta-','bolta-vedere-'),b,'image/png'); else toast(t('ex.pngFail')); },'image/png'); });
  /* evenimente */
  $('evForm').addEventListener('submit',e=>e.preventDefault());
  $('evRun').addEventListener('click',runEvents);
  $('evIcs').addEventListener('click',()=>{ if(lastEvents.length) download('bolta-evenimente.ics',buildIcs(lastEvents),'text/calendar'); });
  document.querySelectorAll('#tab-events [data-span]').forEach(b=>b.addEventListener('click',()=>{ const tz=S.place.tz; const p=parts(S.ms,tz), q=parts(S.ms+(+b.dataset.span)*86400000,tz); $('evFrom').value=p.y+'-'+pad2(p.mo)+'-'+pad2(p.d); $('evTo').value=q.y+'-'+pad2(q.mo)+'-'+pad2(q.d); }));
  /* eclipsa */
  $('ecSlider').addEventListener('input',()=>{ ecSimStop(); EC.simT=+$('ecSlider').value/1000; drawEcSim(); });
  $('ecPlay').addEventListener('click',()=>{ if(EC.simPlaying) ecSimStop(); else ecSimStart(); });
  $('ecMaxBtn').addEventListener('click',()=>{ ecSimStop(); const r=simRange(); EC.simT=(r.max-r.a)/(r.b-r.a); $('ecSlider').value=Math.round(EC.simT*1000); drawEcSim(); });
  $('ecGoSky').addEventListener('click',ecGoSky);
  const r0=simRange(); EC.simT=(r0.max-r0.a)/(r0.b-r0.a); $('ecSlider').value=Math.round(EC.simT*1000);
  /* descriere */
  $('wdMag').addEventListener('change',renderWords); $('wdBelow').addEventListener('change',renderWords); $('wdRefresh').addEventListener('click',renderWords);
  /* locuri */
  $('plExport').addEventListener('click',()=>{ download('bolta-locuri.fff.json',JSON.stringify(buildBundle(),null,1),'application/json'); $('plStatus').textContent=t('pl.exported',{n:saved.length}); });
  $('plImport').addEventListener('change',async()=>{ const f=$('plImport').files[0]; if(!f) return; if(f.size>2e6){ $('plStatus').textContent=t('pl.errBig'); $('plImport').value=''; return; } const txt=await f.text(); const r=importBundle(txt); $('plStatus').textContent=r.msg; $('plStatus').className='hint '+(r.ok?'good':'bad'); renderPlaces(); $('plImport').value=''; });
  $('plClear').addEventListener('click',clearAll);
  /* redimensionare, vizibilitate */
  if(window.ResizeObserver) new ResizeObserver(()=>{ lastSize=''; requestRender(); }).observe($('canvaswrap')); window.addEventListener('resize',()=>{ lastSize=''; requestRender(); });
  document.addEventListener('visibilitychange',()=>{ lastTs=0; if(document.visibilityState==='visible') requestRender(); });
}

/* ---- interfață de testare / diagnostic (nu e folosită de aplicație) ---- */
function bench(n){
  n=n||120; const jd0=FR.jd; const r={frame:[],update:[],render:[]}; resizeIfNeeded();
  for(let i=0;i<n;i++){ S.ms+=i*60000; const a=performance.now(); FR.dirty=true; updateFrame(); const b=performance.now(); render(); const c=performance.now(); r.update.push(b-a); r.render.push(c-b); r.frame.push(c-a); }
  const st=a=>{ const s=[...a].sort((x,y)=>x-y); return {mean:a.reduce((p,q)=>p+q,0)/a.length,p50:s[Math.floor(s.length*.5)],p95:s[Math.floor(s.length*.95)],max:s[s.length-1]}; };
  return {n,frame:st(r.frame),update:st(r.update),render:st(r.render),canvas:[W,H,DPR],stars:NS};
}
window.__bolta={S,V,FR,P,B,E,ST,DICT,LANGS,CITIES,CONS,get Vc(){return Vc;},get lastEvents(){return lastEvents;},get lang(){return lang;},
  render,requestRender,updateFrame,proj3,unproject,setViewParams,computeView,altAzFromEnu,enuFromAltAz,setTime,applyPlace,setOpt,selectObj,pickAt,
  scanEvents,buildIcs,evTitle,evDetail,runEvents,ecLocal,ecGlobal,ecPath,simGeometry,circleOverlapFrac,buildChartSvg,svgToPngBlob,describeSky,renderWords,skyObjectList,
  bench,t,parseCoord,importBundle,buildBundle,setLang,showTab,GAL,limitingMag,tzOk,wallToMs,parts,tzOffsetMin,searchCities,searchObjects,VERSION,UPDATED,
  riseSetStar,starAppRaDec,fullFovFor,zoomBy,goView,msOfJd,jdOfMs,starName,consOfStar,CV0:()=>CV0a,get saved(){return saved;},drawEcSim,simRange,EC,ecRefresh,applyCoordsFromForm,mapXY};
init();
