  /* ---------- confirmare (dialog propriu, nu window.confirm) ---------- */

      var no = doc.createElement('button'); no.type = 'button'; no.className = 'fff-btn'; no.textContent = opt.no || T('no');
      var yes = doc.createElement('button'); yes.type = 'button'; yes.className = 'fff-btn fff-primary' + (opt.danger ? ' fff-danger' : ''); yes.textContent = opt.yes || T('yes');

  function ask(msg, c, o) {

  /* ---------- construire ---------- */
  var redactors = [];

  function encrypt(obj, password) {

  function validatePlain(o, slug) {

  /* ---------- API ---------- */
  var bundle = F.bundle = {

    /** Înregistrează fn(cheie, valoare) -> valoare curățată (șir); se aplică doar exportului necriptat. */
    redact: function (fn) { if (typeof fn === 'function') redactors.push(fn); },
    confirm: confirmDlg,

    /** Descarcă un .fff.json. Cu {encrypt:true, password} produce varianta criptată. */
    export: function (opt) {

    import: function (file, opt) {

      return readText(file).then(function (t) {
        var o = parseEnvelope(t);
        if (o.app !== slug) throw BErr('app', {got: o.app, want: slug});
        if (o.format === 'fff-bundle-enc') {
          if (opt.password == null || opt.password === '') throw BErr('password_required', {file: fname});
          return decrypt(o, opt.password).then(function (p) {
            if (p.app !== o.app) throw BErr('format');

          });
        }

      }).then(function (o) {
        var keys = validatePlain(o, slug);
        return ask(T('confirm_import', {n: keys.length, app: slug, ver: o.version || '?', date: (o.exported || '').slice(0, 10) || '?'}), opt.confirm)
          .then(function (ok) {
            if (!ok) return {keys: 0, cancelled: true};
            var undo = {};
            try {
              keys.forEach(function (k) {
                if (!(k in undo)) undo[k] = F.store.raw.get(k);
                F.store.raw.set(k, o.data[k]);

              });
            } catch (e) {
              Object.keys(undo).forEach(function (k) { try { if (undo[k] == null) F.store.raw.remove(k); else F.store.raw.set(k, undo[k]); } catch (e2) { /* ignorat */ } });

          });
      });
    },

    /** Șterge DOAR cheile indexate ale aplicației (și cele fff.<slug>.*). */
    wipe: function (opt) {

      if (!keys.length) return Promise.resolve({keys: 0, cancelled: false});
      return ask(T('confirm_wipe', {n: keys.length}), opt.confirm, {danger: true, yes: T('wipe_yes')}).then(function (ok) {

      });
    }
  };
})();

const SEM = (() => {

const DAILY = (() => {

  morse: {size: () => Object.keys(MORSE.LET).length + 10, items: () => [...Object.keys(MORSE.LET), ...Object.keys(MORSE.DIG)].map(c => ({id: 'morse:' + c, front: () => h('div', {class: 'big', html: morseGlyph(MORSE.ENC[c]) + ' <span class="mono" style="font-size:1rem">' + esc(MORSE.ENC[c]) + '</span>'}), back: c}))},
  braille: {items: () => Object.keys(BR.LET).map(c => ({id: 'braille:' + c, front: () => h('div', {html: BR.cellSvg(BR.LET[c], {size: 90})}), back: c.toUpperCase()}))},
  nato: {items: () => Object.keys(PH.SETS.itu.data).filter(k => /[A-Z]/.test(k)).map(c => ({id: 'nato:' + c, front: () => h('div', {class: 'big', text: PH.SETS.itu.data[c][0]}), back: c}))},
  semaphore: {items: () => Object.entries(SEM.PAIRS).map(([c, p]) => ({id: 'sem:' + c, front: () => h('div', {html: SEM.fig(p[0], p[1], {size: 120})}), back: c}))},
  pigpen: {items: () => PIG.LET.split('').map(c => ({id: 'pig:' + c, front: () => h('div', {html: PIG.svg(c, {size: 100})}), back: c}))}
};
const SRS = {
  state() { return store.get('srs', {cards: {}, decks: {morse: true}, newDay: '', newCount: 0, limit: 10}); },
  save(s) { store.set('srs', s); },
  allItems(s) { const m = {}; Object.keys(DECKS).forEach(d => { if (s.decks[d]) DECKS[d].items().forEach(it => { m[it.id] = it; }); }); return m; },
  queue(s, today) {
    const items = SRS.allItems(s); const due = [], fresh = [];
    Object.keys(items).forEach(id => { const c = s.cards[id]; if (!c) fresh.push(id); else if (c.due <= today) due.push(id); });
    due.sort((a, b) => s.cards[a].due - s.cards[b].due);
    const ds = dateStr(); const used = s.newDay === ds ? s.newCount : 0;
    return {due, fresh: fresh.slice(0, Math.max(0, s.limit - used)), freshTotal: fresh.length, items};
  },
  grade(s, id, q, today) {
    const prev = s.cards[id] || {ef: 2.5, n: 0, i: 0, lapses: 0};
    if (!s.cards[id]) { const ds = dateStr(); if (s.newDay !== ds) { s.newDay = ds; s.newCount = 0; } s.newCount++; }
    const nc = sm2(prev, q, today);
    if (q < 3) nc.due = today;  // reapare în aceeași zi
    s.cards[id] = nc; return nc;
  },
  stats(s, today) {
    const ids = Object.keys(SRS.allItems(s)); let due = 0, nw = 0, mature = 0, learning = 0;
    ids.forEach(id => { const c = s.cards[id]; if (!c) nw++; else { if (c.due <= today) due++; if (c.i >= 21) mature++; else learning++; } });
    return {total: ids.length, due, nw, mature, learning};
  }
};
function cardsPanel() {
  const d = h('div');
  const area = h('div', {id: 'srs-area'});
  const statEl = h('p', {id: 'srs-stats', role: 'status', 'aria-live': 'polite'});
  let session = [], cur = null, shown = false;
  const today = () => dayNum();
  function startSession() {
    const s = SRS.state(); const q = SRS.queue(s, today());
    session = [...q.due, ...q.fresh]; next();
  }
  function stats() { const s = SRS.state(); const st = SRS.stats(s, today()); statEl.textContent = t('srs.stats', st.total, st.due, st.nw, st.learning, st.mature); }
  function next() {
    stats(); const s = SRS.state(); const items = SRS.allItems(s);
    area.replaceChildren();
    while (session.length && !items[session[0]]) session.shift();
    if (!session.length) { cur = null; area.append(h('div', {class: 'card'}, h('p', {id: 'srs-done', text: Object.keys(items).length ? t('srs.done') : t('srs.nodecks')}), h('button', {class: 'btn', type: 'button', id: 'srs-restart', text: t('srs.restart'), on: {click: startSession}}))); return; }
    cur = session.shift(); shown = false;
    const it = items[cur];
    const back = h('div', {class: 'big', id: 'srs-back', hidden: true, text: it.back});
    const grades = h('div', {class: 'row', hidden: true, id: 'srs-grades'}, [[1, 'srs.again'], [3, 'srs.hard'], [4, 'srs.good'], [5, 'srs.easy']].map(([q, k]) => h('button', {class: 'btn', type: 'button', 'data-q': q, text: t(k), on: {click: () => {
      const ss = SRS.state(); const nc = SRS.grade(ss, it.id, q, today()); SRS.save(ss);
      if (q < 3) session.push(it.id);
      document.dispatchEvent(new CustomEvent('alf-srs-graded', {detail: {id: it.id, q, card: nc}}));
      next();
    }}})));
    const show = h('button', {class: 'btn primary', type: 'button', id: 'srs-show', text: t('srs.show'), on: {click: () => { back.hidden = false; grades.hidden = false; show.hidden = true; $('button', grades).focus(); }}});
    area.append(h('div', {class: 'card card-srs', 'data-card': it.id}, h('div', {class: 'srs-front'}, it.front()), back, show, grades));
    show.focus();
  }
  function decksUI() {
    const s = SRS.state();
    const box = h('div', {class: 'card'}, h('h3', {text: t('srs.decks')}));
    const row = h('div', {class: 'row'});
    Object.keys(DECKS).forEach(k => {
      const cb = h('input', {type: 'checkbox', id: 'srs-deck-' + k, checked: !!s.decks[k], on: {change: () => { const ss = SRS.state(); ss.decks[k] = cb.checked; SRS.save(ss); startSession(); }}});
      row.append(h('label', {class: 'f'}, h('span', {text: t('srs.deck.' + k)}), cb));
    });
    const lim = h('input', {type: 'number', id: 'srs-limit', min: 1, max: 100, value: s.limit, on: {change: () => { const ss = SRS.state(); ss.limit = Math.max(1, Math.min(100, +lim.value || 10)); SRS.save(ss); startSession(); }}});
    row.append(field(t('srs.limit'), lim));
    box.append(row);
    return box;
  }
  d.append(note(t('srs.note')), decksUI(), statEl, area);
  startSession();
  return d;
}

D("home.honest", "Sincer: cifrurile clasice sunt didactice, nu securitate; unele convenții (braille românesc, alfabete fonetice naționale, diacritice Morse) nu sunt standardizate și sunt marcate ca atare; dactilema nu are figuri.", "Honest note: classic ciphers are educational, not security; some conventions (Romanian braille, national phonetic alphabets, Morse diacritics) are not standardised and are marked as such; fingerspelling has no figures.", "À noter : les chiffres classiques sont pédagogiques, pas de la sécurité ; certaines conventions (braille roumain, alphabets phonétiques nationaux, diacritiques Morse) ne sont pas normalisées et sont signalées comme telles ; la dactylologie n'a pas de figures.", "Nota onesta: i cifrari classici sono didattici, non sicurezza; alcune convenzioni (braille rumeno, alfabeti fonetici nazionali, diacritici Morse) non sono standardizzate e sono segnalate; la dattilologia non ha figure.", "Nota honesta: los cifrados clásicos son didácticos, no seguridad; algunas convenciones (braille rumano, alfabetos fonéticos nacionales, diacríticos Morse) no están normalizadas y se marcan como tales; la dactilología no tiene figuras.", "Nota honesta: as cifras clássicas são didáticas, não segurança; algumas convenções (braille romeno, alfabetos fonéticos nacionais, diacríticos Morse) não são normalizadas e estão assinaladas; a dactilologia não tem figuras.", "Őszintén: a klasszikus titkosítások oktatásiak, nem biztonsági eszközök; néhány konvenció (román braille, nemzeti fonetikus ábécék, Morse ékezetek) nem szabványos, és jelöljük; az ujjábécéhez nincsenek ábrák.", "Ehrlich: klassische Chiffren sind didaktisch, keine Sicherheit; einige Konventionen (rumänisches Braille, nationale Buchstabiertafeln, Morse-Umlaute) sind nicht genormt und entsprechend markiert; das Fingeralphabet hat keine Abbildungen.");

D("data.a5", "Tabelele sunt scrise din memorie și confruntate cu surse publice; verificați cu normele oficiale înainte de orice utilizare operațională.", "The tables were written from memory and cross-checked against public sources; verify with the official standards before any operational use.", "Les tables ont été écrites de mémoire et recoupées avec des sources publiques ; vérifiez avec les normes officielles avant tout usage opérationnel.", "Le tabelle sono scritte a memoria e confrontate con fonti pubbliche; verificare con le norme ufficiali prima di qualsiasi uso operativo.", "Las tablas se escribieron de memoria y se contrastaron con fuentes públicas; verifique con las normas oficiales antes de cualquier uso operativo.", "As tabelas foram escritas de memória e confrontadas com fontes públicas; verifique com as normas oficiais antes de qualquer uso operacional.", "A táblázatok emlékezetből készültek, nyilvános forrásokkal vetettük össze; operatív használat előtt ellenőrizze a hivatalos szabványokkal.", "Die Tabellen wurden aus dem Gedächtnis erstellt und mit öffentlichen Quellen abgeglichen; vor jeder operativen Nutzung mit den offiziellen Normen prüfen.");
D("data.a6", "Descrierile prosign-urilor și ale dactilemei sunt în română și engleză; în celelalte limbi apar în engleză.", "Prosign meanings and fingerspelling descriptions exist in Romanian and English; other languages show English.", "Les significations des prosignes et la dactylologie existent en roumain et en anglais ; les autres langues affichent l'anglais.", "I significati dei prosign e la dattilologia esistono in rumeno e inglese; le altre lingue mostrano l'inglese.", "Los significados de los prosigns y la dactilología existen en rumano e inglés; los demás idiomas muestran inglés.", "Os significados dos prosigns e a dactilologia existem em romeno e inglês; as outras línguas mostram inglês.", "A prosign-jelentések és az ujjábécé leírása románul és angolul érhető el; a többi nyelven angol jelenik meg.", "Prosign-Bedeutungen und Fingeralphabet-Beschreibungen gibt es auf Rumänisch und Englisch; andere Sprachen zeigen Englisch.");

D("morse.ref.note", "Setul de bază (litere, cifre, semne marcate „standard”) urmează Recomandarea ITU-R M.1677-1. Semnele marcate „uzual” sunt folosite în practică, dar nu sunt în setul de bază.", "The core set (letters, digits, signs marked 'standard') follows ITU-R Recommendation M.1677-1. Signs marked 'customary' are used in practice but are not in the core set.", "Le jeu de base (lettres, chiffres, signes marqués « norme ») suit la Recommandation UIT-R M.1677-1. Les signes « usuel » sont employés en pratique mais ne font pas partie du jeu de base.", "Il set di base (lettere, cifre, segni marcati «norma») segue la Raccomandazione ITU-R M.1677-1. I segni «d'uso» sono usati nella pratica ma non fanno parte del set di base.", "El conjunto básico (letras, dígitos, signos marcados «norma») sigue la Recomendación UIT-R M.1677-1. Los signos «de uso» se emplean en la práctica pero no forman parte del conjunto básico.", "O conjunto básico (letras, dígitos, sinais marcados «norma») segue a Recomendação UIT-R M.1677-1. Os sinais «de uso» são empregues na prática mas não fazem parte do conjunto básico.", "Az alapkészlet (betűk, számjegyek, „szabvány” jelölésű jelek) az ITU-R M.1677-1 ajánlást követi. A „szokásos” jelek a gyakorlatban használatosak, de nem tartoznak az alapkészletbe.", "Der Grundsatz (Buchstaben, Ziffern, als „Norm“ markierte Zeichen) folgt der ITU-R-Empfehlung M.1677-1. „Üblich“ markierte Zeichen werden in der Praxis genutzt, gehören aber nicht zum Grundsatz.");

D("morse.prosigns.note", "În text se scriu între < >, de ex. <SOS>, <AR>; se emit legat, fără pauză între litere. Unele coincid cu un semn (AR = +, BT = =); la decodare apare semnul.", "In text they are written between < >, e.g. <SOS>, <AR>; they are sent run together with no gap between letters. Some coincide with a sign (AR = +, BT = =); decoding shows the sign.", "Dans le texte, ils s'écrivent entre < >, p. ex. <SOS>, <AR> ; ils sont émis liés, sans pause entre les lettres. Certains coïncident avec un signe (AR = +, BT = =) ; le décodage affiche le signe.", "Nel testo si scrivono tra < >, es. <SOS>, <AR>; si trasmettono uniti, senza pausa tra le lettere. Alcuni coincidono con un segno (AR = +, BT = =); la decodifica mostra il segno.", "En el texto se escriben entre < >, p. ej. <SOS>, <AR>; se emiten unidos, sin pausa entre letras. Algunos coinciden con un signo (AR = +, BT = =); la decodificación muestra el signo.", "No texto escrevem-se entre < >, p. ex. <SOS>, <AR>; emitem-se ligados, sem pausa entre letras. Alguns coincidem com um sinal (AR = +, BT = =); a descodificação mostra o sinal.", "Szövegben < > között írjuk, pl. <SOS>, <AR>; összefűzve, betűközök nélkül adjuk. Néhány egybeesik egy jellel (AR = +, BT = =); dekódoláskor a jel jelenik meg.", "Im Text stehen sie in < >, z. B. <SOS>, <AR>; sie werden zusammenhängend ohne Pause zwischen den Buchstaben gegeben. Einige fallen mit einem Zeichen zusammen (AR = +, BT = =); beim Dekodieren erscheint das Zeichen.");
D("morse.dia.note", "NU sunt standardizate. Aplicația folosește convențiile obișnuite (ă = à/å, ș = CH etc.); â, î și ț nu au semn propriu și se emit ca a, i, t. La decodare, același cod poate însemna mai multe litere (ex. .--.- = ă/à/å).", "NOT standardised. The app uses the usual conventions (ă = à/å, ș = CH, etc.); â, î and ț have no signal of their own and are sent as a, i, t. When decoding, the same code can mean several letters (e.g. .--.- = ă/à/å).", "NON normalisé. L'application utilise les conventions habituelles (ă = à/å, ș = CH, etc.) ; â, î et ț n'ont pas de signal propre et sont émis comme a, i, t. Au décodage, un même code peut désigner plusieurs lettres (p. ex. .--.- = ă/à/å).", "NON standardizzato. L'app usa le convenzioni consuete (ă = à/å, ș = CH, ecc.); â, î e ț non hanno un segnale proprio e sono trasmessi come a, i, t. In decodifica lo stesso codice può indicare più lettere (es. .--.- = ă/à/å).", "NO normalizado. La app usa las convenciones habituales (ă = à/å, ș = CH, etc.); â, î y ț no tienen señal propia y se emiten como a, i, t. Al decodificar, un mismo código puede significar varias letras (p. ej. .--.- = ă/à/å).", "NÃO normalizado. A app usa as convenções habituais (ă = à/å, ș = CH, etc.); â, î e ț não têm sinal próprio e são emitidos como a, i, t. Ao descodificar, o mesmo código pode significar várias letras (p. ex. .--.- = ă/à/å).", "NEM szabványos. Az alkalmazás a szokásos konvenciókat követi (ă = à/å, ș = CH stb.); az â, î és ț-nek nincs saját jele, a, i, t-ként adjuk. Dekódoláskor ugyanaz a kód több betűt is jelenthet (pl. .--.- = ă/à/å).", "NICHT genormt. Die App nutzt die üblichen Konventionen (ă = à/å, ș = CH usw.); â, î und ț haben kein eigenes Zeichen und werden als a, i, t gegeben. Beim Dekodieren kann derselbe Code mehrere Buchstaben bedeuten (z. B. .--.- = ă/à/å).");

D("morse.timing.formula", "Unitate = 1200 / WPM milisecunde (cuvântul PARIS = 50 unități). Pentru Farnsworth, literele se emit la viteza WPM, iar pauzele se lungesc ca viteza efectivă să fie cea aleasă.", "Unit = 1200 / WPM milliseconds (the word PARIS = 50 units). With Farnsworth, characters are sent at the WPM speed and the gaps are stretched to reach the chosen effective speed.", "Unité = 1200 / WPM millisecondes (le mot PARIS = 50 unités). En Farnsworth, les caractères sont émis à la vitesse WPM et les pauses allongées pour atteindre la vitesse effective choisie.", "Unità = 1200 / WPM millisecondi (la parola PARIS = 50 unità). Con Farnsworth i caratteri sono trasmessi alla velocità WPM e le pause si allungano per ottenere la velocità effettiva scelta.", "Unidad = 1200 / WPM milisegundos (la palabra PARIS = 50 unidades). Con Farnsworth los caracteres se emiten a la velocidad WPM y las pausas se alargan para lograr la velocidad efectiva elegida.", "Unidade = 1200 / WPM milissegundos (a palavra PARIS = 50 unidades). Com Farnsworth os caracteres são emitidos à velocidade WPM e as pausas alongadas para atingir a velocidade efetiva escolhida.", "Egység = 1200 / WPM ezredmásodperc (a PARIS szó = 50 egység). Farnsworth esetén a karaktereket WPM sebességgel adjuk, a szüneteket pedig megnyújtjuk, hogy a választott tényleges sebességet kapjuk.", "Einheit = 1200 / WPM Millisekunden (das Wort PARIS = 50 Einheiten). Bei Farnsworth werden Zeichen mit WPM-Tempo gegeben und die Pausen so gedehnt, dass die gewählte effektive Geschwindigkeit entsteht.");

D("morse.flash.warn", "Atenție: clipirea rapidă poate declanșa crize la persoanele fotosensibile. Pornește-o doar dacă e sigur pentru tine; folosește viteze mici.", "Warning: fast flashing can trigger seizures in photosensitive people. Start it only if it is safe for you; use low speeds.", "Attention : un clignotement rapide peut provoquer des crises chez les personnes photosensibles. Ne le lancez que si c'est sûr pour vous ; utilisez de faibles vitesses.", "Attenzione: il lampeggio rapido può provocare crisi nelle persone fotosensibili. Avvialo solo se è sicuro per te; usa velocità basse.", "Atención: el parpadeo rápido puede provocar crisis en personas fotosensibles. Actívalo solo si es seguro para ti; usa velocidades bajas.", "Atenção: o piscar rápido pode provocar crises em pessoas fotossensíveis. Ative-o apenas se for seguro para si; use velocidades baixas.", "Figyelem: a gyors villogás rohamot válthat ki fényérzékeny embereknél. Csak akkor indítsa, ha biztonságos; használjon kis sebességet.", "Achtung: schnelles Blinken kann bei lichtempfindlichen Personen Anfälle auslösen. Nur starten, wenn es für dich sicher ist; niedrige Geschwindigkeiten verwenden.");

D("morse.koch.note", "Metoda Koch: începi cu 2 caractere la viteză mare și adaugi câte unul când atingi ~90% acuratețe. Ordinea de aici este cea LCWO; există și alte ordini. Redarea folosește viteza, Farnsworth și tonul din fila Convertor.", "Koch method: start with 2 characters at full speed and add one when you reach ~90% accuracy. The order here is the LCWO one; other orders exist. Playback uses the speed, Farnsworth and tone set on the Converter tab.", "Méthode Koch : commencez avec 2 caractères à pleine vitesse et en ajoutez un à ~90 % de réussite. L'ordre est celui de LCWO ; d'autres existent. La lecture utilise la vitesse, le Farnsworth et la tonalité de l'onglet Convertisseur.", "Metodo Koch: si parte con 2 caratteri a piena velocità e se ne aggiunge uno a ~90% di accuratezza. L'ordine è quello LCWO; ne esistono altri. La riproduzione usa velocità, Farnsworth e tono della scheda Convertitore.", "Método Koch: empieza con 2 caracteres a toda velocidad y añade uno al llegar a ~90 % de acierto. El orden es el de LCWO; existen otros. La reproducción usa la velocidad, el Farnsworth y el tono de la pestaña Conversor.", "Método Koch: comece com 2 caracteres à velocidade total e acrescente um ao atingir ~90 % de acerto. A ordem é a do LCWO; existem outras. A reprodução usa a velocidade, o Farnsworth e o tom do separador Conversor.", "Koch-módszer: kezdjen 2 karakterrel teljes sebességgel, és ~90%-os pontosságnál adjon hozzá egyet. A sorrend az LCWO-é; vannak más sorrendek is. A lejátszás az Átváltó fül sebességét, Farnsworth-értékét és hangját használja.", "Koch-Methode: mit 2 Zeichen in vollem Tempo beginnen und bei ~90 % Trefferquote eines hinzufügen. Die Reihenfolge ist die von LCWO; es gibt andere. Die Wiedergabe nutzt Tempo, Farnsworth und Ton aus dem Reiter Konverter.");

D("morse.rhythm.note", "Emite litera afișată apăsând butonul (sau Spațiu/Enter, pe buton): apăsare scurtă = punct, lungă = linie. Pragul dintre ele este de 2 unități. După o pauză scurtă, semnul este evaluat.", "Send the shown character by pressing the button (or Space/Enter on the button): short press = dot, long = dash. The threshold between them is 2 units. After a short pause the sign is evaluated.", "Émettez le caractère affiché en appuyant sur le bouton (ou Espace/Entrée sur le bouton) : appui court = point, long = trait. Le seuil est de 2 unités. Après une courte pause, le signe est évalué.", "Trasmetti il carattere mostrato premendo il pulsante (o Spazio/Invio sul pulsante): pressione breve = punto, lunga = linea. La soglia è di 2 unità. Dopo una breve pausa il segno viene valutato.", "Emite el carácter mostrado pulsando el botón (o Espacio/Intro sobre el botón): pulsación corta = punto, larga = raya. El umbral es de 2 unidades. Tras una breve pausa se evalúa el signo.", "Emita o carácter mostrado premindo o botão (ou Espaço/Enter no botão): pressão curta = ponto, longa = traço. O limiar é de 2 unidades. Após uma breve pausa o sinal é avaliado.", "Adja le a mutatott karaktert a gomb megnyomásával (vagy Szóköz/Enter a gombon): rövid nyomás = pont, hosszú = vonás. A határ 2 egység. Rövid szünet után kiértékeljük.", "Gib das gezeigte Zeichen durch Drücken der Taste (oder Leertaste/Enter auf der Taste): kurz = Punkt, lang = Strich. Die Schwelle liegt bei 2 Einheiten. Nach kurzer Pause wird ausgewertet.");

D("morse.sheet.rule", "Punct = 1 unitate; linie = 3; pauză în literă = 1; între litere = 3; între cuvinte = 7. Standard: ITU-R M.1677-1 (semnele „uzual” nu fac parte din set).", "Dot = 1 unit; dash = 3; gap in a character = 1; between characters = 3; between words = 7. Standard: ITU-R M.1677-1 ('customary' signs are not part of the set).", "Point = 1 unité ; trait = 3 ; pause dans un caractère = 1 ; entre caractères = 3 ; entre mots = 7. Norme : UIT-R M.1677-1 (les signes « usuels » n'en font pas partie).", "Punto = 1 unità; linea = 3; pausa nel carattere = 1; tra caratteri = 3; tra parole = 7. Norma: ITU-R M.1677-1 (i segni «d'uso» non ne fanno parte).", "Punto = 1 unidad; raya = 3; pausa en el carácter = 1; entre caracteres = 3; entre palabras = 7. Norma: UIT-R M.1677-1 (los signos «de uso» no forman parte).", "Ponto = 1 unidade; traço = 3; pausa no carácter = 1; entre caracteres = 3; entre palavras = 7. Norma: UIT-R M.1677-1 (os sinais «de uso» não fazem parte).", "Pont = 1 egység; vonás = 3; karakteren belüli szünet = 1; karakterek közt = 3; szavak közt = 7. Szabvány: ITU-R M.1677-1 (a „szokásos” jelek nem tartoznak bele).", "Punkt = 1 Einheit; Strich = 3; Pause im Zeichen = 1; zwischen Zeichen = 3; zwischen Wörtern = 7. Norm: ITU-R M.1677-1 („übliche“ Zeichen gehören nicht dazu).");

D("br.numbering.desc", "Două coloane, trei rânduri: punctele 1-2-3 în coloana din stânga (de sus în jos), 4-5-6 în cea din dreapta. Unicode U+2800–U+283F: punctul 1 = 0x01, 2 = 0x02, 3 = 0x04, 4 = 0x08, 5 = 0x10, 6 = 0x20.", "Two columns, three rows: dots 1-2-3 in the left column (top to bottom), 4-5-6 in the right one. Unicode U+2800–U+283F: dot 1 = 0x01, 2 = 0x02, 3 = 0x04, 4 = 0x08, 5 = 0x10, 6 = 0x20.", "Deux colonnes, trois rangées : points 1-2-3 dans la colonne de gauche (de haut en bas), 4-5-6 dans celle de droite. Unicode U+2800–U+283F : point 1 = 0x01, 2 = 0x02, 3 = 0x04, 4 = 0x08, 5 = 0x10, 6 = 0x20.", "Due colonne, tre righe: punti 1-2-3 nella colonna di sinistra (dall'alto), 4-5-6 in quella di destra. Unicode U+2800–U+283F: punto 1 = 0x01, 2 = 0x02, 3 = 0x04, 4 = 0x08, 5 = 0x10, 6 = 0x20.", "Dos columnas, tres filas: puntos 1-2-3 en la columna izquierda (de arriba abajo), 4-5-6 en la derecha. Unicode U+2800–U+283F: punto 1 = 0x01, 2 = 0x02, 3 = 0x04, 4 = 0x08, 5 = 0x10, 6 = 0x20.", "Duas colunas, três linhas: pontos 1-2-3 na coluna esquerda (de cima para baixo), 4-5-6 na direita. Unicode U+2800–U+283F: ponto 1 = 0x01, 2 = 0x02, 3 = 0x04, 4 = 0x08, 5 = 0x10, 6 = 0x20.", "Két oszlop, három sor: az 1-2-3 pont a bal oszlopban (fentről lefelé), a 4-5-6 a jobbban. Unicode U+2800–U+283F: 1. pont = 0x01, 2 = 0x02, 3 = 0x04, 4 = 0x08, 5 = 0x10, 6 = 0x20.", "Zwei Spalten, drei Zeilen: Punkte 1-2-3 in der linken Spalte (von oben nach unten), 4-5-6 in der rechten. Unicode U+2800–U+283F: Punkt 1 = 0x01, 2 = 0x02, 3 = 0x04, 4 = 0x08, 5 = 0x10, 6 = 0x20.");

D("br.conv.note", "Convenții folosite: braille latin de GRAD 1 (litera cu litera). Litere a–z după tabelul internațional; semn numeric ⠼ (3456) înaintea cifrelor (a–j); majusculă ⠠ (6), cuvânt cu majuscule ⠠⠠; indicator de grad 1 ⠰ (56) când o literă a–j urmează direct după o cifră. Punctuația are variante între limbi.", "Conventions used: GRADE 1 Latin braille (letter by letter). Letters a–z per the international table; numeric sign ⠼ (3456) before digits (a–j); capital sign ⠠ (6), capitalised word ⠠⠠; grade 1 indicator ⠰ (56) when a letter a–j follows a digit directly. Punctuation varies between languages.", "Conventions utilisées : braille latin de DEGRÉ 1 (lettre à lettre). Lettres a–z selon la table internationale ; signe numérique ⠼ (3456) avant les chiffres (a–j) ; signe majuscule ⠠ (6), mot en majuscules ⠠⠠ ; indicateur de degré 1 ⠰ (56) quand une lettre a–j suit directement un chiffre. La ponctuation varie selon les langues.", "Convenzioni usate: braille latino di GRADO 1 (lettera per lettera). Lettere a–z secondo la tabella internazionale; segno numerico ⠼ (3456) prima delle cifre (a–j); segno maiuscolo ⠠ (6), parola maiuscola ⠠⠠; indicatore di grado 1 ⠰ (56) quando una lettera a–j segue direttamente una cifra. La punteggiatura varia tra le lingue.", "Convenciones usadas: braille latino de GRADO 1 (letra por letra). Letras a–z según la tabla internacional; signo numérico ⠼ (3456) antes de los dígitos (a–j); signo de mayúscula ⠠ (6), palabra en mayúsculas ⠠⠠; indicador de grado 1 ⠰ (56) cuando una letra a–j sigue directamente a un dígito. La puntuación varía entre idiomas.", "Convenções usadas: braille latino de GRAU 1 (letra a letra). Letras a–z segundo a tabela internacional; sinal numérico ⠼ (3456) antes dos dígitos (a–j); sinal de maiúscula ⠠ (6), palavra em maiúsculas ⠠⠠; indicador de grau 1 ⠰ (56) quando uma letra a–j segue diretamente um dígito. A pontuação varia entre línguas.", "Használt konvenciók: 1. FOKOZATÚ latin braille (betűről betűre). Az a–z betűk a nemzetközi táblázat szerint; számjel ⠼ (3456) a számjegyek (a–j) előtt; nagybetűjel ⠠ (6), csupa nagybetűs szó ⠠⠠; 1. fokozat jelző ⠰ (56), ha a–j betű közvetlenül számjegy után áll. Az írásjelek nyelvenként eltérnek.", "Verwendete Konventionen: lateinisches Braille der STUFE 1 (Buchstabe für Buchstabe). Buchstaben a–z nach der internationalen Tabelle; Zahlzeichen ⠼ (3456) vor Ziffern (a–j); Großbuchstabenzeichen ⠠ (6), Wort in Großbuchstaben ⠠⠠; Stufe-1-Anzeiger ⠰ (56), wenn ein Buchstabe a–j direkt auf eine Ziffer folgt. Satzzeichen unterscheiden sich je nach Sprache.");

D("br.digits.desc", "Cifrele se scriu cu semnul numeric ⠼ urmat de literele a–j (1 = a … 9 = i, 0 = j). Punctul și virgula între cifre rămân în modul numeric.", "Digits are written with the numeric sign ⠼ followed by letters a–j (1 = a … 9 = i, 0 = j). A point or comma between digits stays in numeric mode.", "Les chiffres s'écrivent avec le signe numérique ⠼ suivi des lettres a–j (1 = a … 9 = i, 0 = j). Un point ou une virgule entre chiffres reste en mode numérique.", "Le cifre si scrivono con il segno numerico ⠼ seguito dalle lettere a–j (1 = a … 9 = i, 0 = j). Punto o virgola tra cifre restano in modo numerico.", "Los dígitos se escriben con el signo numérico ⠼ seguido de las letras a–j (1 = a … 9 = i, 0 = j). Un punto o coma entre dígitos permanece en modo numérico.", "Os dígitos escrevem-se com o sinal numérico ⠼ seguido das letras a–j (1 = a … 9 = i, 0 = j). Ponto ou vírgula entre dígitos mantêm o modo numérico.", "A számjegyeket a ⠼ számjel és az a–j betűk jelölik (1 = a … 9 = i, 0 = j). A számjegyek közti pont vagy vessző számmódban marad.", "Ziffern werden mit dem Zahlzeichen ⠼ und den Buchstaben a–j geschrieben (1 = a … 9 = i, 0 = j). Punkt oder Komma zwischen Ziffern bleibt im Zahlmodus.");
D("br.punct.note", "Atribuirile de aici sunt cele mai răspândite; paranteza deschisă/închisă are același semn (⠶) și se deosebește după context; ghilimelele ⠦/⠴ coincid cu alte semne în unele limbi. Nu sunt valabile identic în toate țările.", "The assignments here are the most widespread; opening/closing parentheses share one sign (⠶) and are told apart by context; the quotes ⠦/⠴ coincide with other signs in some languages. They do not hold identically in every country.", "Les attributions ici sont les plus répandues ; parenthèses ouvrante/fermante partagent un signe (⠶) distingué par le contexte ; les guillemets ⠦/⠴ coïncident avec d'autres signes dans certaines langues. Elles ne valent pas à l'identique partout.", "Le assegnazioni qui sono le più diffuse; parentesi aperta/chiusa condividono un segno (⠶) distinto dal contesto; le virgolette ⠦/⠴ coincidono con altri segni in alcune lingue. Non valgono in modo identico ovunque.", "Las asignaciones aquí son las más extendidas; el paréntesis de apertura/cierre comparte un signo (⠶) que se distingue por el contexto; las comillas ⠦/⠴ coinciden con otros signos en algunos idiomas. No valen igual en todos los países.", "As atribuições aqui são as mais difundidas; o parêntese de abertura/fecho partilha um sinal (⠶) distinguido pelo contexto; as aspas ⠦/⠴ coincidem com outros sinais em algumas línguas. Não valem de forma idêntica em todos os países.", "A kiosztások itt a legelterjedtebbek; a nyitó és záró zárójel egy jelet (⠶) használ, a szövegkörnyezet dönt; az idézőjel ⠦/⠴ egyes nyelvekben más jellel egyezik. Nem minden országban azonosak.", "Die Zuordnungen hier sind die verbreitetsten; öffnende/schließende Klammer teilen ein Zeichen (⠶), das der Kontext unterscheidet; die Anführungszeichen ⠦/⠴ fallen in manchen Sprachen mit anderen Zeichen zusammen. Sie gelten nicht überall identisch.");
D("br.same.par", "paranteză (context)", "bracket (by context)", "parenthèse (contexte)", "parentesi (contesto)", "paréntesis (contexto)", "parêntese (contexto)", "zárójel (szövegkörnyezet)", "Klammer (Kontext)");
D("br.ro.warn", "Literele românești NU sunt standardizate aici: ă ⠜, â ⠡, î ⠩, ș ⠱, ț ⠹ este o convenție de lucru a aplicației (â și î împrumutate din braille-ul francez), NEVERIFICATĂ față de tabelul oficial românesc. Nu o folosiți pentru materiale tactile fără a o confrunta cu o organizație de persoane nevăzătoare. Poți schimba atribuirile sau plia literele.", "Romanian letters are NOT standardised here: ă ⠜, â ⠡, î ⠩, ș ⠱, ț ⠹ is a working convention of the app (â and î borrowed from French braille), NOT verified against the official Romanian table. Do not use it for tactile material without checking with an organisation of blind people. You can change the assignments or fold the letters.", "Les lettres roumaines ne sont PAS normalisées ici : ă ⠜, â ⠡, î ⠩, ș ⠱, ț ⠹ est une convention de travail de l'application (â et î empruntés au braille français), NON vérifiée par rapport à la table officielle roumaine. Ne l'utilisez pas pour du matériel tactile sans la confronter à une organisation de personnes aveugles. Vous pouvez modifier les attributions ou replier les lettres.", "Le lettere rumene NON sono standardizzate qui: ă ⠜, â ⠡, î ⠩, ș ⠱, ț ⠹ è una convenzione di lavoro dell'app (â e î presi dal braille francese), NON verificata sulla tabella ufficiale rumena. Non usarla per materiale tattile senza confrontarla con un'organizzazione di persone cieche. Puoi cambiare le assegnazioni o ridurre le lettere.", "Las letras rumanas NO están normalizadas aquí: ă ⠜, â ⠡, î ⠩, ș ⠱, ț ⠹ es una convención de trabajo de la app (â e î tomadas del braille francés), NO verificada con la tabla oficial rumana. No la uses para material táctil sin contrastarla con una organización de personas ciegas. Puedes cambiar las asignaciones o reducir las letras.", "As letras romenas NÃO estão normalizadas aqui: ă ⠜, â ⠡, î ⠩, ș ⠱, ț ⠹ é uma convenção de trabalho da app (â e î tomadas do braille francês), NÃO verificada com a tabela oficial romena. Não a use em material tátil sem a confrontar com uma organização de pessoas cegas. Pode alterar as atribuições ou reduzir as letras.", "A román betűk itt NEM szabványosak: az ă ⠜, â ⠡, î ⠩, ș ⠱, ț ⠹ az alkalmazás munkakonvenciója (az â és î a francia braille-ból kölcsönzött), a hivatalos román táblázattal NEM ellenőriztük. Tapintható anyaghoz ne használja, amíg nem egyeztette vakok szervezetével. A kiosztások módosíthatók, vagy a betűk visszavezethetők.", "Rumänische Buchstaben sind hier NICHT genormt: ă ⠜, â ⠡, î ⠩, ș ⠱, ț ⠹ ist eine Arbeitskonvention der App (â und î aus dem französischen Braille entlehnt), NICHT gegen die offizielle rumänische Tabelle geprüft. Nicht für taktiles Material verwenden, ohne sie mit einer Blindenorganisation abzugleichen. Die Zuordnungen lassen sich ändern oder die Buchstaben reduzieren.");

D("br.conv.note2", "Fișierele BRF folosesc ASCII braille nord-american (64 de simboluri) cu rânduri de 40 de celule implicit. SVG-ul tipărit NU este tactil: punctele sunt desenate, nu în relief.", "BRF files use North American braille ASCII (64 symbols) with 40-cell lines by default. A printed SVG is NOT tactile: the dots are drawn, not embossed.", "Les fichiers BRF utilisent le braille ASCII nord-américain (64 symboles) avec des lignes de 40 cellules par défaut. Un SVG imprimé n'est PAS tactile : les points sont dessinés, pas en relief.", "I file BRF usano l'ASCII braille nordamericano (64 simboli) con righe di 40 celle per impostazione predefinita. Un SVG stampato NON è tattile: i punti sono disegnati, non in rilievo.", "Los archivos BRF usan el braille ASCII norteamericano (64 símbolos) con líneas de 40 celdas por defecto. Un SVG impreso NO es táctil: los puntos están dibujados, no en relieve.", "Os ficheiros BRF usam o braille ASCII norte-americano (64 símbolos) com linhas de 40 células por omissão. Um SVG impresso NÃO é tátil: os pontos estão desenhados, não em relevo.", "A BRF fájlok az észak-amerikai ASCII braille-t (64 szimbólum) használják, alapból 40 cellás sorokkal. A kinyomtatott SVG NEM tapintható: a pontok rajzoltak, nem domborúak.", "BRF-Dateien nutzen nordamerikanisches ASCII-Braille (64 Symbole), standardmäßig mit 40 Zellen pro Zeile. Ein gedrucktes SVG ist NICHT tastbar: die Punkte sind gezeichnet, nicht erhaben.");

D("br.perk.note", "Tastatură tip Perkins: apasă simultan tastele F D S J K L (= punctele 1 2 3 4 5 6) și eliberează-le împreună; celula se înregistrează la eliberarea ultimei taste. Backspace șterge ultima celulă. Alternativ, folosește butoanele de mai jos și „Adaugă celula”.", "Perkins-style keyboard: press the keys F D S J K L (= dots 1 2 3 4 5 6) together and release them together; the cell registers when the last key is released. Backspace deletes the last cell. Alternatively, use the buttons below and 'Add cell'.", "Clavier de type Perkins : appuyez ensemble sur les touches F D S J K L (= points 1 2 3 4 5 6) et relâchez-les ensemble ; la cellule est enregistrée au relâchement de la dernière touche. Retour arrière efface la dernière cellule. Sinon, utilisez les boutons ci-dessous et « Ajouter la cellule ».", "Tastiera stile Perkins: premi insieme i tasti F D S J K L (= punti 1 2 3 4 5 6) e rilasciali insieme; la cella viene registrata al rilascio dell'ultimo tasto. Backspace cancella l'ultima cella. In alternativa usa i pulsanti qui sotto e «Aggiungi cella».", "Teclado estilo Perkins: pulsa a la vez las teclas F D S J K L (= puntos 1 2 3 4 5 6) y suéltalas juntas; la celda se registra al soltar la última tecla. Retroceso borra la última celda. También puedes usar los botones de abajo y «Añadir celda».", "Teclado estilo Perkins: prima em simultâneo as teclas F D S J K L (= pontos 1 2 3 4 5 6) e solte-as em conjunto; a célula regista-se ao soltar a última tecla. Retrocesso apaga a última célula. Em alternativa, use os botões abaixo e «Adicionar célula».", "Perkins-szerű billentyűzet: nyomja le egyszerre az F D S J K L billentyűket (= 1 2 3 4 5 6 pont), és engedje el együtt; a cella az utolsó billentyű felengedésekor rögzül. A Backspace törli az utolsó cellát. Használhatja az alábbi gombokat és a „Cella hozzáadása” gombot is.", "Perkins-Tastatur: die Tasten F D S J K L (= Punkte 1 2 3 4 5 6) gleichzeitig drücken und gemeinsam loslassen; die Zelle wird beim Loslassen der letzten Taste erfasst. Rücktaste löscht die letzte Zelle. Alternativ die Schaltflächen unten und „Zelle hinzufügen“ nutzen.");

D("ph.note.itu", "Alfabetul fonetic ITU/OACI/NATO este standardizat. Ortografia oficială este „Alfa” și „Juliett”; „Alpha”/„Juliet” sunt variante frecvente. Cifrele (Nadazero…) sunt cele din procedura radiotelefonică.", "The ITU/ICAO/NATO phonetic alphabet is standardised. The official spellings are 'Alfa' and 'Juliett'; 'Alpha'/'Juliet' are common variants. The digit words (Nadazero…) are the radiotelephony ones.", "L'alphabet phonétique UIT/OACI/OTAN est normalisé. Les graphies officielles sont « Alfa » et « Juliett » ; « Alpha »/« Juliet » sont des variantes courantes. Les mots pour les chiffres (Nadazero…) sont ceux de la radiotéléphonie.", "L'alfabeto fonetico ITU/ICAO/NATO è standardizzato. Le grafie ufficiali sono «Alfa» e «Juliett»; «Alpha»/«Juliet» sono varianti comuni. Le parole per le cifre (Nadazero…) sono quelle radiotelefoniche.", "El alfabeto fonético UIT/OACI/OTAN está normalizado. Las grafías oficiales son «Alfa» y «Juliett»; «Alpha»/«Juliet» son variantes comunes. Las palabras para los dígitos (Nadazero…) son las de radiotelefonía.", "O alfabeto fonético UIT/OACI/OTAN está normalizado. As grafias oficiais são «Alfa» e «Juliett»; «Alpha»/«Juliet» são variantes comuns. As palavras para os dígitos (Nadazero…) são as da radiotelefonia.", "Az ITU/ICAO/NATO fonetikus ábécé szabványos. A hivatalos írásmód „Alfa” és „Juliett”; az „Alpha”/„Juliet” gyakori változat. A számjegyszavak (Nadazero…) a rádiótelefónia szavai.", "Das ITU/ICAO/NATO-Buchstabieralphabet ist genormt. Amtliche Schreibweisen sind „Alfa“ und „Juliett“; „Alpha“/„Juliet“ sind verbreitete Varianten. Die Ziffernwörter (Nadazero …) stammen aus dem Sprechfunk.");
D("ph.note.ro", "NEOFICIAL: nu există un standard național unic. Lista conține nume proprii uzuale în comunicații și la telefon; instituțiile (poliție, armată, aviație, firme) folosesc liste proprii. Prima coloană este varianta principală, restul sunt variante; literele K, Q, W, X, Y sunt rare și variază mult. Verifică procedura instituției tale.", "UNOFFICIAL: there is no single national standard. The list holds first names customary in communications and on the phone; institutions (police, army, aviation, companies) use their own lists. The first name is the main variant, the rest are variants; K, Q, W, X, Y are rare and vary a lot. Check your institution's procedure.", "NON OFFICIEL : il n'existe pas de norme nationale unique. La liste contient des prénoms usuels en communication et au téléphone ; les institutions (police, armée, aviation, entreprises) utilisent leurs propres listes. Le premier nom est la variante principale, les autres sont des variantes ; K, Q, W, X, Y sont rares et très variables. Vérifiez la procédure de votre institution.", "NON UFFICIALE: non esiste uno standard nazionale unico. L'elenco contiene nomi propri d'uso nelle comunicazioni e al telefono; le istituzioni (polizia, esercito, aviazione, aziende) usano elenchi propri. Il primo nome è la variante principale, gli altri sono varianti; K, Q, W, X, Y sono rare e molto variabili. Verifica la procedura della tua istituzione.", "NO OFICIAL: no existe un estándar nacional único. La lista contiene nombres propios habituales en comunicaciones y por teléfono; las instituciones (policía, ejército, aviación, empresas) usan listas propias. El primer nombre es la variante principal, el resto son variantes; K, Q, W, X, Y son raras y muy variables. Comprueba el procedimiento de tu institución.", "NÃO OFICIAL: não existe uma norma nacional única. A lista contém nomes próprios habituais nas comunicações e ao telefone; as instituições (polícia, exército, aviação, empresas) usam listas próprias. O primeiro nome é a variante principal, os restantes são variantes; K, Q, W, X, Y são raras e muito variáveis. Verifique o procedimento da sua instituição.", "NEM HIVATALOS: nincs egységes nemzeti szabvány. A lista a hírközlésben és telefonon szokásos keresztneveket tartalmazza; az intézmények (rendőrség, hadsereg, légiközlekedés, cégek) saját listát használnak. Az első név a fő változat, a többi változat; a K, Q, W, X, Y ritka és nagyon változó. Ellenőrizze intézménye eljárását.", "INOFFIZIELL: Es gibt keinen einheitlichen nationalen Standard. Die Liste enthält Vornamen, die in Funk und Telefon üblich sind; Institutionen (Polizei, Militär, Luftfahrt, Firmen) nutzen eigene Listen. Der erste Name ist die Hauptvariante, die übrigen sind Varianten; K, Q, W, X, Y sind selten und sehr unterschiedlich. Prüfe das Verfahren deiner Institution.");
D("ph.note.de22", "DIN 5009:2022 (denumiri de orașe), scrisă din memorie și neverificată pe textul normei; umlauturile (Ä, Ö, Ü) sunt reduse la A, O, U. Verifică norma oficială.", "DIN 5009:2022 (city names), written from memory and not checked against the text of the standard; umlauts (Ä, Ö, Ü) are reduced to A, O, U. Check the official standard.", "DIN 5009:2022 (noms de villes), écrite de mémoire et non vérifiée sur le texte de la norme ; les trémas (Ä, Ö, Ü) sont réduits à A, O, U. Vérifiez la norme officielle.", "DIN 5009:2022 (nomi di città), scritta a memoria e non verificata sul testo della norma; le dieresi (Ä, Ö, Ü) sono ridotte ad A, O, U. Verifica la norma ufficiale.", "DIN 5009:2022 (nombres de ciudades), escrita de memoria y sin verificar con el texto de la norma; las diéresis (Ä, Ö, Ü) se reducen a A, O, U. Comprueba la norma oficial.", "DIN 5009:2022 (nomes de cidades), escrita de memória e não verificada com o texto da norma; os tremas (Ä, Ö, Ü) são reduzidos a A, O, U. Verifique a norma oficial.", "DIN 5009:2022 (városnevek), emlékezetből írva, a szabvány szövegével nem ellenőrizve; az umlautok (Ä, Ö, Ü) A, O, U-ra egyszerűsödnek. Ellenőrizze a hivatalos szabványt.", "DIN 5009:2022 (Städtenamen), aus dem Gedächtnis erstellt und nicht am Normtext geprüft; Umlaute (Ä, Ö, Ü) werden auf A, O, U reduziert. Offizielle Norm prüfen.");
D("ph.note.de83", "Varianta tradițională (DIN 5009 din 1983, nume de persoane), scrisă din memorie, cu varianta „Zeppelin” pentru Z. Include Ä, Ö, Ü. Verifică norma.", "The traditional version (DIN 5009 of 1983, personal names), written from memory, with the variant 'Zeppelin' for Z. Includes Ä, Ö, Ü. Check the standard.", "La version traditionnelle (DIN 5009 de 1983, prénoms), écrite de mémoire, avec la variante « Zeppelin » pour Z. Inclut Ä, Ö, Ü. Vérifiez la norme.", "La versione tradizionale (DIN 5009 del 1983, nomi di persona), scritta a memoria, con la variante «Zeppelin» per Z. Include Ä, Ö, Ü. Verifica la norma.", "La versión tradicional (DIN 5009 de 1983, nombres de persona), escrita de memoria, con la variante «Zeppelin» para Z. Incluye Ä, Ö, Ü. Comprueba la norma.", "A versão tradicional (DIN 5009 de 1983, nomes de pessoas), escrita de memória, com a variante «Zeppelin» para Z. Inclui Ä, Ö, Ü. Verifique a norma.", "A hagyományos változat (DIN 5009, 1983, személynevek), emlékezetből írva, a Z-hez „Zeppelin” változattal. Tartalmazza az Ä, Ö, Ü-t. Ellenőrizze a szabványt.", "Die traditionelle Fassung (DIN 5009 von 1983, Personennamen), aus dem Gedächtnis erstellt, mit der Variante „Zeppelin“ für Z. Enthält Ä, Ö, Ü. Norm prüfen.");
D("ph.note.fr", "NEOFICIAL: ortografierea telefonică franceză uzuală (prenume); există variante regionale și profesionale. Doar litere.", "UNOFFICIAL: the customary French telephone spelling (first names); regional and professional variants exist. Letters only.", "NON OFFICIEL : l'épellation téléphonique française usuelle (prénoms) ; il existe des variantes régionales et professionnelles. Lettres seulement.", "NON UFFICIALE: la compitazione telefonica francese d'uso (nomi propri); esistono varianti regionali e professionali. Solo lettere.", "NO OFICIAL: el deletreo telefónico francés habitual (nombres propios); existen variantes regionales y profesionales. Solo letras.", "NÃO OFICIAL: a soletração telefónica francesa habitual (nomes próprios); existem variantes regionais e profissionais. Apenas letras.", "NEM HIVATALOS: a szokásos francia telefonos betűzés (keresztnevek); vannak regionális és szakmai változatok. Csak betűk.", "INOFFIZIELL: die übliche französische Telefon-Buchstabiertafel (Vornamen); es gibt regionale und berufliche Varianten. Nur Buchstaben.");
D("ph.itu.spell", "La epelarea automată în ITU, cifrele devin Nadazero, Unaone etc.; celelalte alfabete lasă cifrele neschimbate.", "In automatic ITU spelling, digits become Nadazero, Unaone etc.; the other alphabets leave digits unchanged.", "Dans l'épellation automatique UIT, les chiffres deviennent Nadazero, Unaone etc. ; les autres alphabets laissent les chiffres inchangés.", "Nella compitazione automatica ITU, le cifre diventano Nadazero, Unaone ecc.; gli altri alfabeti lasciano le cifre invariate.", "En el deletreo automático UIT, los dígitos se convierten en Nadazero, Unaone, etc.; los demás alfabetos dejan los dígitos sin cambio.", "Na soletração automática UIT, os dígitos tornam-se Nadazero, Unaone, etc.; os outros alfabetos deixam os dígitos inalterados.", "Az automatikus ITU betűzésben a számjegyek Nadazero, Unaone stb. lesznek; a többi ábécé változatlanul hagyja a számjegyeket.", "Beim automatischen ITU-Buchstabieren werden Ziffern zu Nadazero, Unaone usw.; die anderen Alphabete lassen Ziffern unverändert.");

D("sem.note", "Semaforul cu două drapele: fiecare braț are una din 8 direcții (din 45° în 45°). Figurile sunt văzute dinspre receptor, privind semnalizatorul. Notația numerică: 0=↓ 1=↙ 2=← 3=↖ 4=↑ 5=↗ 6=→ 7=↘ (două cifre, ordinea nu contează; 00 = repaus/spațiu).", "Two-flag semaphore: each arm points in one of 8 directions (45° steps). Figures are seen from the receiver, facing the signaller. Numeric notation: 0=↓ 1=↙ 2=← 3=↖ 4=↑ 5=↗ 6=→ 7=↘ (two digits, order does not matter; 00 = rest/space).", "Sémaphore à deux drapeaux : chaque bras pointe dans l'une de 8 directions (pas de 45°). Les figures sont vues du récepteur, face au signaleur. Notation numérique : 0=↓ 1=↙ 2=← 3=↖ 4=↑ 5=↗ 6=→ 7=↘ (deux chiffres, l'ordre importe peu ; 00 = repos/espace).", "Semaforo a due bandiere: ogni braccio punta in una di 8 direzioni (passi di 45°). Le figure sono viste dal ricevente, di fronte al segnalatore. Notazione numerica: 0=↓ 1=↙ 2=← 3=↖ 4=↑ 5=↗ 6=→ 7=↘ (due cifre, l'ordine non conta; 00 = riposo/spazio).", "Semáforo de dos banderas: cada brazo apunta en una de 8 direcciones (pasos de 45°). Las figuras se ven desde el receptor, de cara al señalizador. Notación numérica: 0=↓ 1=↙ 2=← 3=↖ 4=↑ 5=↗ 6=→ 7=↘ (dos dígitos, el orden no importa; 00 = reposo/espacio).", "Semáforo de duas bandeiras: cada braço aponta numa de 8 direções (passos de 45°). As figuras são vistas do recetor, de frente para o sinalizador. Notação numérica: 0=↓ 1=↙ 2=← 3=↖ 4=↑ 5=↗ 6=→ 7=↘ (dois dígitos, a ordem não importa; 00 = repouso/espaço).", "Kétzászlós szemafor: minden kar 8 irány egyikébe mutat (45°-os lépések). Az ábrák a vevő felől, a jelzővel szemben láthatók. Számjelölés: 0=↓ 1=↙ 2=← 3=↖ 4=↑ 5=↗ 6=→ 7=↘ (két számjegy, a sorrend mindegy; 00 = nyugalmi helyzet/szóköz).", "Flaggenalphabet mit zwei Flaggen: jeder Arm zeigt in eine von 8 Richtungen (45°-Schritte). Die Figuren sind aus Sicht des Empfängers, dem Signalgeber gegenüber, gezeichnet. Zifferncode: 0=↓ 1=↙ 2=← 3=↖ 4=↑ 5=↗ 6=→ 7=↘ (zwei Ziffern, Reihenfolge egal; 00 = Ruhe/Leerzeichen).");
D("sem.verify", "Tabelul literelor a fost confruntat cu două surse publice (un dicționar de unghiuri și o descriere a figurilor), dar verifică-l cu un manual oficial înainte de utilizare operațională. Nu sunt desenate cifrele, semnul numeric și semnul de anulare.", "The letter table was cross-checked against two public sources (an angle dictionary and a description of the figures), but verify it with an official manual before operational use. Digits, the numeric sign and the cancel sign are not drawn.", "La table des lettres a été recoupée avec deux sources publiques (un dictionnaire d'angles et une description des figures), mais vérifiez-la avec un manuel officiel avant tout usage opérationnel. Chiffres, signe numérique et signe d'annulation ne sont pas dessinés.", "La tabella delle lettere è stata confrontata con due fonti pubbliche (un dizionario di angoli e una descrizione delle figure), ma verificala con un manuale ufficiale prima dell'uso operativo. Cifre, segno numerico e segno di annullamento non sono disegnati.", "La tabla de letras se contrastó con dos fuentes públicas (un diccionario de ángulos y una descripción de las figuras), pero verifícala con un manual oficial antes del uso operativo. No se dibujan los dígitos, el signo numérico ni el de anulación.", "A tabela de letras foi confrontada com duas fontes públicas (um dicionário de ângulos e uma descrição das figuras), mas verifique-a com um manual oficial antes do uso operacional. Não se desenham os dígitos, o sinal numérico nem o de anulação.", "A betűtáblát két nyilvános forrással vetettük össze (szögszótár és az ábrák leírása), de operatív használat előtt ellenőrizze hivatalos kézikönyvvel. A számjegyek, a számjel és a törlésjel nincs lerajzolva.", "Die Buchstabentabelle wurde mit zwei öffentlichen Quellen abgeglichen (ein Winkelverzeichnis und eine Figurenbeschreibung), vor operativem Einsatz aber mit einem offiziellen Handbuch prüfen. Ziffern, Zahlzeichen und Löschzeichen sind nicht gezeichnet.");
D("sem.legend", "Direcții: 0=↓ jos, 1=↙, 2=← stânga, 3=↖, 4=↑ sus, 5=↗, 6=→ dreapta, 7=↘ (din punctul de vedere al receptorului).", "Directions: 0=↓ down, 1=↙, 2=← left, 3=↖, 4=↑ up, 5=↗, 6=→ right, 7=↘ (receiver's point of view).", "Directions : 0=↓ bas, 1=↙, 2=← gauche, 3=↖, 4=↑ haut, 5=↗, 6=→ droite, 7=↘ (point de vue du récepteur).", "Direzioni: 0=↓ giù, 1=↙, 2=← sinistra, 3=↖, 4=↑ su, 5=↗, 6=→ destra, 7=↘ (punto di vista del ricevente).", "Direcciones: 0=↓ abajo, 1=↙, 2=← izquierda, 3=↖, 4=↑ arriba, 5=↗, 6=→ derecha, 7=↘ (punto de vista del receptor).", "Direções: 0=↓ baixo, 1=↙, 2=← esquerda, 3=↖, 4=↑ cima, 5=↗, 6=→ direita, 7=↘ (ponto de vista do recetor).", "Irányok: 0=↓ le, 1=↙, 2=← balra, 3=↖, 4=↑ fel, 5=↗, 6=→ jobbra, 7=↘ (a vevő szemszögéből).", "Richtungen: 0=↓ unten, 1=↙, 2=← links, 3=↖, 4=↑ oben, 5=↗, 6=→ rechts, 7=↘ (aus Sicht des Empfängers).");

D("pig.note", "Pigpen (cifrul francmasonic), varianta clasică: două grile # (A–I fără punct, J–R cu punct) și două grile X (S–V fără punct, W–Z cu punct; ordinea sus, stânga, dreapta, jos). Nu există o variantă unică universală.", "Pigpen (the Freemasons' cipher), classic variant: two # grids (A–I without a dot, J–R with a dot) and two X grids (S–V without a dot, W–Z with a dot; order top, left, right, bottom). There is no single universal variant.", "Pigpen (le chiffre des francs-maçons), variante classique : deux grilles # (A–I sans point, J–R avec point) et deux grilles X (S–V sans point, W–Z avec point ; ordre haut, gauche, droite, bas). Il n'existe pas de variante universelle unique.", "Pigpen (il cifrario massonico), variante classica: due griglie # (A–I senza punto, J–R con punto) e due griglie X (S–V senza punto, W–Z con punto; ordine alto, sinistra, destra, basso). Non esiste un'unica variante universale.", "Pigpen (el cifrado masónico), variante clásica: dos cuadrículas # (A–I sin punto, J–R con punto) y dos cuadrículas X (S–V sin punto, W–Z con punto; orden arriba, izquierda, derecha, abajo). No existe una variante universal única.", "Pigpen (a cifra maçónica), variante clássica: duas grelhas # (A–I sem ponto, J–R com ponto) e duas grelhas X (S–V sem ponto, W–Z com ponto; ordem cima, esquerda, direita, baixo). Não existe uma variante universal única.", "Pigpen (a szabadkőműves titkosírás), klasszikus változat: két # rács (A–I pont nélkül, J–R ponttal) és két X rács (S–V pont nélkül, W–Z ponttal; sorrend: fent, balra, jobbra, lent). Nincs egyetlen általános változat.", "Pigpen (die Freimaurer-Geheimschrift), klassische Variante: zwei #-Gitter (A–I ohne Punkt, J–R mit Punkt) und zwei X-Gitter (S–V ohne Punkt, W–Z mit Punkt; Reihenfolge oben, links, rechts, unten). Es gibt keine einheitliche Variante.");

D("bau.note", "ITA2 (Baudot–Murray): cod pe 5 biți cu două seturi, litere (LTRS, 31) și cifre/semne (FIGS, 27); schimbarea se face cu codurile de schimbare, inserate automat. Bitul 1 este cel mai puțin semnificativ.", "ITA2 (Baudot–Murray): a 5-bit code with two sets, letters (LTRS, 31) and figures (FIGS, 27); shifting uses shift codes, inserted automatically. Bit 1 is the least significant.", "ITA2 (Baudot–Murray) : code à 5 bits avec deux jeux, lettres (LTRS, 31) et chiffres/signes (FIGS, 27) ; le changement utilise des codes de décalage, insérés automatiquement. Le bit 1 est le moins significatif.", "ITA2 (Baudot–Murray): codice a 5 bit con due insiemi, lettere (LTRS, 31) e cifre/segni (FIGS, 27); il cambio usa codici di spostamento, inseriti automaticamente. Il bit 1 è il meno significativo.", "ITA2 (Baudot–Murray): código de 5 bits con dos conjuntos, letras (LTRS, 31) y cifras/signos (FIGS, 27); el cambio usa códigos de desplazamiento, insertados automáticamente. El bit 1 es el menos significativo.", "ITA2 (Baudot–Murray): código de 5 bits com dois conjuntos, letras (LTRS, 31) e algarismos/sinais (FIGS, 27); a mudança usa códigos de deslocamento, inseridos automaticamente. O bit 1 é o menos significativo.", "ITA2 (Baudot–Murray): 5 bites kód két készlettel, betűk (LTRS, 31) és számok/jelek (FIGS, 27); a váltás váltókódokkal történik, automatikusan beszúrva. Az 1. bit a legkisebb helyiértékű.", "ITA2 (Baudot–Murray): 5-Bit-Code mit zwei Sätzen, Buchstaben (LTRS, 31) und Ziffern/Zeichen (FIGS, 27); der Wechsel erfolgt mit Umschaltcodes, automatisch eingefügt. Bit 1 ist das niederwertigste.");
D("bau.nat.note", "Poziții marcate „național”: funcția (clopot, WRU, #, &, $, ! etc.) variază între țări și variante; nu sunt convertite.", "Positions marked 'national': the function (bell, WRU, #, &, $, ! etc.) varies between countries and variants; they are not converted.", "Positions marquées « national » : la fonction (cloche, WRU, #, &, $, ! etc.) varie selon les pays et variantes ; elles ne sont pas converties.", "Posizioni marcate «nazionale»: la funzione (campanello, WRU, #, &, $, ! ecc.) varia tra paesi e varianti; non vengono convertite.", "Posiciones marcadas «nacional»: la función (campana, WRU, #, &, $, ! etc.) varía entre países y variantes; no se convierten.", "Posições marcadas «nacional»: a função (campainha, WRU, #, &, $, ! etc.) varia entre países e variantes; não são convertidas.", "„Nemzeti” jelölésű helyek: a funkció (csengő, WRU, #, &, $, ! stb.) országonként és változatonként eltér; nem váltjuk át.", "Als „national“ markierte Positionen: Die Funktion (Klingel, WRU, #, &, $, ! usw.) variiert zwischen Ländern und Varianten; sie werden nicht umgesetzt.");

D("bau.tape.note", "Schematic: punctele sunt găuri; bitul 1 sus, bitul 5 jos, punctul mic = gaura de antrenare. Dispunerea reală a benzilor variază.", "Schematic: dots are holes; bit 1 at the top, bit 5 at the bottom, the small dot = feed hole. Real tape layouts vary.", "Schématique : les points sont des trous ; bit 1 en haut, bit 5 en bas, petit point = trou d'entraînement. Les dispositions réelles varient.", "Schematico: i punti sono fori; bit 1 in alto, bit 5 in basso, punto piccolo = foro di trascinamento. Le disposizioni reali variano.", "Esquemático: los puntos son agujeros; bit 1 arriba, bit 5 abajo, punto pequeño = agujero de arrastre. Las disposiciones reales varían.", "Esquemático: os pontos são furos; bit 1 em cima, bit 5 em baixo, ponto pequeno = furo de arrasto. As disposições reais variam.", "Vázlatos: a pontok lyukak; felül az 1. bit, alul az 5. bit, a kis pont = transzportlyuk. A valódi szalagkiosztás eltérő lehet.", "Schematisch: Punkte sind Löcher; Bit 1 oben, Bit 5 unten, kleiner Punkt = Transportloch. Reale Streifenanordnungen variieren.");

D("tc.note", "Alege formatul introducerii; toate celelalte formate se calculează imediat din aceiași octeți (UTF-8). Ambele sensuri: poți lipi binar, hex, Base64 etc. și obții textul.", "Choose the input format; all the other formats are computed at once from the same bytes (UTF-8). Both directions: you can paste binary, hex, Base64 etc. and get the text.", "Choisissez le format d'entrée ; tous les autres formats sont calculés aussitôt à partir des mêmes octets (UTF-8). Dans les deux sens : vous pouvez coller du binaire, hex, Base64, etc. et obtenir le texte.", "Scegli il formato di ingresso; tutti gli altri formati sono calcolati subito dagli stessi byte (UTF-8). In entrambe le direzioni: puoi incollare binario, esadecimale, Base64 ecc. e ottenere il testo.", "Elige el formato de entrada; todos los demás formatos se calculan al instante a partir de los mismos bytes (UTF-8). En ambos sentidos: puedes pegar binario, hex, Base64, etc. y obtener el texto.", "Escolha o formato de entrada; todos os outros formatos são calculados de imediato a partir dos mesmos bytes (UTF-8). Nos dois sentidos: pode colar binário, hex, Base64, etc. e obter o texto.", "Válassza ki a bemeneti formátumot; az összes többi formátum azonnal kiszámítódik ugyanazokból a bájtokból (UTF-8). Mindkét irányban: beilleszthet binárist, hexát, Base64-et stb., és megkapja a szöveget.", "Eingabeformat wählen; alle anderen Formate werden sofort aus denselben Bytes (UTF-8) berechnet. In beide Richtungen: Binär, Hex, Base64 usw. einfügen und den Text erhalten.");

D("ci.warn", "Atenție: cifrurile clasice sunt exerciții didactice și se sparg ușor. NU oferă securitate; nu le folosi pentru date sau mesaje reale.", "Warning: classic ciphers are educational exercises and are easily broken. They provide NO security; do not use them for real data or messages.", "Attention : les chiffres classiques sont des exercices pédagogiques et se cassent facilement. Ils n'offrent AUCUNE sécurité ; ne les utilisez pas pour des données ou messages réels.", "Attenzione: i cifrari classici sono esercizi didattici e si violano facilmente. NON offrono sicurezza; non usarli per dati o messaggi reali.", "Atención: los cifrados clásicos son ejercicios didácticos y se rompen con facilidad. NO ofrecen seguridad; no los uses con datos ni mensajes reales.", "Atenção: as cifras clássicas são exercícios didáticos e quebram-se facilmente. NÃO oferecem segurança; não as use com dados ou mensagens reais.", "Figyelem: a klasszikus titkosítások oktatási gyakorlatok, könnyen feltörhetők. NEM nyújtanak biztonságot; valódi adatokhoz vagy üzenetekhez ne használja.", "Achtung: Klassische Chiffren sind didaktische Übungen und leicht zu brechen. Sie bieten KEINE Sicherheit; nicht für echte Daten oder Nachrichten verwenden.");

D("ci.keyopt", "Polybius/tap: cheia este opțională (amestecă pătratul). Diacriticele se reduc la litera de bază (ă → a); rezultatul poate fi fără diacritice.", "Polybius/tap: the key is optional (it scrambles the square). Diacritics are folded to the base letter (ă → a); the result may lose diacritics.", "Polybius/tap : la clé est facultative (elle brouille le carré). Les diacritiques sont repliés sur la lettre de base (ă → a) ; le résultat peut perdre ses diacritiques.", "Polybius/tap: la chiave è facoltativa (rimescola il quadrato). I diacritici si riducono alla lettera base (ă → a); il risultato può perdere i diacritici.", "Polybius/tap: la clave es opcional (mezcla el cuadrado). Los diacríticos se reducen a la letra base (ă → a); el resultado puede perder los diacríticos.", "Polybius/tap: a chave é opcional (baralha o quadrado). Os diacríticos reduzem-se à letra base (ă → a); o resultado pode perder diacríticos.", "Polybius/tap: a kulcs nem kötelező (megkeveri a négyzetet). Az ékezetek az alapbetűre egyszerűsödnek (ă → a); az eredmény ékezet nélküli lehet.", "Polybius/Tap: Der Schlüssel ist optional (mischt das Quadrat). Diakritika werden auf den Grundbuchstaben reduziert (ă → a); das Ergebnis kann Diakritika verlieren.");

D("ci.pf.note", "Playfair împarte textul în digrame, înlocuiește J cu I și adaugă X între litere identice și la final; la decifrare rămân aceste X-uri.", "Playfair splits the text into digraphs, replaces J with I and inserts X between double letters and at the end; decryption leaves these X's in place.", "Playfair découpe le texte en digrammes, remplace J par I et insère X entre lettres doubles et à la fin ; le déchiffrement laisse ces X en place.", "Playfair divide il testo in digrammi, sostituisce J con I e inserisce X tra lettere doppie e in fondo; la decifratura lascia questi X al loro posto.", "Playfair divide el texto en dígrafos, sustituye J por I e inserta X entre letras dobles y al final; el descifrado deja esas X.", "Playfair divide o texto em digramas, substitui J por I e insere X entre letras duplas e no fim; a decifração mantém esses X.", "A Playfair a szöveget betűpárokra bontja, a J-t I-re cseréli, és X-et szúr be az ikerbetűk közé és a végére; visszafejtéskor ezek az X-ek megmaradnak.", "Playfair teilt den Text in Digramme, ersetzt J durch I und fügt X zwischen Doppelbuchstaben und am Ende ein; beim Entschlüsseln bleiben diese X erhalten.");

D("ci.d.caesar", "Cezar: fiecare literă se deplasează cu k poziții în alfabet (modulo 26). Doar 25 de chei posibile.", "Caesar: each letter is shifted k places in the alphabet (mod 26). Only 25 possible keys.", "César : chaque lettre est décalée de k positions dans l'alphabet (mod 26). Seulement 25 clés possibles.", "Cesare: ogni lettera è spostata di k posizioni nell'alfabeto (mod 26). Solo 25 chiavi possibili.", "César: cada letra se desplaza k posiciones en el alfabeto (mod 26). Solo 25 claves posibles.", "César: cada letra é deslocada k posições no alfabeto (mod 26). Apenas 25 chaves possíveis.", "Caesar: minden betű k hellyel tolódik az ábécében (mod 26). Csak 25 lehetséges kulcs.", "Caesar: jeder Buchstabe wird um k Stellen im Alphabet verschoben (mod 26). Nur 25 mögliche Schlüssel.");
D("ci.d.rot13", "ROT13: Cezar cu deplasarea 13; aplicat de două ori redă textul (propria inversă).", "ROT13: Caesar with shift 13; applying it twice restores the text (its own inverse).", "ROT13 : César avec décalage 13 ; l'appliquer deux fois redonne le texte (sa propre inverse).", "ROT13: Cesare con scorrimento 13; applicato due volte restituisce il testo (è la propria inversa).", "ROT13: César con desplazamiento 13; aplicarlo dos veces devuelve el texto (es su propia inversa).", "ROT13: César com deslocamento 13; aplicá-lo duas vezes devolve o texto (é a sua própria inversa).", "ROT13: Caesar 13-as eltolással; kétszer alkalmazva visszaadja a szöveget (önmaga inverze).", "ROT13: Caesar mit Verschiebung 13; zweimal angewendet ergibt wieder den Text (eigene Umkehrung).");
D("ci.d.atbash", "Atbash: alfabetul inversat (A↔Z, B↔Y…); fără cheie, propria inversă.", "Atbash: the reversed alphabet (A↔Z, B↔Y…); no key, its own inverse.", "Atbash : l'alphabet inversé (A↔Z, B↔Y…) ; sans clé, sa propre inverse.", "Atbash: l'alfabeto invertito (A↔Z, B↔Y…); senza chiave, è la propria inversa.", "Atbash: el alfabeto invertido (A↔Z, B↔Y…); sin clave, es su propia inversa.", "Atbash: o alfabeto invertido (A↔Z, B↔Y…); sem chave, é a sua própria inversa.", "Atbash: a megfordított ábécé (A↔Z, B↔Y…); kulcs nélkül, önmaga inverze.", "Atbash: das umgekehrte Alphabet (A↔Z, B↔Y…); ohne Schlüssel, eigene Umkehrung.");
D("ci.d.vigenere", "Vigenère: Cezar cu deplasare variabilă; litera cheii (repetată) dă deplasarea fiecărei litere: C = P + K (mod 26).", "Vigenère: Caesar with a varying shift; the (repeated) key letter gives each letter's shift: C = P + K (mod 26).", "Vigenère : César à décalage variable ; la lettre de la clé (répétée) donne le décalage de chaque lettre : C = P + K (mod 26).", "Vigenère: Cesare con scorrimento variabile; la lettera della chiave (ripetuta) dà lo scorrimento di ogni lettera: C = P + K (mod 26).", "Vigenère: César con desplazamiento variable; la letra de la clave (repetida) da el desplazamiento de cada letra: C = P + K (mod 26).", "Vigenère: César com deslocamento variável; a letra da chave (repetida) dá o deslocamento de cada letra: C = P + K (mod 26).", "Vigenère: változó eltolású Caesar; a (ismétlődő) kulcsbetű adja az eltolást: C = P + K (mod 26).", "Vigenère: Caesar mit wechselnder Verschiebung; der (wiederholte) Schlüsselbuchstabe gibt die Verschiebung: C = P + K (mod 26).");
D("ci.d.beaufort", "Beaufort: C = K − P (mod 26); aceeași operație cifrează și decifrează (reciprocă).", "Beaufort: C = K − P (mod 26); the same operation encrypts and decrypts (reciprocal).", "Beaufort : C = K − P (mod 26) ; la même opération chiffre et déchiffre (réciproque).", "Beaufort: C = K − P (mod 26); la stessa operazione cifra e decifra (reciproca).", "Beaufort: C = K − P (mod 26); la misma operación cifra y descifra (recíproca).", "Beaufort: C = K − P (mod 26); a mesma operação cifra e decifra (recíproca).", "Beaufort: C = K − P (mod 26); ugyanaz a művelet titkosít és fejt vissza (reciprok).", "Beaufort: C = K − P (mod 26); dieselbe Operation verschlüsselt und entschlüsselt (reziprok).");
D("ci.d.playfair", "Playfair: pătrat 5×5 din cheie (J=I); digrame: același rând → litera din dreapta, aceeași coloană → dedesubt, altfel colțurile dreptunghiului.", "Playfair: 5×5 square from the key (J=I); digraphs: same row → letter to the right, same column → below, otherwise the rectangle's corners.", "Playfair : carré 5×5 issu de la clé (J=I) ; digrammes : même ligne → lettre à droite, même colonne → en dessous, sinon coins du rectangle.", "Playfair: quadrato 5×5 dalla chiave (J=I); digrammi: stessa riga → lettera a destra, stessa colonna → sotto, altrimenti gli angoli del rettangolo.", "Playfair: cuadrado 5×5 a partir de la clave (J=I); dígrafos: misma fila → letra a la derecha, misma columna → debajo, si no las esquinas del rectángulo.", "Playfair: quadrado 5×5 da chave (J=I); digramas: mesma linha → letra à direita, mesma coluna → abaixo, senão os cantos do retângulo.", "Playfair: 5×5-ös négyzet a kulcsból (J=I); betűpárok: azonos sor → jobbra lévő betű, azonos oszlop → alatta, különben a téglalap sarkai.", "Playfair: 5×5-Quadrat aus dem Schlüssel (J=I); Digramme: gleiche Zeile → Buchstabe rechts, gleiche Spalte → darunter, sonst die Rechteckecken.");
D("ci.d.rail", "Rail fence: textul se scrie în zigzag pe n șine și se citește rând cu rând.", "Rail fence: the text is written in a zigzag over n rails and read row by row.", "Rail fence : le texte est écrit en zigzag sur n rails et lu rangée par rangée.", "Rail fence: il testo si scrive a zigzag su n binari e si legge riga per riga.", "Rail fence: el texto se escribe en zigzag sobre n rieles y se lee fila por fila.", "Rail fence: o texto escreve-se em ziguezague em n carris e lê-se linha a linha.", "Rail fence: a szöveget cikcakkban írjuk n sínre, és soronként olvassuk.", "Rail Fence: Der Text wird im Zickzack auf n Schienen geschrieben und zeilenweise gelesen.");
D("ci.d.polybius", "Polybius: pătrat 5×5 (I=J); fiecare literă devine perechea rând-coloană (11–55).", "Polybius: a 5×5 square (I=J); each letter becomes its row-column pair (11–55).", "Polybe : carré 5×5 (I=J) ; chaque lettre devient sa paire ligne-colonne (11–55).", "Polibio: quadrato 5×5 (I=J); ogni lettera diventa la coppia riga-colonna (11–55).", "Polibio: cuadrado 5×5 (I=J); cada letra se convierte en su par fila-columna (11–55).", "Políbio: quadrado 5×5 (I=J); cada letra torna-se o seu par linha-coluna (11–55).", "Polübiosz: 5×5-ös négyzet (I=J); minden betű sor-oszlop párrá válik (11–55).", "Polybios: 5×5-Quadrat (I=J); jeder Buchstabe wird zum Zeilen-Spalten-Paar (11–55).");
D("ci.d.tap", "Tap code: pătrat 5×5 cu C=K; fiecare literă = numărul de lovituri pe rând, pauză, numărul de lovituri pe coloană (aici •).", "Tap code: a 5×5 square with C=K; each letter = number of taps for the row, a pause, taps for the column (shown here as •).", "Tap code : carré 5×5 avec C=K ; chaque lettre = nombre de coups pour la ligne, pause, coups pour la colonne (ici •).", "Tap code: quadrato 5×5 con C=K; ogni lettera = numero di colpi per la riga, pausa, colpi per la colonna (qui •).", "Tap code: cuadrado 5×5 con C=K; cada letra = número de golpes para la fila, pausa, golpes para la columna (aquí •).", "Tap code: quadrado 5×5 com C=K; cada letra = número de toques para a linha, pausa, toques para a coluna (aqui •).", "Tap code: 5×5-ös négyzet C=K-val; minden betű = a sor koppintásainak száma, szünet, az oszlop koppintásai (itt •).", "Tap-Code: 5×5-Quadrat mit C=K; jeder Buchstabe = Anzahl Klopfzeichen für die Zeile, Pause, Klopfzeichen für die Spalte (hier •).");
D("ci.d.a1z26", "A1Z26: A=1 … Z=26; nu este cifru, ci doar o codificare numerică a literelor.", "A1Z26: A=1 … Z=26; not really a cipher, just a numeric encoding of letters.", "A1Z26 : A=1 … Z=26 ; ce n'est pas vraiment un chiffre, seulement un codage numérique des lettres.", "A1Z26: A=1 … Z=26; non è un vero cifrario, solo una codifica numerica delle lettere.", "A1Z26: A=1 … Z=26; no es un cifrado propiamente dicho, solo una codificación numérica de las letras.", "A1Z26: A=1 … Z=26; não é propriamente uma cifra, apenas uma codificação numérica das letras.", "A1Z26: A=1 … Z=26; nem valódi titkosítás, csak a betűk számkódolása.", "A1Z26: A=1 … Z=26; keine echte Chiffre, nur eine numerische Codierung der Buchstaben.");

D("an.intro", "Atac didactic: lipește un text cifrat (cu Cezar sau Vigenère) și vezi frecvențele literelor, indicele de coincidență, testul Kasiski și recuperarea cheii. Funcționează bine pe texte lungi (sute de litere), în limba de referință aleasă.", "Educational attack: paste a ciphertext (Caesar or Vigenère) and see letter frequencies, the index of coincidence, the Kasiski test and key recovery. It works well on long texts (hundreds of letters) in the chosen reference language.", "Attaque pédagogique : collez un texte chiffré (César ou Vigenère) et voyez les fréquences des lettres, l'indice de coïncidence, le test de Kasiski et la récupération de la clé. Fonctionne bien sur de longs textes (des centaines de lettres) dans la langue de référence choisie.", "Attacco didattico: incolla un testo cifrato (Cesare o Vigenère) e guarda le frequenze delle lettere, l'indice di coincidenza, il test di Kasiski e il recupero della chiave. Funziona bene su testi lunghi (centinaia di lettere) nella lingua di riferimento scelta.", "Ataque didáctico: pega un texto cifrado (César o Vigenère) y mira las frecuencias de letras, el índice de coincidencia, la prueba de Kasiski y la recuperación de la clave. Funciona bien con textos largos (cientos de letras) en el idioma de referencia elegido.", "Ataque didático: cole um texto cifrado (César ou Vigenère) e veja as frequências das letras, o índice de coincidência, o teste de Kasiski e a recuperação da chave. Funciona bem com textos longos (centenas de letras) na língua de referência escolhida.", "Oktatási támadás: illesszen be egy titkosított szöveget (Caesar vagy Vigenère), és nézze a betűgyakoriságot, a koincidenciaindexet, a Kasiski-tesztet és a kulcs visszanyerését. Hosszú szövegeken (több száz betű) működik jól a választott referencianyelven.", "Didaktischer Angriff: Chiffrat (Caesar oder Vigenère) einfügen und Buchstabenhäufigkeiten, Koinzidenzindex, Kasiski-Test und Schlüsselrückgewinnung ansehen. Funktioniert gut bei langen Texten (hunderte Buchstaben) in der gewählten Referenzsprache.");

D("an.keynote", "Rezultatul este o estimare statistică: pe texte scurte poate greși. Dacă cheia găsită e o repetiție (ex. SECRETSECRET), cheia reală este perioada de bază.", "The result is a statistical estimate: on short texts it can be wrong. If the key found is a repetition (e.g. SECRETSECRET), the real key is the base period.", "Le résultat est une estimation statistique : sur de courts textes, il peut se tromper. Si la clé trouvée est une répétition (p. ex. SECRETSECRET), la vraie clé est la période de base.", "Il risultato è una stima statistica: su testi brevi può sbagliare. Se la chiave trovata è una ripetizione (es. SECRETSECRET), la chiave reale è il periodo di base.", "El resultado es una estimación estadística: en textos cortos puede equivocarse. Si la clave encontrada es una repetición (p. ej. SECRETSECRET), la clave real es el periodo base.", "O resultado é uma estimativa estatística: em textos curtos pode errar. Se a chave encontrada for uma repetição (p. ex. SECRETSECRET), a chave real é o período base.", "Az eredmény statisztikai becslés: rövid szövegeken tévedhet. Ha a talált kulcs ismétlődés (pl. SECRETSECRET), a valódi kulcs az alapperiódus.", "Das Ergebnis ist eine statistische Schätzung: bei kurzen Texten kann sie falsch sein. Ist der gefundene Schlüssel eine Wiederholung (z. B. SECRETSECRET), ist der echte Schlüssel die Grundperiode.");
