D("dac.nofig", "Această secțiune NU conține figuri. Alfabetul manual (dactilema) diferă de la o limbă a semnelor la alta, iar un desen aproximativ al mâinilor ar putea induce în eroare. De aceea oferim doar explicații în text și trimiteri către surse oficiale.", "This section has NO figures. The manual alphabet (fingerspelling) differs from one sign language to another, and an approximate drawing of hands could mislead. We therefore offer only text explanations and pointers to official sources.", "Cette section ne contient AUCUNE figure. L'alphabet manuel (dactylologie) diffère d'une langue des signes à l'autre, et un dessin approximatif des mains pourrait induire en erreur. Nous ne proposons donc que des explications textuelles et des renvois aux sources officielles.", "Questa sezione NON contiene figure. L'alfabeto manuale (dattilologia) cambia da una lingua dei segni all'altra e un disegno approssimativo delle mani potrebbe trarre in inganno. Offriamo quindi solo spiegazioni testuali e rimandi alle fonti ufficiali.", "Esta sección NO contiene figuras. El alfabeto manual (dactilología) difiere de una lengua de signos a otra, y un dibujo aproximado de las manos podría inducir a error. Por eso ofrecemos solo explicaciones en texto y remisiones a fuentes oficiales.", "Esta secção NÃO contém figuras. O alfabeto manual (dactilologia) difere de uma língua gestual para outra, e um desenho aproximado das mãos poderia induzir em erro. Por isso oferecemos apenas explicações em texto e remissões para fontes oficiais.", "Ez a rész NEM tartalmaz ábrákat. A kézi ábécé (ujjábécé) jelnyelvenként eltér, és a kezek hozzávetőleges rajza félrevezethet. Ezért csak szöveges magyarázatot és a hivatalos forrásokra való utalást adunk.", "Dieser Abschnitt enthält KEINE Abbildungen. Das Fingeralphabet unterscheidet sich von Gebärdensprache zu Gebärdensprache, und eine ungefähre Handzeichnung könnte in die Irre führen. Wir bieten daher nur Texterklärungen und Hinweise auf offizielle Quellen.");
D("dac.what", "Ce este dactilema", "What fingerspelling is", "Ce qu'est la dactylologie", "Che cos'è la dattilologia", "Qué es la dactilología", "O que é a dactilologia", "Mi az ujjábécé", "Was das Fingeralphabet ist");
D("dac.what.d", "Dactilema (alfabetul manual) reprezintă literele scrise cu configurații ale mâinii. Se folosește în limbile semnelor pentru nume proprii, termeni fără semn și epelare. Nu este o limbă în sine și nu înlocuiește limba semnelor.", "Fingerspelling (the manual alphabet) represents written letters with hand shapes. Sign languages use it for proper names, terms without a sign and spelling. It is not a language by itself and does not replace sign language.", "La dactylologie (alphabet manuel) représente les lettres écrites par des configurations de la main. Les langues des signes l'utilisent pour les noms propres, les termes sans signe et l'épellation. Ce n'est pas une langue en soi et elle ne remplace pas la langue des signes.", "La dattilologia (alfabeto manuale) rappresenta le lettere scritte con configurazioni della mano. Le lingue dei segni la usano per nomi propri, termini senza segno e compitazione. Non è una lingua a sé e non sostituisce la lingua dei segni.", "La dactilología (alfabeto manual) representa las letras escritas con configuraciones de la mano. Las lenguas de signos la usan para nombres propios, términos sin signo y deletreo. No es una lengua en sí y no sustituye a la lengua de signos.", "A dactilologia (alfabeto manual) representa as letras escritas com configurações da mão. As línguas gestuais usam-na para nomes próprios, termos sem gesto e soletração. Não é uma língua em si e não substitui a língua gestual.", "Az ujjábécé (kézi ábécé) az írott betűket kézformákkal ábrázolja. A jelnyelvek tulajdonnevekhez, jel nélküli kifejezésekhez és betűzéshez használják. Önmagában nem nyelv, és nem helyettesíti a jelnyelvet.", "Das Fingeralphabet (manuelles Alphabet) stellt geschriebene Buchstaben durch Handformen dar. Gebärdensprachen nutzen es für Eigennamen, Begriffe ohne Gebärde und zum Buchstabieren. Es ist keine eigene Sprache und ersetzt die Gebärdensprache nicht.");
D("dac.sources", "Surse oficiale (fără exactitate pretinsă aici)", "Official sources (no accuracy claimed here)", "Sources officielles (aucune exactitude revendiquée ici)", "Fonti ufficiali (nessuna accuratezza dichiarata qui)", "Fuentes oficiales (aquí no se afirma exactitud)", "Fontes oficiais (aqui não se afirma exatidão)", "Hivatalos források (itt nem állítunk pontosságot)", "Offizielle Quellen (hier wird keine Genauigkeit behauptet)");
D("dac.s1", "România: Asociația Națională a Surzilor din România (ANSR) și dicționarele/materialele oficiale ale Limbii Semnelor Române (LSR).", "Romania: the National Association of the Deaf of Romania (ANSR) and the official dictionaries/materials of Romanian Sign Language (LSR).", "Roumanie : l'Association nationale des sourds de Roumanie (ANSR) et les dictionnaires/supports officiels de la langue des signes roumaine (LSR).", "Romania: l'Associazione nazionale dei sordi di Romania (ANSR) e i dizionari/materiali ufficiali della lingua dei segni rumena (LSR).", "Rumanía: la Asociación Nacional de Sordos de Rumanía (ANSR) y los diccionarios/materiales oficiales de la lengua de signos rumana (LSR).", "Roménia: a Associação Nacional de Surdos da Roménia (ANSR) e os dicionários/materiais oficiais da língua gestual romena (LSR).", "Románia: a Román Siketek Országos Szövetsége (ANSR) és a román jelnyelv (LSR) hivatalos szótárai/anyagai.", "Rumänien: der Nationale Gehörlosenverband Rumäniens (ANSR) und die offiziellen Wörterbücher/Materialien der Rumänischen Gebärdensprache (LSR).");
D("dac.s2", "Internațional: World Federation of the Deaf (WFD), federațiile naționale ale persoanelor surde din fiecare țară.", "International: the World Federation of the Deaf (WFD) and each country's national federation of the deaf.", "International : la Fédération mondiale des sourds (WFD) et les fédérations nationales de sourds de chaque pays.", "Internazionale: la Federazione mondiale dei sordi (WFD) e le federazioni nazionali dei sordi di ogni paese.", "Internacional: la Federación Mundial de Sordos (WFD) y las federaciones nacionales de personas sordas de cada país.", "Internacional: a Federação Mundial de Surdos (WFD) e as federações nacionais de surdos de cada país.", "Nemzetközi: a Siketek Világszövetsége (WFD) és az egyes országok siketszövetségei.", "International: der Weltverband der Gehörlosen (WFD) und die nationalen Gehörlosenverbände der einzelnen Länder.");
D("dac.s3", "Pentru învățare reală: cursuri cu persoane surde native și materiale video oficiale ale organizațiilor de mai sus.", "For real learning: courses with native deaf signers and official video materials from the organisations above.", "Pour un véritable apprentissage : cours avec des personnes sourdes natives et supports vidéo officiels des organisations ci-dessus.", "Per un apprendimento reale: corsi con persone sorde native e materiali video ufficiali delle organizzazioni sopra indicate.", "Para un aprendizaje real: cursos con personas sordas nativas y materiales de vídeo oficiales de las organizaciones anteriores.", "Para uma aprendizagem real: cursos com pessoas surdas nativas e materiais de vídeo oficiais das organizações acima.", "Valódi tanuláshoz: anyanyelvi siket oktatókkal tartott tanfolyamok és a fenti szervezetek hivatalos videóanyagai.", "Zum echten Lernen: Kurse mit gehörlosen Muttersprachlern und offizielle Videomaterialien der obigen Organisationen.");
D("dac.tips", "Sfaturi", "Tips", "Conseils", "Consigli", "Consejos", "Dicas", "Tippek", "Tipps");
D("dac.tip1", "Fiecare țară/limbă a semnelor are propriul alfabet manual; nu presupune că cel învățat într-un loc este valabil în altul.", "Each country/sign language has its own manual alphabet; do not assume that the one learned in one place applies elsewhere.", "Chaque pays/langue des signes a son propre alphabet manuel ; ne présumez pas que celui appris ailleurs vaut ici.", "Ogni paese/lingua dei segni ha il proprio alfabeto manuale; non presumere che quello imparato altrove valga qui.", "Cada país/lengua de signos tiene su propio alfabeto manual; no supongas que el aprendido en un lugar vale en otro.", "Cada país/língua gestual tem o seu próprio alfabeto manual; não presuma que o aprendido num lugar vale noutro.", "Minden országnak/jelnyelvnek saját kézi ábécéje van; ne feltételezze, hogy az egyik helyen tanult máshol is érvényes.", "Jedes Land bzw. jede Gebärdensprache hat ein eigenes Fingeralphabet; nimm nicht an, dass das anderswo Gelernte hier gilt.");
D("dac.tip2", "Dactilema se citește în ansamblu, pe cuvinte, nu literă cu literă.", "Fingerspelling is read as whole words, not letter by letter.", "La dactylologie se lit par mots entiers, pas lettre à lettre.", "La dattilologia si legge per parole intere, non lettera per lettera.", "La dactilología se lee por palabras enteras, no letra a letra.", "A dactilologia lê-se por palavras inteiras, não letra a letra.", "Az ujjábécét egész szavanként olvassuk, nem betűről betűre.", "Das Fingeralphabet liest man in ganzen Wörtern, nicht Buchstabe für Buchstabe.");
D("dac.tip3", "Nu exersa fără feedback de la un vorbitor nativ; aplicația nu poate evalua forma mâinii.", "Do not practise without feedback from a native signer; the app cannot assess hand shapes.", "Ne vous exercez pas sans retour d'un locuteur natif ; l'application ne peut pas évaluer la forme de la main.", "Non esercitarti senza il riscontro di un segnante nativo; l'app non può valutare la forma della mano.", "No practiques sin retroalimentación de un signante nativo; la app no puede evaluar la forma de la mano.", "Não pratique sem feedback de um gestuante nativo; a app não pode avaliar a forma da mão.", "Ne gyakoroljon anyanyelvi jelelő visszajelzése nélkül; az alkalmazás nem tudja értékelni a kézformát.", "Übe nicht ohne Rückmeldung eines Muttersprachlers; die App kann Handformen nicht beurteilen.");
D("dac.asl", "Exemplu orientativ: descrieri scurte pentru alfabetul manual ASL (SUA), în engleză", "Indicative example: short descriptions of the ASL (USA) manual alphabet, in English", "Exemple indicatif : courtes descriptions de l'alphabet manuel ASL (États-Unis), en anglais", "Esempio indicativo: brevi descrizioni dell'alfabeto manuale ASL (USA), in inglese", "Ejemplo orientativo: descripciones breves del alfabeto manual ASL (EE. UU.), en inglés", "Exemplo indicativo: descrições curtas do alfabeto manual ASL (EUA), em inglês", "Tájékoztató példa: az ASL (USA) kézi ábécé rövid leírásai angolul", "Orientierendes Beispiel: Kurzbeschreibungen des ASL-Fingeralphabets (USA), auf Englisch");
D("dac.asl.note", "Descrierile ASL sunt orientative, NU sunt pentru Limba Semnelor Române și nu garantează execuția corectă; literele J și Z implică mișcare. Pentru forma exactă consultă sursele oficiale.", "The ASL descriptions are indicative, NOT for Romanian Sign Language, and do not guarantee correct execution; the letters J and Z involve movement. For the exact form consult the official sources.", "Les descriptions ASL sont indicatives, NON pour la langue des signes roumaine, et ne garantissent pas une exécution correcte ; les lettres J et Z impliquent un mouvement. Pour la forme exacte, consultez les sources officielles.", "Le descrizioni ASL sono indicative, NON per la lingua dei segni rumena, e non garantiscono un'esecuzione corretta; le lettere J e Z implicano movimento. Per la forma esatta consulta le fonti ufficiali.", "Las descripciones ASL son orientativas, NO para la lengua de signos rumana, y no garantizan una ejecución correcta; las letras J y Z implican movimiento. Para la forma exacta consulta las fuentes oficiales.", "As descrições ASL são indicativas, NÃO para a língua gestual romena, e não garantem uma execução correta; as letras J e Z implicam movimento. Para a forma exata consulte as fontes oficiais.", "Az ASL-leírások tájékoztató jellegűek, NEM a román jelnyelvre vonatkoznak, és nem garantálják a helyes kivitelezést; a J és Z betű mozgással jár. A pontos alakért forduljon a hivatalos forrásokhoz.", "Die ASL-Beschreibungen sind orientierend, NICHT für die Rumänische Gebärdensprache, und garantieren keine korrekte Ausführung; die Buchstaben J und Z enthalten eine Bewegung. Für die genaue Form die offiziellen Quellen konsultieren.");
